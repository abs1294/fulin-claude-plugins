<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session 看板</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #FFFFFF; --side: #F7F7F5; --ink: #37352F; --dim: #787774; --faint: #A5A29A;
    --line: #E9E9E7; --hover: #EFEFED; --active: #E8E7E3; --bubble: #F1F1EF; --code: #F7F6F3;
    --accent: #2383E2; --accent-ink: #FFFFFF; --amber: #D9730D; --amber-soft: #FBF3DB;
    --green: #0F7B6C; --red: #E03E3E; --red-soft: #FDEBEC;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    --mono: "Cascadia Mono", "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191919; --side: #202020; --ink: #E3E2E0; --dim: #9B9A97; --faint: #6F6E69;
      --line: #2F2F2F; --hover: #2A2A2A; --active: #333333; --bubble: #2A2A2A; --code: #252525;
      --accent: #529CCA; --accent-ink: #10202B; --amber: #FFA344; --amber-soft: #3A2E1A;
      --green: #4DAB9A; --red: #FF7369; --red-soft: #3B2423;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14.5px; line-height: 1.55; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, textarea:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .app { display: grid; grid-template-columns: 296px minmax(0, 1fr); height: 100vh; height: 100dvh; }

  /* ── sidebar ── */
  .side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .side-top { padding: 14px 12px 10px; display: flex; align-items: center; gap: 8px; }
  .side-top h1 { margin: 0; font-size: 14px; font-weight: 600; flex: 1; padding-left: 6px; }
  .btn { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 5px 10px; font-size: 13px; white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
  .btn.danger { color: var(--red); }
  .btn:disabled { opacity: .45; cursor: default; }
  .list { flex: 1; overflow-y: auto; padding: 0 6px 16px; min-height: 0; }
  .group { margin-top: 12px; }
  .group-head { display: flex; align-items: center; padding: 2px 4px 2px 8px; color: var(--dim); font-size: 12px; font-weight: 600; }
  .group-head span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .group-head button { border: 0; background: none; color: var(--dim); border-radius: 4px; width: 22px; height: 22px; line-height: 1; font-size: 16px; }
  .group-head button:hover { background: var(--hover); color: var(--ink); }
  button.item { display: grid; grid-template-columns: 14px minmax(0, 1fr); column-gap: 6px; width: 100%; text-align: left; border: 0; background: none; border-radius: 6px; padding: 6px 8px; }
  button.item:hover { background: var(--hover); }
  button.item.active { background: var(--active); }
  .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: var(--faint); }
  .dot.yours { background: var(--amber); }
  .dot.done { background: var(--green); }
  .dot.running { background: var(--green); animation: beat 1.6s ease-in-out infinite; }
  @keyframes beat { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .dot.running { animation: none; } }
  .item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item.yours .t { font-weight: 600; }
  .item .m { grid-column: 2; font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item.yours .m { color: var(--amber); }
  /* Third line: the latest thing you said there, to tell apart sessions of one project. */
  /* "Kept": comes back after a restart. A tick on the row itself, on the right; pressing it does not open the session. */
  button.item { grid-template-columns: 14px minmax(0, 1fr) auto; }
  .item .pin { grid-column: 3; grid-row: 1; align-self: center; width: 15px; height: 15px; border: 1.5px solid var(--faint); border-radius: 3px; display: grid; place-items: center; font-size: 11px; line-height: 1; color: transparent; cursor: pointer; }
  .item .pin.on { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
  .item .pin:hover { border-color: var(--accent); }
  .item .said { grid-column: 2; font-size: 12px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item.hid { opacity: .55; }
  .side-top h1 button { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
  .side-top h1 button:hover { text-decoration: underline; }
  /* inbox */
  /* The sources, as a carousel: every card the same size, three in a row (one on a narrow window). When they all fit there is nothing to move, and the arrows and dots are not shown. */
  .car.fits { grid-template-columns: minmax(0, 1fr); } .car.fits .arrow { display: none; }
  .car { display: grid; grid-template-columns: 28px minmax(0, 1fr) 28px; gap: 6px; align-items: center; margin: 4px 0 4px; }
  .car .arrow { width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 50%; background: var(--bg); color: var(--dim); font-size: 16px; line-height: 1; padding: 0; }
  .car .arrow:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
  .car .arrow:disabled { opacity: .3; cursor: default; }
  .srcs { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 2px; scrollbar-width: none; padding: 2px; }
  .srcs::-webkit-scrollbar { display: none; }
  .src { flex: 0 0 calc((100% - 20px) / 3); box-sizing: border-box; height: 124px; scroll-snap-align: start; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .src b { display: block; font-size: 14px; font-weight: 600; }
  .src span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--dim); font-size: 12px; line-height: 1.5; margin-top: 2px; overflow-wrap: anywhere; }
  .src.off b { color: var(--dim); } .src.alarm span { color: var(--red); }
  .src .btn { margin-top: auto; align-self: flex-start; font-size: 12px; padding: 4px 10px; }
  /* A source card is also the filter for the list under it: press it to list only that source, again to list all. */
  button.src { background: var(--bg); color: inherit; font: inherit; text-align: left; cursor: pointer; }
  button.src:hover { background: var(--hover); }
  button.src.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  button.src.sel b::after { content: "　只看這個"; color: var(--accent); font-weight: 400; font-size: 12px; }
  /* The three pages of the inbox. */
  .ptabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 0 0 16px; }
  .ptabs button { border: 0; background: none; padding: 8px 14px; font-size: 14px; color: var(--dim); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .ptabs button:hover { color: var(--ink); }
  .ptabs button.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
  .ptabs small { color: var(--dim); font-weight: 400; margin-left: 4px; }
  .dots { display: flex; justify-content: center; gap: 6px; margin: 2px 0 12px; }
  .dots button { width: 7px; height: 7px; padding: 0; border: 0; border-radius: 50%; background: var(--line); }
  .dots button.on { background: var(--accent); }
  @media (max-width: 640px) { .src { flex-basis: 100%; } }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 6px 0 8px; }
  .tabs .btn.on { background: var(--active); font-weight: 600; }
  .tabs input { flex: 1 1 160px; min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; background: var(--bg); color: inherit; font: inherit; font-size: 13px; }
  button.thr { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 2px 10px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 9px 6px; }
  button.thr:hover { background: var(--hover); }
  .thr .tag { grid-row: 1 / span 2; align-self: start; font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 1px 0; text-align: center; margin-top: 2px; }
  .thr .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* What triage found, in front of the title. */
  .thr .kind { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 4px; padding: 0 6px; margin-right: 8px; vertical-align: 1px; border: 1px solid var(--line); color: var(--dim); }
  .thr .kind.todo, .thr .kind.question { color: var(--amber); border-color: var(--amber); }
  .thr .kind { font-variant-numeric: tabular-nums; }
  .thr .kind.unsure { border-style: dashed; }   /* under 70%: the judgement itself says it is a guess */
  .thr .sum { grid-column: 2 / span 2; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .thr.unread .t { font-weight: 600; }
  .thr .w { color: var(--dim); font-size: 12px; white-space: nowrap; }
  .thr .p { grid-column: 2 / span 2; color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* What can be done with a thread, under the title and always in view: the messages scroll, this does not. */
  .tbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 20px; border-bottom: 1px solid var(--line); background: var(--bg); }
  .tbar label { color: var(--dim); font-size: 13px; white-space: nowrap; }
  /* The thread's header: a row of actions, a row of properties (as on a task page in Asana or Notion), one line of summary. */
  .tbar.th { display: block; padding: 10px 20px; }
  .tb-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; }
  .tb-row + .tb-row { margin-top: 8px; }
  .tb-sp { flex: 1 1 0; }
  .tb-row .lnk { border: 0; background: none; padding: 2px 4px; color: var(--dim); font-size: 13px; border-radius: 4px; }
  .tb-row .lnk:hover { color: var(--ink); background: var(--hover); }
  .tb-props { gap: 6px 18px; }
  .propwrap { position: relative; display: inline-flex; align-items: center; gap: 4px; min-width: 0; max-width: 100%; }
  .plabel { color: var(--dim); font-size: 12px; white-space: nowrap; }
  .prop { display: inline-flex; align-items: baseline; gap: 8px; min-width: 0; max-width: min(100%, 640px); border: 1px solid transparent; background: none; border-radius: 6px; padding: 3px 8px; font-size: 13px; text-align: left; }
  .prop:hover, .prop[aria-expanded=true] { background: var(--hover); }
  .prop b { font-weight: 600; white-space: nowrap; }
  .prop .path { color: var(--faint); font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .prop.empty { color: var(--accent); border: 1px dashed var(--line); }
  .pval { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; max-width: 320px; }
  .pval.mono { font-family: var(--mono); font-size: 12px; color: var(--faint); }
  .pop { position: absolute; top: calc(100% + 4px); left: 0; z-index: 30; width: min(460px, calc(100vw - 48px)); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, .16); padding: 6px; }
  .pop h4 { margin: 6px 8px 4px; font-size: 11px; font-weight: 600; color: var(--faint); }
  .pop hr { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }
  .popitem { display: flex; flex-direction: column; align-items: flex-start; width: 100%; border: 0; background: none; border-radius: 6px; padding: 6px 8px; text-align: left; font-size: 13px; min-width: 0; }
  .popitem:hover, .popitem:focus-visible { background: var(--hover); }
  .popitem span { color: var(--faint); font-family: var(--mono); font-size: 11.5px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .popitem.danger { color: var(--red); }
  .tbar .pop input { display: block; width: 100%; box-sizing: border-box; flex: none; margin: 2px 0; }
  .tbar input { flex: 1 1 260px; min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; background: var(--bg); color: inherit; font: inherit; font-family: var(--mono); font-size: 13px; }
  .tbar .note { flex-basis: 100%; color: var(--faint); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tmsg { margin: 0 0 14px; }
  /* A chat message you can pick: the whole message is the target, the box shows the state. */
  .tmsg.pick { cursor: pointer; border-radius: 8px; padding: 6px 8px 6px 34px; margin: 0 -8px 6px -34px; position: relative; }
  .tmsg.pick:hover { background: var(--hover); }
  .tmsg.pick.on { background: var(--active); }
  .tmsg.pick input { position: absolute; left: 10px; top: 9px; width: 15px; height: 15px; margin: 0; accent-color: var(--accent); }
  .tbar .count { color: var(--dim); font-size: 13px; white-space: nowrap; }
  /* A chat thread (Teams, Slack), laid out the way Teams lays one out: theirs on the left with a round
     avatar, name and time once per run of messages; yours on the right in a tinted bubble; a line with the
     date where the day changes. The tick that picks a message sits beside its bubble and shows on hover. */
  .tmsg.chat { display: flex; align-items: flex-start; gap: 10px; margin: 2px 0; padding: 0; border-radius: 0; cursor: default; }
  .tmsg.chat:hover, .tmsg.chat.on { background: none; }
  .tmsg.chat.first { margin-top: 14px; }
  .tmsg.chat.out { flex-direction: row-reverse; }
  .tc-av { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 600; letter-spacing: .02em; margin-top: 18px; }
  .tc-av.sp { visibility: hidden; height: 0; margin: 0; }
  .tc-main { min-width: 0; max-width: min(72%, 640px); display: flex; flex-direction: column; align-items: flex-start; }
  .tmsg.chat.out .tc-main { align-items: flex-end; }
  .tc-head { font-size: 12px; color: var(--dim); margin: 0 2px 3px; white-space: nowrap; }
  .tc-head b { font-weight: 600; color: var(--ink); margin-right: 8px; }
  .tc-row { display: flex; align-items: center; gap: 8px; max-width: 100%; }
  .tmsg.chat.out .tc-row { flex-direction: row-reverse; }
  .tmsg.chat .body { background: var(--bubble); border-radius: 6px; padding: 7px 12px; max-width: 100%; min-width: 0; cursor: pointer; }
  .tmsg.chat.out .body { background: color-mix(in srgb, var(--accent) 16%, var(--bg)); border-radius: 6px; }
  .tmsg.chat .body:hover { filter: brightness(.97); }
  .tmsg.chat.on .body { box-shadow: 0 0 0 2px var(--accent); }
  .tmsg.chat input { position: static; flex: none; width: 16px; height: 16px; margin: 0; border-radius: 50%; accent-color: var(--accent); opacity: 0; cursor: pointer; }
  .tmsg.chat:hover input, .tmsg.chat.on input, .tmsg.chat input:focus-visible { opacity: 1; }
  .tc-day { display: flex; align-items: center; gap: 12px; color: var(--dim); font-size: 12px; margin: 20px 0 4px; }
  .tc-day::before, .tc-day::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .tmsg .who2 { font-size: 12px; color: var(--dim); margin-bottom: 2px; }
  .tmsg .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .tmsg.out { display: flex; flex-direction: column; align-items: flex-end; }
  .tmsg.out .body { background: var(--bubble); border-radius: 14px; padding: 8px 14px; max-width: 78%; }
  .rtable { width: 100%; border-collapse: collapse; font-size: 13px; }
  .rtable td, .rtable th { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  .rtable th { color: var(--dim); font-weight: 600; font-size: 12px; }
  .form { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 8px 10px; align-items: center; margin-top: 10px; }
  .form input, .form select { border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; background: var(--bg); color: inherit; font: inherit; font-size: 13px; min-width: 0; }
  .form label { color: var(--dim); font-size: 13px; }
  .list-more { display: block; width: 100%; margin-top: 10px; border: 0; background: none; color: var(--dim); font-size: 12px; text-align: left; padding: 4px 8px; border-radius: 6px; }
  .list-more:hover { background: var(--hover); color: var(--ink); }
  .past { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; border-bottom: 1px solid var(--line); padding: 8px 6px; }
  .past:hover { background: var(--hover); }
  .past .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .past .p { grid-column: 1; color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .past .acts { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 6px; }
  .past .acts .btn { padding: 3px 8px; font-size: 12px; }
  /* Old conversations, one block per folder: the folder's name is the heading; press it to open or close the block. */
  details.pgroup { border-bottom: 1px solid var(--line); }
  details.pgroup > summary { display: flex; align-items: baseline; gap: 10px; padding: 9px 6px; cursor: pointer; list-style: none; border-radius: 6px; }
  details.pgroup > summary::-webkit-details-marker { display: none; }
  details.pgroup > summary::before { content: "\25B8"; color: var(--dim); width: 12px; flex: none; }
  details.pgroup[open] > summary::before { content: "\25BE"; }
  details.pgroup > summary:hover { background: var(--hover); }
  details.pgroup .pg-name { font-weight: 600; white-space: nowrap; }
  details.pgroup .pg-n { color: var(--dim); font-size: 12px; white-space: nowrap; }
  details.pgroup .pg-path { flex: 1; min-width: 0; color: var(--faint); font-size: 12px; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  details.pgroup .pg-when { color: var(--dim); font-size: 12px; white-space: nowrap; }
  details.pgroup .pg-rows { padding: 0 0 6px 22px; }
  details.pgroup .past:last-of-type { border-bottom: 0; }
  /* Account limits, always in view at the bottom of the sidebar whatever is open on the right. */
  .side-quota { padding: 8px 14px 6px; border-top: 1px solid var(--line); font-size: 12px; }
  .side-quota[hidden] { display: none; }
  .sq { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 2px 0; }
  .sq .sl { color: var(--dim); white-space: nowrap; }
  .sq b { font-variant-numeric: tabular-nums; }
  .sq .sr { grid-column: 1 / -1; color: var(--faint); margin-top: -1px; }
  .side-foot { padding: 8px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--dim); }
  .side-foot.down { color: var(--red); }

  /* ── main ── */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .head { display: flex; align-items: center; gap: 10px; padding: 10px 20px; border-bottom: 1px solid var(--line); min-height: 56px; }
  .head .back { display: none; }
  .head .who { flex: 1; min-width: 0; }
  .head .who .t { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .head .who .s { font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .head .who .s b { font-weight: 600; }
  .head .who .s b.yours { color: var(--amber); } .head .who .s b.running { color: var(--green); }

  .scroll { flex: 1; overflow-y: auto; min-height: 0; }
  .scrollwrap { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .jump { position: absolute; right: 22px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .jump .btn { border-radius: 16px; box-shadow: 0 2px 10px rgba(0, 0, 0, .14); }
  .msg.user.flash > div { animation: flash 1.2s ease-out; }
  @keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 3px transparent; } }
  .cmds { position: absolute; left: 0; right: 0; bottom: calc(100% + 6px); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 24px rgba(0, 0, 0, .16); max-height: 320px; overflow-y: auto; z-index: 3; padding: 4px; }
  .cmds[hidden] { display: none; }
  button.cmd { display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left; border: 0; background: none; border-radius: 5px; padding: 5px 10px; font-family: var(--mono); font-size: 13px; }
  button.cmd:hover, button.cmd.sel { background: var(--active); }
  button.cmd .cn { flex: none; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button.cmd .tag { margin-left: auto; font-family: var(--sans); font-size: 12px; color: var(--dim); white-space: nowrap; }
  button.cmd .cd { flex: 1; min-width: 0; font-family: var(--sans); font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cmd-note { padding: 6px 10px; font-size: 12px; color: var(--dim); }
  .col { max-width: 820px; margin: 0 auto; padding: 20px 20px 12px; }
  .msg { margin: 0 0 14px; overflow-wrap: anywhere; }
  .msg.user { display: flex; justify-content: flex-end; }

  .msg.assistant.streaming { white-space: pre-wrap; }
  .msg.assistant.streaming::after { content: "\258D"; color: var(--accent); margin-left: 1px; animation: caret 1s steps(2) infinite; }
  @keyframes caret { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .msg.assistant.streaming::after { animation: none; } }
  .msg.assistant > :first-child { margin-top: 0; } .msg.assistant > :last-child { margin-bottom: 0; }
  .msg.assistant p { margin: 0 0 10px; }
  .msg.assistant h1, .msg.assistant h2, .msg.assistant h3, .msg.assistant h4 { font-size: 15px; font-weight: 600; margin: 18px 0 6px; }
  .msg.assistant ul, .msg.assistant ol { margin: 0 0 10px; padding-left: 22px; }
  .msg.assistant li { margin: 2px 0; }
  .msg.assistant code { font-family: var(--mono); font-size: 12.5px; background: var(--code); border-radius: 4px; padding: 1px 5px; }
  .msg.assistant pre { background: var(--code); border-radius: 6px; padding: 10px 12px; overflow-x: auto; margin: 0 0 10px; }
  .msg.assistant pre code { background: none; padding: 0; white-space: pre; }
  .msg.assistant .tw { overflow-x: auto; margin: 0 0 10px; }
  .msg.assistant table { border-collapse: collapse; font-size: 13.5px; }
  .msg.assistant th, .msg.assistant td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
  .msg.assistant th { background: var(--side); font-weight: 600; }
  .msg.assistant a { color: var(--accent); }
  .msg.assistant hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  details.tools { margin: 0 0 14px; font-size: 13px; color: var(--dim); }
  details.tools summary { cursor: pointer; list-style: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-radius: 4px; padding: 2px 4px; margin-left: -4px; }
  details.tools summary::-webkit-details-marker { display: none; }
  details.tools summary::before { content: "\25B8"; display: inline-block; width: 14px; }
  details.tools[open] summary::before { content: "\25BE"; }
  details.tools summary:hover { background: var(--hover); }
  details.tools .tl { padding: 1px 0 1px 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  details.tools b { font-weight: 600; font-family: var(--mono); font-size: 12px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin: 0 0 14px; }
  .card.perm { border-color: var(--amber); background: var(--amber-soft); }
  .card.err { border-color: var(--red); background: var(--red-soft); }
  .card .q { font-weight: 600; margin-bottom: 2px; }
  .card .d { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; margin-bottom: 10px; }
  .card .row { display: flex; gap: 8px; }
  /* A form of questions Claude asked: read-only from a terminal session, fillable in a board conversation. */
  .card.ask.pending { border-color: var(--amber); background: var(--amber-soft); }
  .aq { margin-top: 12px; }
  .aqh { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .aqq { font-weight: 600; }
  .aqm { font-size: 12px; color: var(--dim); }
  .opt { display: flex; gap: 8px; align-items: flex-start; padding: 3px 0; }
  .opt .ob { color: var(--faint); }
  .opt .od { color: var(--dim); font-size: 13px; }
  .opt .ot { flex: 1; min-width: 0; }
  .opt input[type=radio], .opt input[type=checkbox] { margin-top: 5px; flex: none; }
  label.opt { cursor: pointer; }
  .opt input.other { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; background: var(--bg); color: inherit; font: inherit; }
  .asknote { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; }
  .asknote > span { flex: 1; min-width: 200px; }
  .answered { margin: 0 0 14px; padding: 8px 12px; border-left: 3px solid var(--line); font-size: 13.5px; overflow-wrap: anywhere; }
  .answered .ah { font-size: 12px; color: var(--dim); margin-bottom: 2px; }
  .answered .ar { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1px; padding: 3px 0; }
  .answered .aq2 { color: var(--dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .answered b { font-weight: 600; color: var(--ink); }
  .more { text-align: center; color: var(--dim); font-size: 12px; margin-bottom: 16px; }
  .more .btn { font-size: 12px; }
  .typing { color: var(--dim); font-size: 13px; margin: 0 0 14px; }

  .foot { border-top: 1px solid var(--line); padding: 12px 20px 16px; }
  .foot .col { padding: 0; }
  .composer { display: flex; gap: 8px; align-items: flex-end; border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 8px 12px; background: var(--bg); }
  .composer:focus-within { border-color: var(--accent); }
  /* What is being quoted (a mail, picked chat messages): above the box while you write, inside your bubble once sent -
     the way a reply shows the message it answers in Teams or Messenger. Your own words are never mixed with it. */
  .reply { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 6px; padding: 7px 8px 7px 12px; border-left: 3px solid var(--accent); border-radius: 6px; background: color-mix(in srgb, var(--accent) 9%, var(--bg)); font-size: 13px; }
  .reply .rmain { flex: 1; min-width: 0; }
  .reply .rh { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reply .rs, .reply .rt { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reply .rmain { cursor: pointer; border-radius: 4px; }
  .reply .rh { display: flex; gap: 8px; }
  .reply .rh b { overflow: hidden; text-overflow: ellipsis; }
  .reply .rh span { margin-left: auto; font-weight: 400; font-size: 12px; color: var(--dim); white-space: nowrap; }
  .reply.open .rt { white-space: pre-wrap; overflow: auto; max-height: 40vh; color: inherit; font-size: 13px; margin-top: 4px; cursor: text; }
  .reply button { border: 0; background: none; color: var(--dim); border-radius: 4px; padding: 0 6px; font-size: 16px; line-height: 20px; flex: none; }
  .reply button:hover { background: var(--hover); color: var(--red); }
  .quoted { display: block; width: 100%; text-align: left; border: 0; border-left: 3px solid var(--accent); border-radius: 6px; background: color-mix(in srgb, var(--accent) 10%, var(--bg)); padding: 6px 10px; margin: 0 0 6px; font: inherit; font-size: 13px; color: inherit; cursor: pointer; white-space: normal; }
  .quoted .rh { font-weight: 600; font-size: 12px; color: var(--dim); display: flex; gap: 8px; }
  .quoted .rh span { margin-left: auto; font-weight: 400; white-space: nowrap; }
  .quoted .rt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quoted.open .rt { white-space: pre-wrap; overflow: auto; max-height: 55vh; cursor: text; }
  .msg.user .own { white-space: pre-wrap; }
  .composer textarea { flex: 1; border: 0; outline: 0; resize: none; background: none; color: inherit; font: inherit; max-height: 200px; min-height: 24px; padding: 3px 0; }
  .note { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--dim); font-size: 13px; }
  .note > span { flex: 1; min-width: 200px; }
  .hint { font-size: 12px; color: var(--faint); margin-top: 6px; }

  /* ── figures above a conversation ── */
  /* The bar that stays put above a scrolling conversation (title, then figures).
     It is tinted like the sidebar and casts a shadow, so the text scrolling
     under it does not read as part of it. */
  .top, .main > .head { background: var(--side); border-bottom: 1px solid var(--line); box-shadow: 0 3px 10px rgba(0, 0, 0, .08); position: relative; z-index: 2; }
  .top .head { border-bottom: 0; }
  .info { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 16px; align-items: start; padding: 7px 20px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--dim); }
  .info[hidden] { display: none; }
  .info .chips { display: flex; flex-wrap: wrap; gap: 4px 16px; }
  .info b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .info-more { border: 0; background: none; padding: 0 2px; color: var(--accent); font: inherit; white-space: nowrap; }
  .info-more:hover { text-decoration: underline; }
  .info .more-rows { grid-column: 1 / -1; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; padding: 6px 0 2px; border-top: 1px dashed var(--line); margin-top: 4px; }
  .info .more-rows[hidden] { display: none; }
  .info .more-rows code { font-family: var(--mono); font-size: 12px; }
  .more.compact { display: flex; align-items: center; gap: 12px; margin: 22px 0; }
  .more.compact::before, .more.compact::after { content: ""; flex: 1; border-top: 1px dashed var(--line); }

  /* What a conversation has running besides its reply (subagents, background commands). */
  /* A background command in the strip can be pressed to see what it has printed. */
  button.tk { width: 100%; border: 0; background: none; text-align: left; font: inherit; color: inherit; border-radius: 4px; cursor: pointer; }
  button.tk:hover { background: var(--hover); }
  .tk.fin { opacity: .7; }
  .tk .tk-open { color: var(--dim); font-size: 12px; white-space: nowrap; }
  .peek-body .tcmd { font-family: var(--mono); font-size: 12px; background: var(--side); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin: 0 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .peek-body .tstat { color: var(--dim); font-size: 12px; margin: 0 0 8px; }
  /* Messages waiting for their turn, above the input box. */
  .queue { border-top: 1px solid var(--line); background: var(--side); padding: 6px 20px; font-size: 13px; max-height: 22vh; overflow-y: auto; }
  .queue .qrow { display: flex; align-items: center; gap: 8px; padding: 2px 0; }
  .queue .qn { color: var(--dim); white-space: nowrap; font-size: 12px; }
  .queue .qt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .queue button { border: 0; background: none; color: var(--dim); border-radius: 4px; padding: 0 6px; font-size: 14px; line-height: 20px; }
  .queue button:hover { background: var(--hover); color: var(--red); }
  .tasks { border-top: 1px solid var(--line); background: var(--side); padding: 6px 20px; font-size: 13px; max-height: 26vh; overflow-y: auto; }
  .tasks[hidden] { display: none; }
  .tk { display: flex; align-items: center; gap: 8px; padding: 2px 0; min-width: 0; }
  .tk .dot { margin-top: 0; flex: none; }
  .tk-l { font-weight: 600; white-space: nowrap; }
  .tk-d { flex: 1; min-width: 0; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tk-e { color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .meter { display: grid; grid-template-columns: 56px minmax(80px, 320px) 48px auto; align-items: center; gap: 12px; padding: 4px 8px; font-size: 13.5px; }
  .meter .ml, .meter .mr { color: var(--dim); }
  .meter b { text-align: right; font-variant-numeric: tabular-nums; }
  .mbar { height: 8px; border-radius: 4px; background: var(--hover); overflow: hidden; }
  .mfill { height: 100%; background: var(--green); border-radius: 4px; }
  .mfill.warm { background: var(--amber); } .mfill.hot { background: var(--red); }

  /* ── war room: the month ── */
  .mhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 2px 8px 6px; }
  .mhead .mname { font-size: 16px; min-width: 104px; text-align: center; }
  .mhead .mnote { flex: 1; min-width: 160px; text-align: right; color: var(--dim); font-size: 12px; }
  .mparts { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 2px 8px 12px; font-size: 13px; color: var(--dim); }
  .mparts b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .mcap { font-size: 12px; color: var(--dim); padding: 0 8px 6px; }
  .bars { display: flex; align-items: flex-end; gap: 3px; height: 132px; padding: 0 8px; border-bottom: 1px solid var(--line); }
  .bcol { flex: 1; height: 100%; display: flex; align-items: flex-end; min-width: 0; }
  .bcol:hover .b { filter: brightness(1.15); }
  .bars .b { width: 100%; background: var(--accent); border-radius: 2px 2px 0 0; }
  .bars .b.today { background: var(--amber); }
  .bars .b.zero { background: var(--line); border-radius: 0; }
  .axis { display: flex; gap: 3px; padding: 3px 8px 0; font-size: 10.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .axis span { flex: 1; text-align: center; min-width: 0; }
  .axis .today { color: var(--amber); font-weight: 600; }
  .mgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
  .mtable { margin-top: 18px; }
  .mtable h4 { font-size: 12px; color: var(--dim); font-weight: 600; margin: 0 0 4px; padding: 0 8px; }
  .trow { display: grid; grid-template-columns: minmax(0, 1fr) 96px 48px 84px; gap: 10px; align-items: baseline; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 5px 8px; font-size: 13.5px; }
  button.trow:hover { background: var(--hover); }
  .trow.cols { font-size: 12px; color: var(--dim); }
  .trow .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trow .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* The session table has three more columns (compactions, context, messages). */
  .mtable.wide .trow { grid-template-columns: minmax(0, 1fr) 92px 44px 88px 60px 64px 52px; }
  /* Per model: what it cost beside how much it was used and at what rate, to tell "dear but little used" from "dear and much used". */
  .mtable.models .trow { grid-template-columns: minmax(110px, 1fr) 92px 50px 70px 50px 70px 70px 78px 78px 84px; }
  .mtable.models { margin-bottom: 8px; }
  .mexplain { color: var(--faint); font-size: 12px; margin: 4px 8px 14px; }
  @media (max-width: 1100px) { .mtable.models .trow { grid-template-columns: minmax(80px, 1fr) 86px 62px 64px 62px 100px; } .mtable.models .trow > :nth-child(n+6):not(:nth-child(10)) { display: none; } }
  .trow .t .dot { display: inline-block; margin: 0 8px 1px 0; vertical-align: middle; }
  @media (max-width: 900px) { .mgrid { grid-template-columns: minmax(0, 1fr); } .mtable.wide .trow { grid-template-columns: minmax(0, 1fr) 88px 40px 64px; } .mtable.wide .trow .n:nth-child(n+4):not(:nth-child(6)) { display: none; } }
  @media (max-width: 560px) { .trow { grid-template-columns: minmax(0, 1fr) 84px 40px; } .trow .n:last-child { display: none; } }

  /* ── war room ── */
  .war { max-width: 1040px; margin: 0 auto; padding: 4px 20px 48px; }
  .war h3 { font-size: 12px; color: var(--dim); font-weight: 600; margin: 24px 0 6px; }
  .war .quiet { color: var(--dim); font-size: 13px; padding: 8px 0; }
  .war .liverow, .war button.turn { padding-left: 8px; padding-right: 8px; }
  .urow { display: grid; grid-template-columns: minmax(0, 1fr) 76px 76px 60px 60px 76px; gap: 12px; align-items: center; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 7px 8px; font-size: 13.5px; }
  button.urow:hover { background: var(--hover); }
  .urow.cols { font-size: 12px; color: var(--dim); }
  .urow .ut { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .urow .ut .dot { margin-top: 0; flex: none; }
  .urow .ut span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .urow .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  @media (max-width: 720px) { .urow { grid-template-columns: minmax(0, 1fr) 64px 52px 64px; } .urow .opt { display: none; } }
  .side-nav { padding: 0 6px 4px; border-bottom: 1px solid var(--line); }
  .pulse { display: flex; align-items: flex-end; gap: 32px; padding: 16px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .kpi .n { font-size: 26px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 12px; color: var(--dim); }
  .kpi.main .n { color: var(--green); } .kpi.main.zero .n { color: var(--ink); }
  .kpi.warn .n { color: var(--amber); }
  .kpi .names { font-size: 12px; color: var(--dim); max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .liverow { display: flex; align-items: center; gap: 10px; padding: 8px 20px; border-bottom: 1px solid var(--line); min-width: 0; }
  .liverow.stuck { background: var(--red-soft); }
  .liverow .dot { margin-top: 0; flex: none; }
  .liverow.stuck .dot { background: var(--red); }
  .liverow .lt { font-weight: 600; flex: 0 1 auto; min-width: 60px; max-width: 34%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { flex: none; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: var(--hover); white-space: nowrap; }
  .chip.bad { background: var(--red); color: #fff; }
  .liverow .ld { flex: 1; min-width: 0; font-family: var(--mono); font-size: 12px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .liverow .le { flex: none; font-size: 13px; font-variant-numeric: tabular-nums; }
  .liverow.stuck .le { color: var(--red); font-weight: 600; }
  .split { display: grid; grid-template-columns: 400px minmax(0, 1fr); flex: 1; min-height: 0; }
  .turns { overflow-y: auto; border-right: 1px solid var(--line); min-height: 0; }
  button.turn { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 9px 16px; }
  button.turn:hover { background: var(--hover); }
  button.turn.active { background: var(--active); }
  .turn .r1 { display: flex; gap: 8px; align-items: center; }
  .turn .r1 .dot { margin-top: 0; flex: none; }
  .turn .tt { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .turn .tm { flex: none; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .turn .r2 { display: flex; gap: 8px; font-size: 13px; color: var(--dim); margin-top: 2px; padding-left: 16px; }
  .turn .pp { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .turn .nn { flex: none; font-size: 12px; font-variant-numeric: tabular-nums; }
  .rcpt { overflow-y: auto; min-height: 0; }
  .rcpt .in { max-width: 780px; padding: 20px; }
  .rcpt h2 { font-size: 19px; font-weight: 700; margin: 0 0 4px; overflow-wrap: anywhere; }
  .rcpt .sub { color: var(--dim); font-size: 13px; margin-bottom: 14px; }
  dl.meta { display: grid; grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr); gap: 4px 14px; margin: 0 0 6px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; }
  dl.meta dt { color: var(--dim); } dl.meta dd { margin: 0; overflow-wrap: anywhere; }
  details.flow { border: 1px solid var(--line); border-radius: 8px; margin-top: 12px; }
  details.flow > summary { padding: 9px 14px; font-weight: 600; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
  details.flow > summary small { font-weight: 400; color: var(--dim); }
  details.flow > .fb { padding: 12px 14px; border-top: 1px solid var(--line); max-height: 52vh; overflow: auto; }
  details.flow .said { white-space: pre-wrap; overflow-wrap: anywhere; }
  .step { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 8px; font-size: 13px; padding: 2px 0; }
  .step .st { color: var(--faint); font-variant-numeric: tabular-nums; }
  .step .sx { overflow-wrap: anywhere; color: var(--dim); }
  .step .sx b { font-family: var(--mono); font-size: 12px; color: var(--ink); }
  .usage { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .usage .n { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .usage .l { font-size: 12px; color: var(--dim); }
  .blank { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--dim); font-size: 13px; padding: 24px; text-align: center; }
  @media (max-width: 900px) {
    .split { grid-template-columns: minmax(0, 1fr); }
    .split.picked .turns { display: none; }
    .split:not(.picked) .rcpt { display: none; }
    dl.meta { grid-template-columns: auto minmax(0, 1fr); }
    .usage { grid-template-columns: repeat(2, 1fr); }
    .liverow .ld { display: none; }
  }

  /* ── files mentioned in a conversation, and their preview panel ── */
  .fp { color: var(--accent); cursor: pointer; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; }
  code.fp { text-decoration: none; box-shadow: inset 0 -1px 0 var(--accent); }
  .fp:hover { background: var(--hover); }
  #peek { position: fixed; top: 0; right: 0; bottom: 0; width: min(820px, 58vw); background: var(--bg); border-left: 1px solid var(--line); box-shadow: -12px 0 32px rgba(0, 0, 0, .14); display: flex; flex-direction: column; z-index: 4; }
  #peek[hidden] { display: none; }
  /* The left edge is a handle: drag it to make the preview wider or narrower. */
  #peekGrip { position: absolute; left: -5px; top: 0; bottom: 0; width: 10px; cursor: ew-resize; z-index: 1; touch-action: none; }
  #peekGrip::after { content: ""; position: absolute; left: 4px; top: 0; bottom: 0; width: 2px; background: transparent; transition: background .12s; }
  #peekGrip:hover::after, #peekGrip:focus-visible::after, #peek.dragging #peekGrip::after { background: var(--accent); }
  #peekGrip:focus-visible { outline: none; }
  /* While dragging, the document inside must not swallow the mouse, and nothing should get selected. */

  #said { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 80px); background: var(--ink); color: var(--bg); border-radius: 8px; padding: 8px 14px; font-size: 13px; max-width: min(92vw, 640px); transition: transform .15s ease-out; z-index: 5; }

<body>
<div class="app" id="app">
  <aside class="side">
    <div class="side-top">
      <h1><button type="button" id="homeBtn" title="回到首頁：誰在等你、沒開著的對話">Sessions</button></h1>
      <button class="btn primary" id="newBtn" type="button">＋ 新對話</button>
    </div>
    <div class="side-nav">
      <button class="item" id="warBtn" type="button"><span class="dot" id="warDot"></span><span class="t">戰情室</span><span class="m" id="warSub">所有 session 現在在做什麼</span></button>
      <button class="item" id="pastBtn" type="button"><span class="dot" style="visibility:hidden"></span><span class="t">舊對話</span><span class="m" id="pastSub">找回沒開著的對話，接著做</span></button>
      <button class="item" id="inboxBtn" type="button"><span class="dot" id="inboxDot"></span><span class="t">收件</span><span class="m" id="inboxSub">Gmail、Slack、Teams 收到的訊息</span></button>

</div>
<aside id="peek" hidden aria-label="檔案預覽">
  <div id="peekGrip" role="separator" aria-orientation="vertical" aria-label="拖拉調整預覽寬度" tabindex="0" title="拖拉調整寬度，按兩下恢復預設"></div>
  <div class="peek-head">
    <div class="who"><div class="t" id="peekName"></div><div class="s" id="peekPath"></div></div>
    <button class="btn" id="peekOpen" type="button">用預設程式開啟</button>
    <button class="btn" id="peekReveal" type="button">在檔案總管顯示</button>
    <button class="btn" id="peekCopy" type="button">複製路徑</button>

  </div>
  <div class="peek-body" id="peekBody"></div>
</aside>
<div id="said" role="status" aria-live="polite"></div>

<script>
'use strict';
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
// A "choose a folder" button for a path field: opens the Windows folder window (on this computer, by the board),
// and puts what was chosen into the field. Typing a path stays possible. then(path) runs after a choice.
function folderButton(input, then) {
  const b = el('button', 'btn', '選擇資料夾…'); b.type = 'button'; b.title = '跳出 Windows 的資料夾視窗來選（視窗可能開在瀏覽器後面）';
  b.addEventListener('click', async () => {
    b.disabled = true; b.textContent = '請在跳出的視窗裡選…';
    try { const r = await api('/api/pick-folder', {}); if (r.data.path) { input.value = r.data.path; input.dispatchEvent(new Event('input', { bubbles: true })); if (then) then(r.data.path); } }
    catch (e) { say('看板程序沒有回應', true); }
    b.disabled = false; b.textContent = '選擇資料夾…';
  });
  return b;
}

const STATUS = { waiting: '等你回應', busy: '執行中', background: '背景工作中', idle: '做完了', unknown: '狀態不明' };
const statusText = (s) => s.group === 'stale' ? '閒置' : s.group === 'quiet' ? '沒有新訊息' : s.status === 'idle' ? (s.owner === 'board' ? '有新回覆' : '做完了，等你指示') : (STATUS[s.status] || STATUS.unknown);

function ago(ms) {
  const m = Math.floor(Math.max(0, ms) / 60000);
  if (m < 1) return '剛剛';
  if (m < 60) return m + ' 分鐘';
  const h = Math.floor(m / 60);
  if (h < 24) return h + ' 小時';
  return Math.floor(h / 24) + ' 天';
}

async function api(path, body) {
  const opt = { headers: { 'x-board-token': TOKEN } };
  if (body !== undefined) { opt.method = 'POST'; opt.headers['content-type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const res = await fetch(path, opt);
  let data = null;
  try { data = await res.json(); } catch (e) {}
  return { status: res.status, ok: res.ok, data: data || {} };
}

let saidTimer = 0;
function say(text, bad) {
  const s = $('said');
  s.textContent = text;
  s.className = 'on' + (bad ? ' bad' : '');
  clearTimeout(saidTimer);
  saidTimer = setTimeout(() => { s.className = ''; }, bad ? 9000 : 3500);
}

/* ── markdown: escape everything first, then add a fixed set of tags ── */
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function inline(s) {
  const codes = [];
  s = s.replace(/`([^`\n]+)`/g, (m, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
  s = s.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  // Links. Written ones first, set aside so the bare-address pass below cannot link inside them.
  const links = [];
  const keep = (html) => { links.push(html); return '\u0001' + (links.length - 1) + '\u0001'; };
  const a = (href, text) => '<a href="' + href + '" target="_blank" rel="noopener noreferrer">' + text + '</a>';
  s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, text, href) => keep(a(href, text)));
  // A bare address becomes a link too. It ends at whitespace or full-width
  // punctuation; trailing sentence punctuation is left outside the link.
  s = s.replace(/https?:\/\/[^\s<>"'　-〿＀-￯]+/g, (url) => {
    const tail = (/(?:&quot;|&gt;|[.,;:!?)\]}'])+$/.exec(url) || [''])[0];
    const href = tail ? url.slice(0, -tail.length) : url;
    return href.length > 10 ? keep(a(href, href)) + tail : url;
  });
  s = s.replace(/\u0001(\d+)\u0001/g, (m, i) => links[Number(i)]);
  return s.replace(/\u0000(\d+)\u0000/g, (m, i) => '<code>' + codes[Number(i)] + '</code>');
}
function md(src) {
  const parts = esc(String(src)).split(/^```[^\n]*$/m);
  let html = '';
  parts.forEach((part, idx) => {
    if (idx % 2) { html += '<pre><code>' + part.replace(/^\n/, '').replace(/\n$/, '') + '</code></pre>'; return; }
    const lines = part.split('\n');
    let para = [], list = null;
    const flushP = () => { if (para.length) { html += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; } };
    const flushL = () => { if (list) { html += '<' + list.tag + '>' + list.items.map((i) => '<li>' + inline(i) + '</li>').join('') + '</' + list.tag + '>'; list = null; } };
    const cells = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i];
      const h = /^(#{1,4})\s+(.*)$/.exec(l);
      const ul = /^\s*[-*]\s+(.*)$/.exec(l);
      const ol = /^\s*\d+[.)]\s+(.*)$/.exec(l);
      if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1]) && lines[i + 1].includes('-')) {
        flushP(); flushL();
        let t = '<div class="tw"><table><thead><tr>' + cells(l).map((c) => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>';
        i += 2;
        for (; i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i]); i++) t += '<tr>' + cells(lines[i]).map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>';
        i--;
        html += t + '</tbody></table></div>';
      } else if (h) { flushP(); flushL(); html += '<h' + (h[1].length + 1) + '>' + inline(h[2]) + '</h' + (h[1].length + 1) + '>'; }
      else if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { flushP(); flushL(); html += '<hr>'; }
      else if (ul || ol) { flushP(); const tag = ul ? 'ul' : 'ol'; if (!list || list.tag !== tag) { flushL(); list = { tag, items: [] }; } list.items.push((ul || ol)[1]); }
      else if (!l.trim()) { flushP(); flushL(); }
      else { flushL(); para.push(l); }
    }
    flushP(); flushL();
  });
  return html;
}

/* ── state ── */
let sessions = [];
// Conversations opened on the board in which nothing has been sent yet. Not sessions yet: they are in no list
// and no count - only the chat view of the one you are typing in knows them. Left without sending, they are closed.
let unstarted = [];
let listShape = '';
let active = null;        // sessionId being viewed
let view = 'home';        // home | new | chat
let items = [];           // messages of the active session, as drawn
let pending = new Map();  // requestId -> permission event
let liveStatus = '';      // status of the active board conversation, from its stream
let stream = null;
let histShape = '';
let histMore = false, histLoading = false, histReadyAt = 0;   // older items exist; a load of them is under way; when scrolling may start asking for them
let histMax = 120, histLimit = 3000;   // how many items of the conversation are asked for; grows with "load earlier"
let down = false;
let confirming = false;   // the takeover confirmation is showing
let homeShape = '';

const cur = () => sessions.find((s) => s.sessionId === active) || unstarted.find((s) => s.sessionId === active) || null;

/* ── sidebar ── */
function drawList() {
  $('warBtn').classList.toggle('active', view === 'war');
  $('setBtn').classList.toggle('active', view === 'settings');
  $('inboxBtn').classList.toggle('active', view === 'inbox');
  $('pastBtn').classList.toggle('active', view === 'past');
  const shape = JSON.stringify(sessions.map((s) => [s.sessionId, s.title, s.group, s.status, s.owner, s.cwd, s.kept, s.hidden, s.lastUser])) + active + showHidden;
  if (shape !== listShape) {
    listShape = shape;
    const list = $('list');
    const keep = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.sid : null;
    list.textContent = '';
    const groups = new Map();
    const hiddenCount = sessions.filter((s) => s.hidden).length;
    for (const s of sessions) { if (s.hidden && !showHidden && s.sessionId !== active) continue; const k = s.cwd || ''; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(s); }
    for (const [cwd, rows] of groups) {
      const g = el('div', 'group');
      const head = el('div', 'group-head');
      const name = el('span', '', rows[0].folder || '(沒有資料夾)');
      name.title = cwd;
      head.append(name);
      if (cwd) {
        const add = el('button', '', '+');
        add.type = 'button';
        add.title = '在 ' + cwd + ' 開新對話';
        add.setAttribute('aria-label', add.title);
        add.addEventListener('click', () => createIn(cwd));
        head.append(add);
      }
      g.append(head);
      for (const s of rows) {
        const b = el('button', 'item ' + s.group + (s.sessionId === active ? ' active' : ''));
        b.type = 'button';
        b.dataset.sid = s.sessionId;
        const m = el('span', 'm');
        m.dataset.since = s.since;
        m.dataset.label = statusText(s) + (s.owner === 'terminal' ? (s.headless ? ' · 背景' : ' · 終端機') : '') + '';
        b.append(el('span', 'dot ' + s.group), el('span', 't', s.title), m);
        if (s.hidden) b.classList.add('hid');
        // Only real terminal windows can be kept (the board says which: s.kept is true or false for those).
        if (typeof s.kept === 'boolean') {
          const pin = el('span', 'pin' + (s.kept ? ' on' : ''), '✓');
          pin.setAttribute('role', 'checkbox'); pin.setAttribute('aria-checked', String(s.kept)); pin.tabIndex = 0;
          pin.setAttribute('aria-label', '常駐：' + s.title);
          pin.title = s.kept ? '常駐：關機或重開機後會開回來。按一下取消' : '不常駐：關機後不會開回來。按一下改成常駐';
          const flip = async (e) => {
            e.stopPropagation(); e.preventDefault();
            const r = await api('/api/keep/set', { sessionId: s.sessionId, keep: !s.kept });
            if (!r.ok) return say(r.data.error || '改不了', true);
            s.kept = r.data.kept; listShape = ''; drawList(); if (view === 'chat' && active === s.sessionId) drawHead();
          };
          pin.addEventListener('click', flip);
          pin.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') flip(e); });
          b.append(pin);
        }
        if (s.lastUser) { const said = el('span', 'said', '你：' + s.lastUser); said.title = s.lastUser; b.append(said); }
        b.addEventListener('click', () => openChat(s.sessionId));
        g.append(b);
      }
      list.append(g);
    }
    if (!sessions.length) list.append(el('div', 'group-head', '還沒有任何 session'));
    if (sessions.some((s) => typeof s.kept === 'boolean')) { const lg = el('div', 'hint', '右邊打勾的是常駐：關機後會開回來'); lg.style.padding = '8px 8px 0'; list.append(lg); }
    if (hiddenCount) {
      const more = el('button', 'list-more', showHidden ? '收起已隱藏的 ' + hiddenCount + ' 個' : '已隱藏 ' + hiddenCount + ' 個 · 顯示'); more.type = 'button';
      more.addEventListener('click', () => { showHidden = !showHidden; drawList(); });
      list.append(more);
    }
    if (keep) { const again = list.querySelector('[data-sid="' + CSS.escape(keep) + '"]'); if (again) again.focus(); }
    const n = sessions.filter((s) => s.group === 'yours').length;
    document.title = (n ? '(' + n + ') ' : '') + 'Session 看板';
  }
  const now = Date.now();
  for (const m of document.querySelectorAll('#list .item .m')) m.textContent = m.dataset.label + ' · ' + ago(now - Number(m.dataset.since));
}

/* ── main: home ── */
function drawHome() {
  view = 'home'; active = null; closeStream(); setPlace('');
  $('app').classList.remove('viewing');
  const main = $('main');
  main.textContent = '';
  const pane = el('div', 'pane');
  const yours = sessions.filter((s) => s.group === 'yours');
  pane.append(el('h2', '', yours.length ? yours.length + ' 個 session 在等你' : '沒有 session 在等你'));
  pane.append(el('p', 'lead', '從左邊選一個 session 看它的對話，或開一個新對話。'));
  for (const s of yours) {
    const b = el('button', 'choice');
    b.type = 'button';
    b.append(el('span', 'dot yours'), el('span', 't', s.title), el('span', 'p', s.folder));
    b.addEventListener('click', () => openChat(s.sessionId));
    pane.append(b);
  }
  drawKeep(pane);
  drawPast(pane);
  // Inside a scrolling block like every other page. Put straight into the main area (a flex column), the pane
  // took the width of its longest line and pushed the page wider than the window once the lists had long
  // titles in them, and a list longer than the window could not be scrolled (measured 2026-11-13: 936px in an 809px window).
  const homeScroll = el('div', 'scroll'); homeScroll.style.scrollbarGutter = 'stable';
  homeScroll.append(pane);
  main.append(homeScroll);
  listShape = '';
  drawList();
}

/* ── main: old conversations ──
   The same lists the first page has, on a page of their own with a fixed way in
   from the sidebar: on a wide window nothing led back to the first page once a
   session was open, so the lists could not be found (2026-11-13). */
function drawPastPage() {
  view = 'past'; active = null; closeStream(); setPlace('past');
  const { pane } = inboxShell('舊對話', '沒開著的對話：找出來，在終端機或看板接著做', drawHome);
  pane.append(el('p', 'lead', '「終端機」會開一個視窗用原本的啟動參數接續那個對話；「看板」則搬進這一頁接續。對話內容都還在。關機或重開機時被中斷的，會列在最上面「上次看板停止時還開著的」，那裡可以讓它自動接著做完。'));
  drawKeep(pane);
  drawPast(pane);
}
const redrawLists = () => { if (view === 'home') drawHome(); else if (view === 'past') drawPastPage(); };

/* ── home: sessions to bring back ──
   keep.restorable: terminal sessions that were open when the board last stopped
   (a shutdown, a restart) and that you had not closed yourself.
   keep.closed: ones you closed; not brought back, but one click away. */
let showHidden = false;
let keep = { restorable: [], closed: [], autoContinue: true };
let keepContinue = null;   // the "pick up where it was cut off" tick; null = as the setting says
const keepOff = new Set();   // unticked in the list
const keepShape = () => keep.restorable.map((k) => k.sessionId).join() + '/' + keep.closed.map((k) => k.sessionId).join();
async function loadKeep() {
  try { const r = await api('/api/keep'); if (r.ok) keep = r.data; } catch (e) {}
}
const folderName = (p) => String(p || '').split(/[\\/]/).filter(Boolean).pop() || '';
async function bringBack(ids, to) {
  if (!ids.length) return say('沒有勾選任何 session', true);
  let r;
  try { r = await api('/api/keep/restore', { sessionIds: ids, to, continue: keepContinue === null ? keep.autoContinue !== false : keepContinue }); } catch (e) { return say('看板程序沒有回應', true); }
  if (!r.ok) return say(r.data.error || '開不回來', true);
  const d = r.data, bad = d.failed.map((f) => (f.title || f.sessionId.slice(0, 8)) + '：' + f.error).join('；');
  say((d.done.length ? '已' + (to === 'board' ? '搬進看板 ' : '開回終端機視窗 ') + d.done.length + ' 個' + (to === 'board' ? '' : '，幾秒後會出現在左邊') + ((d.continued || []).length ? '；其中 ' + d.continued.length + ' 個做到一半的已請它接著做' : '') : '') + (bad ? (d.done.length ? '。' : '') + '沒開成的：' + bad : ''), !d.done.length);
  await loadKeep(); await poll(); redrawLists();
}
/* ── home: conversations that are not open now ──
   The last 30 days, newest first. The search looks at the title, the folder,
   and the first and latest thing you said - not at the whole conversation. */
let pastQ = '', pastTimer = 0, pastSeq = 0;
const pastOpen = new Set(), pastAll = new Set();   // folders whose block is open; folders shown in full
const PAST_PER_FOLDER = 6;
async function openPast(d, to) {
  let r;
  try { r = await api('/api/past/open', { sessionId: d.sessionId, to }); } catch (e) { return say('看板程序沒有回應', true); }

  const initials = (name) => { const w = String(name || '').trim().split(/\s+/).pop() || '?'; return /^[\x00-\x7f]+$/.test(w) ? w.replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || '?' : w.slice(-2); };
  const hue = (name) => { let h = 0; for (const c of String(name || '')) h = (h * 31 + c.codePointAt(0)) % 360; return h; };
  let prev = null;
  for (const m of t.items) {
    if (mail) continue;
    const who = m.direction === 'out' ? '我' : m.sender || '對方';
    const newDay = !prev || dayOf(prev.ts) !== dayOf(m.ts);
    if (newDay) pane.append(el('div', 'tc-day', new Date(m.ts).toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' })));
    const first = newDay || prev.direction !== m.direction || (prev.sender || '') !== (m.sender || '') || m.ts - prev.ts > 5 * 60000;
    prev = m;
    const d = el('div', 'tmsg pick chat ' + m.direction + (first ? ' first' : ''));
    if (m.direction !== 'out') {
      const av = el('div', 'tc-av' + (first ? '' : ' sp'), first ? initials(who) : '');
      if (first) { av.style.background = 'hsl(' + hue(who) + ' 45% 45%)'; av.title = who; av.setAttribute('aria-hidden', 'true'); }
      d.append(av);
    }
    const col = el('div', 'tc-main');
    if (first) { const h = el('div', 'tc-head'); if (m.direction !== 'out') h.append(el('b', '', who)); h.append(clock(m.ts)); col.append(h); }
    const rowEl = el('div', 'tc-row');
    // The text comes from whoever wrote to you: escaped first, so nothing in it is taken as markup (inline() only adds links and bold to text that is already escaped).
    const body = el('div', 'body'); body.innerHTML = inline(esc(m.body.length > 6000 ? m.body.slice(0, 6000) + '\n…（後面還有 ' + sep(m.body.length - 6000) + ' 個字）' : m.body));
    body.title = who + ' · ' + new Date(m.ts).toLocaleString('zh-TW', { hour12: false }) + '\n點一下勾選，帶進對話時只帶勾選的';
    const cb = el('input'); cb.type = 'checkbox'; cb.setAttribute('aria-label', '帶入這則訊息：' + who + ' ' + clock(m.ts));
    const toggle = (on) => { if (on) picked.add(m.id); else picked.delete(m.id); cb.checked = on; d.classList.toggle('on', on); refresh(); };
    cb.addEventListener('click', (e) => { e.stopPropagation(); toggle(cb.checked); });
    // A click on the bubble picks it; a click on a link in it, or a drag to select text, does not.
    body.addEventListener('click', (e) => { if (e.target.closest('a') || String(window.getSelection()).length) return; toggle(!picked.has(m.id)); });
    if (picked.has(m.id)) { cb.checked = true; d.classList.add('on'); }
    rowEl.append(body, cb); col.append(rowEl); d.append(col);
    pane.append(d);
  }
  // A mail thread stays a list of whole messages, one under the other.
  for (const m of mail ? t.items : []) {
    const d = el('div', 'tmsg ' + m.direction);
    d.append(el('div', 'who2', (m.direction === 'out' ? '我' : m.sender || '對方') + ' · ' + when(m.ts)));
    // The text comes from whoever wrote to you: escaped first, so nothing in it is taken as markup (inline() only adds links and bold to text that is already escaped).
    const body = el('div', 'body'); body.innerHTML = inline(esc(m.body.length > 6000 ? m.body.slice(0, 6000) + '\n…（後面還有 ' + sep(m.body.length - 6000) + ' 個字）' : m.body));
    d.append(body);
    if (!mail) {
      d.classList.add('pick');
      const cb = el('input'); cb.type = 'checkbox'; cb.setAttribute('aria-label', '帶入這則訊息');
      const toggle = (on) => { if (on) picked.add(m.id); else picked.delete(m.id); cb.checked = on; d.classList.toggle('on', on); refresh(); };
      cb.addEventListener('click', (e) => { e.stopPropagation(); toggle(cb.checked); });
      // A click on the message picks it; a click on a link in it, or a drag to select text, does not.
      d.addEventListener('click', (e) => { if (e.target.closest('a') || String(window.getSelection()).length) return; toggle(!picked.has(m.id)); });
      if (picked.has(m.id)) { cb.checked = true; d.classList.add('on'); }
      d.prepend(cb);
    }
    pane.append(d);
  }
  const sc = $('main').querySelector('.scroll'); if (sc) sc.scrollTop = sc.scrollHeight;
  poll();
}

/* ── quoting ── */
// Something brought into a conversation from elsewhere (a mail thread, picked chat messages) is kept apart from
// what you write: it waits above the box while you type, and goes out behind your words between two marks, so
// that both Claude and this page can tell which part is yours. carry: sessionId -> {source, title, sub, text}.
const carry = new Map();
const Q_END = '⟦引用結束⟧';
const quoteWrap = (words, q) => words.trim() + '\n\n⟦引用 ' + String(q.source).replace(/[⟦⟧｜\n]/g, ' ') + '｜' + String(q.title || '').replace(/[⟦⟧｜\n]/g, ' ').slice(0, 120) + '⟧ 以上是我說的話；從這裡到「' + Q_END + '」是引用的原文，不是我寫的。\n' + q.text.trim() + '\n' + Q_END;
// -> {words, source, title, text} for a message that carries a quotation, else null.
function quoteParse(text) {
  const m = /^([\s\S]*?)\n*⟦引用 ([^｜⟧\n]*)｜([^⟧\n]*)⟧[^\n]*\n([\s\S]*?)\n?⟦引用結束⟧\s*$/.exec(String(text || ''));
  return m ? { words: m[1].trim(), source: m[2].trim(), title: m[3].trim(), text: m[4] } : null;
}
// The first line of what is quoted that says something (not the notes the board put in front, not a "[time] who:" line).
const quoteSnippet = (text) => { const body = String(text).split(/\n\n/).slice(1).join('\n\n') || String(text); return (body.split('\n').map((l) => l.trim()).find((l) => l && !/^\[[^\]]{6,30}\] .{0,80}[：:]$/.test(l) && !/^\[圖片：/.test(l)) || '').slice(0, 200); };

/* ── main: chat ── */
// A new conversation you opened and left without saying anything is closed again, so a stray press of "+"
// does not leave an empty "新對話" behind - also when something was typed but not sent (the user's call,
// 2026-11-14: a conversation that has not started is not to be listed at all; text brought in from the inbox
// had kept one in the list for 16 hours). Whether it really is empty is decided by the board, not here.
let chatOn = null;   // the conversation the chat view is showing
function leaveIfEmpty(sid) {
  const s = sessions.find((x) => x.sessionId === sid) || unstarted.find((x) => x.sessionId === sid);
  if (!s || s.owner !== 'board') return;
  carry.delete(sid);
  api('/api/close-empty', { sessionId: sid }).then((r) => { if (r.ok && r.data.ok) poll(); }).catch(() => {});
}
// next: the conversation about to be shown, when the chat view is only switching to another one.
function closeStream(next) { const left = chatOn; chatOn = null; if (left && left !== next) leaveIfEmpty(left); if (stream) { stream.close(); stream = null; } pending = new Map(); liveStatus = ''; liveNode = null; liveText = ''; liveTasks = []; termAgents = []; liveQueue = []; }

// What a conversation has running besides its reply: subagents and background
// commands. For a board conversation this comes live from Claude Code, with
// what each one is doing; for a terminal session only the names of the
// subagents that are running are known (from cc-statusline).
let liveTasks = [], termAgents = [];
let liveQueue = [];   // messages of yours waiting for their turn in the conversation on screen: [{id, text}]
function drawQueue() {
  const box = $('queue'), s = cur();
  if (!box) return;
  box.textContent = '';
  if (s && s.owner === 'board') liveQueue.forEach((m, i) => {
    const row = el('div', 'qrow');
    const x = el('button', '', '×'); x.type = 'button'; x.title = '取消這一則，把文字放回輸入框'; x.setAttribute('aria-label', '取消排隊的第 ' + (i + 1) + ' 則');
    x.addEventListener('click', async () => {
      const r = await api('/api/unqueue', { sessionId: s.sessionId, id: m.id });
      if (!r.ok) return say('它已經送出去了，來不及取消', true);
      const ta = $('foot') && $('foot').querySelector('textarea');

    });
    const t = el('span', 'qt', m.text.replace(/\s+/g, ' ')); t.title = m.text;
    row.append(el('span', 'qn', '排隊 ' + (i + 1) + '／' + liveQueue.length), t, x);

}
function drawTasks() {
  const box = $('tasks'), s = cur();
  if (!box) return;
  box.textContent = '';
  if (s && s.owner === 'board') {
    for (const t of liveTasks) {
      // A command whose output file is known is a button: press it to read what it has printed.
      const row = el(t.canOpen ? 'button' : 'div', 'tk' + (t.done ? ' fin' : ''));

      else e.dataset.start = t.startedAt;
      row.append(el('span', 'dot' + (t.done ? '' : ' running')), el('span', 'tk-l', t.kind === 'agent' ? '子代理' + (t.name ? ' ' + t.name : '') : '背景指令'),
        el('span', 'tk-d', (t.description || '') + (t.lastTool ? '　·　正在用 ' + t.lastTool + (t.toolUses ? '（第 ' + t.toolUses + ' 個動作）' : '') : '')), e);
      if (t.canOpen) row.append(el('span', 'tk-open', '看輸出 ›'));
      row.title = (t.description || '') + (t.canOpen ? '\n按一下看它的指令與輸出' : t.kind === 'agent' ? '\n子代理沒有可以直接看的輸出檔' : '');
