function liveOrListed() { const s = cur(); return s ? (s.owner === 'board' && liveStatus ? liveStatus : s.status) : ''; }

function drawHead() {
  const s = cur(), head = $('head');
  if (!head) return;
  head.textContent = '';
  const back = el('button', 'btn back', '←'); back.type = 'button'; back.setAttribute('aria-label', '回到清單'); back.addEventListener('click', drawHome);
  const who = el('div', 'who');
  if (!s) { who.append(el('div', 't', '這個 session 已經結束了')); head.append(back, who); return; }
  const st = liveOrListed();
  const sub = el('div', 's');
  // "background": this turn is over, but work it started is still running and it will report by itself when that is done.
  const b = el('b', st === 'busy' || st === 'background' ? 'running' : st === 'waiting' ? 'yours' : '',
    st === 'busy' ? '執行中' : st === 'background' ? '背景工作中，做完會自己回報' : st === 'waiting' ? '等你回應' : '待命');
  sub.append(b, ' · ' + (s.owner === 'board' ? '在看板裡' : s.headless ? '背景執行' : '在終端機視窗') + ' · ' + s.cwd);
  sub.title = s.cwd;
  who.append(el('div', 't', s.title), sub);
  head.append(back, who);
  const add = (label, cls, fn) => { const x = el('button', 'btn' + (cls ? ' ' + cls : ''), label); x.type = 'button'; x.addEventListener('click', fn); head.append(x); return x; };
  // Off the list, or back on it. Nothing is ended or deleted.
  add(s.hidden ? '取消隱藏' : '隱藏', '', async () => {
    const r = await api('/api/hide', { sessionId: s.sessionId, hidden: !s.hidden });
    if (!r.ok) return say(r.data.error || '改不了', true);
    const was = s.hidden; await poll();
    if (was) { drawHead(); say('已放回清單'); } else { say('已從清單隱藏「' + s.title + '」。左邊清單最下面可以再顯示'); drawHome(); }
  }).title = s.hidden ? '放回左邊的清單' : '從左邊的清單拿掉。session 照常執行，隨時可以再顯示';
  if (s.owner === 'terminal' && !s.headless && !s.parked) {
    // Two presses: the first only arms it.
    let armed = 0;
    const end = add('結束', 'danger', async () => {
      if (Date.now() - armed > 5000) { armed = Date.now(); end.textContent = '確定結束？再按一次'; setTimeout(() => { if (end.isConnected) end.textContent = '結束'; }, 5000); return; }
      end.disabled = true;
      const r = await api('/api/end', { sessionId: s.sessionId });
      if (!r.ok) { end.disabled = false; end.textContent = '結束'; return say(r.data.error || '沒有結束', true); }
      say('已結束「' + s.title + '」' + (r.data.windowClosed ? '，視窗也關了' : '，它的終端機視窗請自己關') + '。對話紀錄還在，首頁可以再開回來');
      await loadKeep(); await poll(); drawHome();
    });
    end.title = '結束這個終端機 session 的程序並關掉它的視窗。對話紀錄保留';
  }
  if (s.owner === 'terminal') {
    if (!s.headless) add('切到視窗', '', async () => say(...focusResult(s, (await api('/api/focus', { sessionId: s.sessionId })).data)));
    // kept: comes back after a restart. Only real terminal windows have the switch.
    if (typeof s.kept === 'boolean') {
      const k = add(s.kept ? '常駐：開' : '常駐：關', '', async () => {
        const r = await api('/api/keep/set', { sessionId: s.sessionId, keep: !s.kept });
        if (!r.ok) return say(r.data.error || '改不了', true);
        s.kept = r.data.kept; listShape = ''; drawHead(); drawList();
        say(s.kept ? '這個 session 會常駐：關機或重開機後可以開回來' : '這個 session 不常駐：關機後不會出現在還原清單');
      });
      k.title = s.kept ? '常駐中：關機或重開機後，看板會列出它讓你開回來。你自己關掉視窗就不再常駐。按一下改成不常駐' : '不常駐：關機後不會出現在還原清單。按一下改成常駐';
    }
  } else {
    if (st === 'busy' || st === 'waiting' || st === 'background') add('停止', 'danger', async () => {
      const r = await api('/api/stop', { sessionId: s.sessionId });
      const back = (r.data && r.data.dropped) || [];
      // What was waiting is not sent after a stop; it comes back to the input box so it is not lost.
      const ta = $('foot') && $('foot').querySelector('textarea');
      if (back.length && ta) { ta.value = [ta.value, ...back].filter(Boolean).join('\n'); ta.dispatchEvent(new Event('input')); }
      say('已停止。' + (back.length ? '排隊中的 ' + back.length + ' 則沒有送出，文字放回輸入框了。' : '再送一則訊息就會接著原本的對話繼續。'));
    });
    add('移到終端機', '', async () => {
      const r = await api('/api/to-terminal', { sessionId: s.sessionId });
      if (!r.ok) return say(r.data.error || '移不過去', true);
      say('已在新的終端機視窗開啟這個對話'); await poll(); drawHome();
    });
  }
}

function focusResult(s, r) {
  if (r.state === 'hit' && r.focused) return ['已切到「' + s.title + '」的視窗', false];
  if (r.state === 'hit') return ['找到視窗了，但 Windows 沒讓它切到最前面（當時最前面的是 ' + (r.before || '?') + '）', true];
  if (r.state === 'ambiguous') return ['有兩個以上視窗的標題開頭相同，分不出是哪一個，所以沒有切換', true];
  if (r.state === 'gone') return ['這個 session 已經結束了', true];
  if (r.state === 'none') return ['找不到這個 session 的視窗（目前有 ' + (r.windows || 0) + ' 個終端機視窗）', true];
  return ['切換失敗：' + (r.error || '沒有回應'), true];
}

function drawFoot() {
  const s = cur(), foot = $('foot');
  if (!foot) return;
  const typed = foot.querySelector('textarea') ? foot.querySelector('textarea').value : '';
  const hadFocus = document.activeElement && document.activeElement.tagName === 'TEXTAREA';
  foot.textContent = '';
  const col = el('div', 'col');
  foot.append(col);
  if (!s) return;
  if (s.owner === 'terminal') {
    const note = el('div', 'note');
    if (s.headless) { note.append(el('span', '', '這個 session 在背景執行，沒有自己的視窗，這裡只能看它的對話。')); col.append(note); return; }
    if (s.parked) { note.append(el('span', '', '這個 session 由 Claude Code 的背景服務執行，終端機視窗只是在看它。這裡只能看對話，不能搬過來。')); col.append(note); return; }
    if (!confirming) {
      note.append(el('span', '', '這個 session 開在終端機視窗裡，這裡只能看它的對話。'));
      const take = el('button', 'btn', '搬到這裡對話'); take.type = 'button';
      take.addEventListener('click', () => { confirming = true; drawFoot(); });
      note.append(take);
    } else {
      note.append(el('span', '', '搬過來之後，終端機裡的那一個會被結束（視窗會留著，可以自己關）。' + (s.status === 'busy' ? '它現在正在執行，做到一半的工作會中斷。' : '')));
      const yes = el('button', 'btn primary', '確定搬過來'); yes.type = 'button';
      const no = el('button', 'btn', '取消'); no.type = 'button';
      no.addEventListener('click', () => { confirming = false; drawFoot(); });
      yes.addEventListener('click', async () => {
        yes.disabled = true;
        const r = await api('/api/takeover', { sessionId: s.sessionId });
        confirming = false;
        if (!r.ok) { say(r.data.error || '搬不過來', true); drawFoot(); return; }
        say(r.data.windowClosed ? '已搬過來，終端機視窗也關掉了' : '已搬過來。' + (r.data.windowNote || ''), !r.data.windowClosed);
        await poll(); openChat(s.sessionId);
      });
      note.append(yes, no);
    }
    col.append(note);
    return;
  }
  const st = liveOrListed();
  const box = el('div', 'composer');
  const ta = el('textarea'); ta.rows = 1; ta.value = typed;
  ta.placeholder = st === 'busy' ? 'Claude 正在執行。可以繼續送，會排隊，輪到了自動送出' : st === 'waiting' ? '上面有卡片等你回覆。也可以先送，會排在這一輪之後' : st === 'background' ? '背景工作還在跑，你仍然可以先說話' : '輸入訊息，Enter 送出，Shift+Enter 換行';
  ta.setAttribute('aria-label', '訊息');
  const sendBtn = el('button', 'btn primary', '送出'); sendBtn.type = 'button';
  // Never blocked: a message sent while Claude is working or waiting for a card joins the queue (lib/chat.js).
  const blocked = false;
  sendBtn.disabled = blocked;
  const fit = () => { ta.style.height = 'auto'; ta.style.height = Math.min(200, ta.scrollHeight) + 'px'; };
  const go = async () => {
    const text = ta.value;
    const q = carry.get(s.sessionId);
    if (q && !text.trim()) return say('先寫下你要它對這' + (q.source === 'Gmail' ? '封信' : '些訊息') + '做什麼，再送出');
    if (!text.trim() || sendBtn.disabled) return;
    const payload = q ? quoteWrap(text, q) : text;
    // Empty the box BEFORE the request. The "busy" event comes back over the
    // stream while the request is still in flight and redraws this footer with
    // whatever the box holds; clearing afterwards cleared the old, detached box
    // and the sent text stayed on screen (seen 2026-11-12).
    ta.value = ''; fit(); showCmds();
    sendBtn.disabled = true;
    let r;
    try { r = await api('/api/send', { sessionId: s.sessionId, text: payload }); } catch (e) { r = { ok: false, data: { error: '看板程序沒有回應' } }; }
    if (!r.ok) {
      const box2 = $('foot') && $('foot').querySelector('textarea');
      if (box2 && !box2.value) box2.value = text;   // not sent: give the text back
      drawFoot();
      return say(r.data.error || '送不出去', true);
    }
    // Queued: it shows in the strip above the box and enters the conversation when its turn comes (the "sent" event).
    carry.delete(s.sessionId);
    if (r.data.queued) { drawFoot(); return; }
    append({ role: 'user', text: payload.trim() });
    toBottom();
    liveStatus = 'busy'; drawHead(); drawFoot();
  };

  // Slash commands: typing "/pl" lists the commands whose name contains "pl".
  const pop = el('div', 'cmds'); pop.hidden = true;
  let shown = [], sel = 0;
  const pick = (c) => {
    if (c.terminalOnly) { say('/' + c.name + ' 是終端機裡才有的互動畫面，看板裡不能用。可以按上面的「移到終端機」到終端機用它', true); return; }
    ta.value = '/' + c.name + ' ';
    showCmds(); fit(); ta.focus();
  };
  function showCmds() {
    const m = /^\/(\S*)$/.exec(ta.value);
    const info = cmdCache.get(s.sessionId);   // undefined while the list is still being asked for
    shown = m ? matchCommands(m[1], info ? info.commands : []) : [];
    pop.textContent = '';
    pop.hidden = !m;
    if (!m) return;
    if (sel >= shown.length) sel = 0;
    shown.forEach((c, i) => {
      const b = el('button', 'cmd' + (i === sel ? ' sel' : ''));
      b.type = 'button';
      b.append(el('span', 'cn', '/' + c.name + (c.argumentHint ? ' ' + c.argumentHint : '')));
      if (c.terminalOnly) b.append(el('span', 'tag', '只能在終端機用'));
      else if (c.description) { const d = el('span', 'cd', c.description); b.title = c.description; b.append(d); }
      b.addEventListener('mousedown', (e) => { e.preventDefault(); pick(c); });
      pop.append(b);
    });
    if (!info) pop.append(el('div', 'cmd-note', '正在向 Claude Code 問這個資料夾有哪些指令…'));
    else if (info.error && !info.commands.length) pop.append(el('div', 'cmd-note', '問不到這個資料夾的指令清單：' + info.error));
    else if (!shown.length) pop.append(el('div', 'cmd-note', '沒有符合的指令'));
    const cur = pop.querySelector('.sel'); if (cur) cur.scrollIntoView({ block: 'nearest' });
  }
  ta.addEventListener('input', () => { sel = 0; fit(); showCmds(); });
  ta.addEventListener('blur', () => { pop.hidden = true; });
  ta.addEventListener('focus', showCmds);
  ta.addEventListener('keydown', (e) => {
    if (e.isComposing) return;
    if (!pop.hidden && shown.length) {
      if (e.key === 'ArrowDown') { e.preventDefault(); sel = (sel + 1) % shown.length; return showCmds(); }
      if (e.key === 'ArrowUp') { e.preventDefault(); sel = (sel + shown.length - 1) % shown.length; return showCmds(); }
      if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); return pick(shown[sel]); }
    }
    if (e.key === 'Escape' && !pop.hidden) { e.stopPropagation(); pop.hidden = true; return; }
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); }
  });
  sendBtn.addEventListener('click', go);
  box.append(ta, sendBtn);
  col.style.position = 'relative';
  const q = carry.get(s.sessionId);
  if (q) {
    const strip = el('div', 'reply'); strip.setAttribute('role', 'note'); strip.setAttribute('aria-label', '這則訊息會引用的內容');
    const main = el('div', 'rmain');
    // Click to read all of what is quoted, click again to fold it. Kept in the entry: this footer is redrawn often.
    const head = el('div', 'rh'); const more = el('span', '', q.open ? '收合' : '展開全文'); head.append(el('b', '', '引用 ' + q.source + (q.title ? ' · ' + q.title : '')), more);
    const body = el('div', 'rt', q.open ? q.text : quoteSnippet(q.text));
    if (q.open) { strip.classList.add('open'); linkFiles(body, s.sessionId); }
    main.append(head, el('div', 'rs', q.sub || ''), body);
    main.tabIndex = 0; main.setAttribute('role', 'button'); main.setAttribute('aria-expanded', String(!!q.open));
    main.title = (q.open ? '點一下收合' : '點一下看全文') + '。送出時這段內容會附在你的話後面，並標明不是你寫的';
    const flip = () => { if (q.open && String(window.getSelection()).length) return; const at = ta.value; q.open = !q.open; drawFoot(); const t2 = $('foot') && $('foot').querySelector('textarea'); if (t2 && !t2.value) t2.value = at; };
    main.addEventListener('click', (e) => { if (e.target.closest('a, .fp')) return; flip(); });
    main.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
    const drop = el('button', '', '×'); drop.type = 'button'; drop.title = '不引用了'; drop.setAttribute('aria-label', '不引用了');
    drop.addEventListener('click', () => { carry.delete(s.sessionId); drawFoot(); });
    strip.append(main, drop); col.append(strip);
    ta.placeholder = '寫下你要它對這' + (q.source === 'Gmail' ? '封信' : '些訊息') + '做什麼，Enter 送出';
  }
  col.append(pop, box);
  fit();
  if (hadFocus || !blocked) ta.focus();
}

/* ── slash commands ── */
const cmdCache = new Map();   // sessionId -> {commands, exact}
async function loadCommands(sid) {
  try {
    const r = await api('/api/commands?sid=' + encodeURIComponent(sid));
    if (!r.ok) return;
    cmdCache.set(sid, r.data);
    // The list may arrive while "/" is already typed: redraw the popup with it.
    const ta = sid === active && $('foot') ? $('foot').querySelector('textarea') : null;
    if (ta && document.activeElement === ta) ta.dispatchEvent(new Event('focus'));
  } catch (e) {}
}
// Commands that exist only as interactive screens in the terminal. Claude Code
// does not report these for a conversation run this way, so they are listed
// here to answer "why is /plugin not in the list" instead of showing nothing.
const TERMINAL_ONLY = ['plugin', 'config', 'resume', 'agents', 'mcp', 'permissions', 'hooks', 'status', 'login', 'logout', 'help', 'memory', 'rewind', 'export', 'doctor', 'theme', 'vim', 'ide', 'terminal-setup', 'statusline', 'output-style', 'remote-control', 'add-dir', 'tasks', 'bashes', 'fast', 'effort', 'rename', 'background', 'bg'];
function matchCommands(q, live) {
  const have = new Set(live.map((c) => c.name));
  const all = live.concat(TERMINAL_ONLY.filter((n) => !have.has(n)).map((name) => ({ name, terminalOnly: true })));
  const k = q.toLowerCase();
  const rank = (n) => { const x = n.toLowerCase(); return x.startsWith(k) ? 0 : x.split(/[:\-_]/).some((p) => p.startsWith(k)) ? 1 : x.includes(k) ? 2 : 9; };
  return all.map((c) => ({ c, r: rank(c.name) })).filter((x) => x.r < 9).sort((a, b) => a.r - b.r || a.c.name.length - b.c.name.length || a.c.name.localeCompare(b.c.name)).slice(0, 12).map((x) => x.c);
}

/* ── jumping to what you said ── */
function myMessages() {
  const sc = $('scroll');
  if (!sc) return [];
  const base = sc.getBoundingClientRect().top - sc.scrollTop;
  return [...sc.querySelectorAll('.msg.user')].map((e) => ({ e, top: Math.max(0, e.getBoundingClientRect().top - base - 16) }));
}
function flash(e) { e.classList.remove('flash'); void e.offsetWidth; e.classList.add('flash'); }
// Each press goes one of your messages further up from where the view is now.
function jumpToMine() {
  const sc = $('scroll'), list = myMessages();
  if (!sc || !list.length) return say('這段對話裡還沒有你說的話');
  let target = null;
  for (const x of list) if (x.top < sc.scrollTop - 4) target = x;
  if (!target) {
    // Nothing of yours above here in what is loaded: fetch what came before, then go on from the same place.
    if (histMore && histMax < histLimit) { say('往前載入更早的對話…'); loadEarlier().then((ok) => { if (ok) jumpToMine(); }); return; }
    flash(list[0].e); return say(histMore ? '這已經是這一頁能載入的最早一則' : '這是這段對話裡你最早的一則');
  }
  sc.scrollTop = target.top;
  flash(target.e);
}
// The other way: each press goes one of your messages further down. Past your last one, to the bottom.
function jumpToMineDown() {
  const sc = $('scroll'), list = myMessages();
  if (!sc || !list.length) return say('這段對話裡還沒有你說的話');
  const target = list.find((x) => x.top > sc.scrollTop + 4);
  // The last stretch may be shorter than the screen: the view cannot go further down than its end, and is there already.
  if (!target || sc.scrollTop >= sc.scrollHeight - sc.clientHeight - 4) { toBottom(); if (!target) say('下面沒有你說的話了，已經到最新'); else flash(target.e); return; }
  sc.scrollTop = target.top;
  flash(target.e);
}
// Opening a conversation: start at your last message when the reply after it is
// longer than the screen, so it can be read downward from there; otherwise the bottom.
function startAtMine() {
  const sc = $('scroll'), list = myMessages();
  if (!sc) return;
  const last = list[list.length - 1];
  if (last && last.top < sc.scrollHeight - sc.clientHeight) sc.scrollTop = last.top; else toBottom();
}

/* ── messages ── */
const nearBottom = () => { const sc = $('scroll'); return !sc || sc.scrollHeight - sc.scrollTop - sc.clientHeight < 120; };
const toBottom = () => { const sc = $('scroll'); if (sc) sc.scrollTop = sc.scrollHeight; };

function node(it) {
  if (it.role === 'user') {
    const m = el('div', 'msg user'); if (it.id) m.dataset.id = it.id;
    const q = quoteParse(it.text);
    if (!q) { m.append(el('div', '', it.text)); linkFiles(m, active); return m; }
    // Your words in your bubble; what you quoted folded above them, opened by a click.
    const bubble = el('div');
    const card = el('button', 'quoted'); card.type = 'button'; card.setAttribute('aria-expanded', 'false'); card.title = '點一下展開引用的原文';
    const h = el('div', 'rh', '引用 ' + q.source + (q.title ? ' · ' + q.title : '')); const more = el('span', '', '展開'); h.append(more);
    const body = el('div', 'rt', quoteSnippet(q.text));
    card.append(h, body);
    card.addEventListener('click', () => {
      if (card.classList.contains('open') && String(window.getSelection()).length) return;   // selecting text in the opened quotation does not fold it
      const on = card.classList.toggle('open'); card.setAttribute('aria-expanded', String(on)); more.textContent = on ? '收合' : '展開';
      body.textContent = on ? q.text : quoteSnippet(q.text); if (on) linkFiles(body, active);
    });
    bubble.append(card, el('div', 'own', q.words));
    m.append(bubble); linkFiles(bubble.querySelector('.own'), active);
    return m;
  }
  // Where Claude Code compacted the conversation: everything above this line is what it summarized.
  if (it.role === 'compact') return el('div', 'more compact', '這之前的對話已被壓縮成摘要' + (it.ts ? ' · ' + when(it.ts) : ''));
  if (it.role === 'assistant') { const m = el('div', 'msg assistant'); m.innerHTML = md(it.text); linkFiles(m, active); return m; }
  if (it.role === 'ask') return askCard(it);
  if (it.role === 'answered') {
    const a = el('div', 'answered');
    a.append(el('div', 'ah', '你的回答'));
    for (const p of it.answers) { const row = el('div', 'ar'); row.append(el('span', 'aq2', p.question), el('b', '', p.answer)); a.append(row); }
    return a;
  }
  if (it.role === 'error') { const c = el('div', 'card err'); c.append(el('div', 'q', '出錯了'), el('div', '', it.text)); return c; }
  return null;
}

function toolLine(it) { const l = el('div', 'tl'); l.append(el('b', '', it.tool || '動作'), ' ' + (it.text || '')); l.title = it.text || ''; return l; }

// Draws one item at the end of the column. Runs of tool calls fold into one line.
function place(it) {
  const col = $('col');
  if (!col) return;
  const typing = col.querySelector('.typing');
  const before = typing || col.querySelector('.card.perm');
  if (it.role === 'tool') {
    const prev = before ? before.previousElementSibling : col.lastElementChild;
    let d = prev && prev.matches && prev.matches('details.tools') ? prev : null;
    if (!d) { d = el('details', 'tools'); d.append(el('summary')); col.insertBefore(d, before || null); }
    d.append(toolLine(it));
    const n = d.querySelectorAll('.tl').length;
    d.querySelector('summary').textContent = (n > 1 ? n + ' 個動作，最後一個：' : '') + (it.tool || '動作') + ' ' + (it.text || '');
    return;
  }
  const n = node(it);
  if (n) col.insertBefore(n, before || null);
}

function append(it) { const stick = nearBottom(); items.push(it); place(it); if (stick) toBottom(); }

function redraw(more) {
  const col = $('col');
  if (!col) return;
  col.textContent = '';
  // Only the recent end of a conversation is loaded (a transcript can be hundreds of megabytes). Earlier parts on request.
  if (more) {
    const box = el('div', 'more');
    if (histMax < histLimit) {
      // Normally not needed: scrolling up here loads them. It is what shows that more exist, and the way when the page is too short to scroll.
      const b = el('button', 'btn', histLoading ? '載入中…' : '載入更早的對話'); b.type = 'button'; b.disabled = histLoading;
      b.title = '目前載入最近 ' + sep(items.length) + ' 則。往上捲到這裡會自己往前載入';
      b.addEventListener('click', loadEarlier);
      box.append(b);
    } else box.append('已載入最近 ' + sep(items.length) + ' 則，這是這一頁的上限。更早的請在終端機用 claude --resume 開這個對話來看');
    col.append(box);
  }
  if (!items.length && !more) col.append(el('div', 'more', cur() && cur().owner === 'board' ? '在下面輸入第一則訊息' : '這個 session 還沒有對話'));
  for (const it of items) place(it);
  markPendingAsk();
  drawExtras();
}

// One question of a form, as read-only text: what was asked and what the choices were.
function questionBlock(q) {
  const box = el('div', 'aq');
  const top = el('div', 'aqh');
  if (q.header) top.append(el('span', 'chip', q.header));
  top.append(el('span', 'aqq', q.question));
  if (q.multiSelect) top.append(el('span', 'aqm', '可複選'));
  box.append(top);
  return box;
}

// A question form from the saved conversation (a terminal session's, or an already answered one).
function askCard(it) {
  const c = el('div', 'card ask');
  c.append(el('div', 'q', 'Claude 問了你 ' + it.questions.length + ' 個問題'));
  for (const q of it.questions) {
    const box = questionBlock(q);
    for (const o of q.options) { const row = el('div', 'opt'); const t = el('div'); t.append(el('b', '', o.label)); if (o.description) t.append(el('div', 'od', o.description)); row.append(el('span', 'ob', '•'), t); box.append(row); }
    c.append(box);
  }
  return c;
}

// The newest thing in a terminal session is an unanswered form: say so, and offer the way to answer it.
function markPendingAsk() {
  const col = $('col'), s = cur();
  if (!col || !s || s.owner !== 'terminal') return;
  const last = items[items.length - 1];
  const cards = col.querySelectorAll('.card.ask');
  const card = cards[cards.length - 1];
  if (!last || last.role !== 'ask' || !card || card.querySelector('.asknote')) return;
  card.classList.add('pending');
  const note = el('div', 'asknote');
  note.append(el('span', '', s.headless ? '這個 session 正在等這幾題的回答。' : '終端機正在等你回答這幾題。看板不能替終端機裡的 session 作答，請到它的視窗回答。'));
  if (!s.headless) {
    const b = el('button', 'btn primary', '到終端機回答'); b.type = 'button';
    b.addEventListener('click', async () => say(...focusResult(s, (await api('/api/focus', { sessionId: s.sessionId })).data)));
    note.append(b);
  }
  card.append(note);
}

// A question form in a conversation the board runs: filled in and sent from here.
function askForm(p) {
  const c = el('div', 'card perm ask pending');
  c.dataset.rid = p.requestId;
  c.append(el('div', 'q', 'Claude 想先問你 ' + p.questions.length + ' 個問題'));
  const send = el('button', 'btn primary', '送出回答'); send.type = 'button';
  const skip = el('button', 'btn', '不回答'); skip.type = 'button';
  const groups = [];
  p.questions.forEach((q, qi) => {
    const box = questionBlock(q);
    const kind = q.multiSelect ? 'checkbox' : 'radio';
    const inputs = [];
    const add = (label, description, isOther) => {
      const row = el('label', 'opt');
      const inp = el('input'); inp.type = kind; inp.name = 'q' + qi + '-' + p.requestId;
      const t = el('div', 'ot');
      let text = null;
      if (isOther) {
        text = el('input', 'other'); text.type = 'text'; text.placeholder = '其他（自己寫）'; text.setAttribute('aria-label', '其他回答');
        text.addEventListener('input', () => { if (text.value.trim()) inp.checked = true; check(); });
        t.append(text);
      } else { t.append(el('b', '', label)); if (description) t.append(el('div', 'od', description)); }
      inp.addEventListener('change', check);
      row.append(inp, t);
      box.append(row);
      inputs.push({ inp, label, text });
    };
    for (const o of q.options) add(o.label, o.description, false);
    add('', '', true);
    // What this question's answer is right now: the chosen labels, with typed text standing in for "other".
    groups.push(() => inputs.filter((x) => x.inp.checked).map((x) => (x.text ? x.text.value.trim() : x.label)).filter(Boolean).join(', '));
    c.append(box);
  });
  function check() { send.disabled = !groups.every((g) => g()); }
  const row = el('div', 'row'); row.style.marginTop = '12px';
  const done = async (allow) => {
    send.disabled = skip.disabled = true;
    const answers = {};
    p.questions.forEach((q, i) => { answers[q.question] = groups[i](); });
    const r = await api('/api/permission', { sessionId: active, requestId: p.requestId, allow, answers });
    if (!r.ok) { say(r.data.error === 'no such request' ? '這個提問已經不在了' : (r.data.error || '送不出去'), true); skip.disabled = false; check(); }
  };
  send.addEventListener('click', () => done(true));
  skip.addEventListener('click', () => done(false));
  row.append(send, skip);
  c.append(row);
  check();
  return c;
}

function permCard(p) {
  const c = el('div', 'card perm');
  c.dataset.rid = p.requestId;
  c.append(el('div', 'q', 'Claude 想要執行：' + (p.tool || '一個動作')), el('div', 'd', p.text || ''));
  const row = el('div', 'row');
  const yes = el('button', 'btn primary', '允許'); yes.type = 'button';
  const no = el('button', 'btn', '拒絕'); no.type = 'button';
  const answer = async (allow) => { yes.disabled = no.disabled = true; const r = await api('/api/permission', { sessionId: active, requestId: p.requestId, allow }); if (!r.ok) say('這個請求已經不在了', true); };
  yes.addEventListener('click', () => answer(true));
  no.addEventListener('click', () => answer(false));
  row.append(yes, no);
  c.append(row);
  return c;
}

// Things that are not part of the saved conversation: approval and question cards, and the "working" line.
// A card that is already on screen is left alone: redrawing it would wipe what has been filled in.
function drawExtras() {
  const col = $('col');
  if (!col) return;
  for (const x of col.querySelectorAll('.typing')) x.remove();
  for (const x of col.querySelectorAll('.card.perm')) if (!pending.has(x.dataset.rid)) x.remove();
  const writing = liveNode && liveNode.isConnected;   // the reply itself is on screen: no need to also say "working"
  const st = liveOrListed();
  if (!writing && cur() && cur().owner === 'board') {
    const line = st === 'busy' ? 'Claude 正在執行…'
      : st === 'background' ? '這一輪說完了，但它啟動的背景工作還在跑（見下方）。做完後它會自己接著回報，不用你再說話。' : '';
    if (line) col.insertBefore(el('div', 'typing', line), col.querySelector('.card.perm'));
  }
  for (const p of pending.values()) {
    if (col.querySelector('.card.perm[data-rid="' + CSS.escape(p.requestId) + '"]')) continue;
    col.append(Array.isArray(p.questions) && p.questions.length ? askForm(p) : permCard(p));
  }
}

// guard: only replace what is drawn if the saved conversation has caught up with
// it. Right after a reply the transcript can be a moment behind the stream, and
// redrawing from it then would make the newest message vanish.
// Asks for the part of the conversation before what is loaded. Resolves true when more was asked for.
async function loadEarlier() {
  if (histLoading || !histMore || histMax >= histLimit || view !== 'chat') return false;
  histLoading = true;
  const b = document.querySelector('#col .more button');
  if (b) { b.disabled = true; b.textContent = '載入中…'; }
  histMax = Math.min(histMax * 3, histLimit);
  try { await loadHistory(false, false, true); } finally { histLoading = false; }
  const again = document.querySelector('#col .more button');
  if (again) { again.disabled = false; again.textContent = '載入更早的對話'; }
  return true;
}
// keepPlace: earlier items were asked for - what you were reading stays where it is on the screen.
async function loadHistory(jump, guard, keepPlace) {
  const sid = active;
  if (!sid) return;
  let r;
  try { r = await api('/api/messages?sid=' + encodeURIComponent(sid) + '&max=' + histMax); } catch (e) { return; }
  if (sid !== active || !r.ok) return;
  const got = r.data.items || [];
  histMore = !!r.data.more;
  if (guard && !r.data.more && got.length < items.filter((i) => i.role !== 'error').length) return;
  const shape = got.length + ':' + (got.length ? got[got.length - 1].id : '') + ':' + r.data.more;
  if (shape === histShape) return;
  histShape = shape;
  if (r.data.limit) histLimit = r.data.limit;
  const sc = $('scroll');
  const fromBottom = sc ? sc.scrollHeight - sc.scrollTop : 0;
  const stick = !keepPlace && (jump || nearBottom());
  items = got;
  redraw(r.data.more);
  if (stick) toBottom();
  else if (keepPlace && sc) sc.scrollTop = sc.scrollHeight - fromBottom;
}

// The reply while it is being written: plain text that grows a few characters
// at a time. When the whole block arrives it is replaced by the formatted
// message (tables and bold cannot be laid out correctly from half a sentence).
let liveNode = null, liveText = '';
function liveDelta(text) {
  const col = $('col');
  if (!col) return;
  const stick = nearBottom();
  if (!liveNode || !liveNode.isConnected) {
    liveNode = el('div', 'msg assistant streaming');
    liveText = '';
    for (const x of col.querySelectorAll('.typing')) x.remove();   // text is appearing: "working…" has said its piece
    col.insertBefore(liveNode, col.querySelector('.card.perm'));
  }
  liveText += text;
  liveNode.textContent = liveText;
  if (stick) toBottom();
}
function liveDone() { if (liveNode) { liveNode.remove(); liveNode = null; liveText = ''; } }

function onLive(ev) {
  if (ev.type === 'delta') return liveDelta(ev.text);
  if (ev.type === 'tasks') { liveTasks = Array.isArray(ev.tasks) ? ev.tasks : []; drawTasks(); drawExtras(); return; }
  if (ev.type === 'queue') { liveQueue = Array.isArray(ev.queue) ? ev.queue : []; drawQueue(); return; }
  // A queued message whose turn has come: it is in the conversation from now on.
  if (ev.type === 'sent') { const stick = nearBottom(); append({ role: 'user', text: String(ev.text || '').trim() }); if (stick) toBottom(); liveStatus = 'busy'; drawHead(); return; }
  if (ev.type === 'thinking') { const t = $('col') && $('col').querySelector('.typing'); if (t) t.textContent = 'Claude 正在思考…'; return; }
  if (ev.type === 'assistant') { liveDone(); append({ role: 'assistant', text: ev.text }); }
  else if (ev.type === 'tool') { append({ role: 'tool', tool: ev.tool, text: ev.text }); drawExtras(); }
  else if (ev.type === 'error') append({ role: 'error', text: ev.text });
  else if (ev.type === 'permission') { pending.set(ev.requestId, ev); const stick = nearBottom(); drawExtras(); if (stick) toBottom(); }
  else if (ev.type === 'permission-done') { pending.delete(ev.requestId); drawExtras(); }
  else if (ev.type === 'state') {
    const was = liveStatus;
    liveStatus = ev.status;
    if (was !== liveStatus) { const stick = nearBottom(); drawHead(); drawFoot(); drawExtras(); if (stick) toBottom(); }
  } else if (ev.type === 'result') {
    if (ev.isError && ev.text) append({ role: 'error', text: ev.text });
    // The transcript now holds this turn: redraw from it, so what is shown is what was saved.
    const sid = active;
    api('/api/seen', { sessionId: sid });
    loadCommands(sid);
    setTimeout(() => loadStats(sid), 1500);   // cost and message count moved with this turn
    for (const wait of [800, 4000]) setTimeout(() => { if (sid === active && liveStatus !== 'busy') loadHistory(false, true); }, wait);
  }
}

/* ── files mentioned in a conversation ──
   Anything in a reply that looks like a path is sent to the server, and only
   the ones that really exist become clickable. Nothing is guessed in the page. */
const EXT = /\.[A-Za-z0-9]{1,8}(:\d+(-\d+)?(:\d+)?)?$/;
function looksLikePath(t) {
  if (!t || t.length > 400 || /[\n<>|*?]/.test(t) || /^(https?:|\/\/)/i.test(t)) return false;
  if (/^[A-Za-z]:[\\/]/.test(t) || /^~[\\/]/.test(t)) return true;
  return EXT.test(t) && !/\s{2,}/.test(t) && !/^[-.]/.test(t);   // a relative path needs an extension
}
const BARE = /[A-Za-z]:\\[^\s"'`<>|*?　-〿＀-￯]+/g;   // an absolute path in running text ends at a space or full-width punctuation

let fileQueue = [];
let fileTimer = 0;
function linkFiles(root, sid) {
  if (!root) return;
  for (const c of root.querySelectorAll('code')) {
    if (c.closest('pre') || c.dataset.fq) continue;
    const t = c.textContent.trim();
    if (looksLikePath(t)) { c.dataset.fq = '1'; fileQueue.push({ el: c, raw: t, sid }); }
  }
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: (n) => (n.parentElement.closest('code, pre, a, .fp, button') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT) });
  const texts = [];
  while (walker.nextNode()) if (/[A-Za-z]:\\/.test(walker.currentNode.nodeValue)) texts.push(walker.currentNode);
  for (const node of texts) {
    const s = node.nodeValue;
    const frag = document.createDocumentFragment();
    let last = 0, m;
    BARE.lastIndex = 0;
    while ((m = BARE.exec(s))) {
      const raw = m[0].replace(/[.,;:)\]]+$/, '');
      if (m.index > last) frag.append(s.slice(last, m.index));
      const span = el('span', '', raw);
      span.dataset.fq = '1';
      frag.append(span);
      fileQueue.push({ el: span, raw, sid });
      last = m.index + raw.length;
      BARE.lastIndex = last;
    }
    if (!last) continue;
    if (last < s.length) frag.append(s.slice(last));
    node.replaceWith(frag);
  }
  clearTimeout(fileTimer);
  fileTimer = setTimeout(checkFiles, 120);
}

async function checkFiles() {
  const batch = fileQueue;
  fileQueue = [];
  const bySid = new Map();
  for (const q of batch) { if (!bySid.has(q.sid)) bySid.set(q.sid, []); bySid.get(q.sid).push(q); }
  for (const [sid, qs] of bySid) {
    for (let i = 0; i < qs.length; i += 80) {
      const part = qs.slice(i, i + 80);
      let r;
      try { r = await api('/api/files/check', { sessionId: sid || '', paths: part.map((q) => q.raw) }); } catch (e) { continue; }
      if (!r.ok) continue;
      part.forEach((q, k) => {
        const f = r.data.files[k];
        if (!f || !q.el.isConnected) return;
        q.el.classList.add('fp');
        q.el.tabIndex = 0;
        q.el.setAttribute('role', 'button');
        // searched: the reply gave only a name; this is where a file by that name was found.
        q.el.title = (f.kind === 'dir' ? '開啟資料夾：' : f.searched ? '預覽（依檔名在資料夾裡找到' + (f.others ? '，同名的還有 ' + f.others + ' 個，這是最新的' : '') + '）：' : '預覽：') + f.abs;
        const go = () => openPeek(f);
        q.el.addEventListener('click', go);
        q.el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
      });
    }
  }
}

let peekFile = null;
let peekUrl = '';
function closePeek() {
  clearTimeout(taskPeekTimer);
  $('peek').hidden = true;
  $('peekBody').textContent = '';
  if (peekUrl) { URL.revokeObjectURL(peekUrl); peekUrl = ''; }
  peekFile = null;
}
const sizeText = (n) => (n < 1024 ? n + ' B' : n < 1048576 ? (n / 1024).toFixed(0) + ' KB' : (n / 1048576).toFixed(1) + ' MB');

async function openPeek(f) {
  closePeek();
  peekFile = f;
  $('peek').hidden = false;
  $('peekName').textContent = f.name;
  $('peekPath').textContent = '‎' + f.abs;   // left-to-right mark: the box is right-to-left so a long path shows its END
  $('peekPath').title = f.abs;
  $('peekOpen').hidden = !(f.kind !== 'dir' && f.canOpen);
  $('peekReveal').textContent = f.kind === 'dir' ? '在檔案總管開啟' : '在檔案總管顯示';
  const body = $('peekBody');
  const note = (text) => { body.textContent = ''; body.append(el('div', 'blank', text)); };
  const q = '?path=' + encodeURIComponent(f.abs);
  const grab = async (url) => {
    const res = await fetch(url, { headers: { 'x-board-token': TOKEN } });
    if (!res.ok) { let msg = ''; try { msg = (await res.json()).error || ''; } catch (e) {} throw new Error(msg || 'HTTP ' + res.status); }
    return res;
  };
  try {
    if (f.kind === 'dir') return note('這是一個資料夾。按上面的「在檔案總管開啟」。');
    if (f.kind === 'other') return note('這種檔案不能在這裡預覽。可以按上面的按鈕在檔案總管找到它。');
    if (f.kind === 'office') note('正在用 Office 把它轉成 PDF 來顯示…第一次大約要 10 到 30 秒，之後會直接顯示。');
    else note('載入中…');
    const res = await grab(f.kind === 'office' ? '/api/file/pdf' + q : '/api/file' + q);
    if (peekFile !== f) return;
    if (f.kind === 'text') {
      const text = await res.text();
      if (peekFile !== f) return;
      body.textContent = '';
      if (res.headers.get('X-Truncated') === '1') body.append(el('div', 'peek-note', '檔案很大（' + sizeText(f.size) + '），這裡只顯示前 2 MB。'));
      if (/\.(md|markdown)$/i.test(f.name)) { const m = el('div', 'msg assistant'); m.innerHTML = md(text); body.append(m); }
      else body.append(el('pre', '', text));
      return;
    }
    const blob = await res.blob();
    if (peekFile !== f) return;
    peekUrl = URL.createObjectURL(blob);
    body.textContent = '';
    if (f.kind === 'image') { const img = el('img'); img.alt = f.name; img.src = peekUrl; body.append(img); }
    else { const fr = el('iframe'); fr.title = f.name; fr.src = peekUrl; body.append(fr); }
  } catch (e) {
    if (peekFile === f) note('沒辦法預覽：' + e.message + '。可以改用上面的按鈕開啟它。');
  }
}

// A background command in the side panel: its command line, how it stands, and the end of what it has printed.
// Read again every two seconds while it runs.
let taskPeekTimer = 0;
async function openTaskPeek(sid, t) {
  closePeek();
  const f = { task: true, id: t.id, sid, name: t.description || '背景指令', abs: '', kind: 'text' };
  peekFile = f;
  $('peek').hidden = false;
  $('peekName').textContent = f.name;
  $('peekPath').textContent = '背景指令';
  $('peekOpen').hidden = true;
  $('peekReveal').textContent = '在檔案總管顯示';
  const body = $('peekBody');
  body.textContent = '';
  const cmd = el('div', 'tcmd'), stat = el('div', 'tstat', '載入中…'), out = el('pre');
  body.append(cmd, stat, out);
  const load = async () => {
    if (peekFile !== f) return;
    let r; try { r = await api('/api/task?sid=' + encodeURIComponent(sid) + '&id=' + encodeURIComponent(t.id)); } catch (e) { r = { ok: false, data: {} }; }
    if (peekFile !== f) return;
    if (!r.ok) { stat.textContent = r.data.error || '讀不到'; return; }
    const d = r.data;
    f.abs = d.path || '';
    $('peekPath').textContent = '\u200e' + (d.path || '背景指令'); $('peekPath').title = d.path || '';
    cmd.textContent = d.command ? '$ ' + d.command : '（不知道它的指令內容：它是在看板重啟之前啟動的）';
    stat.textContent = (d.running ? '執行中，已跑 ' + dur(Date.now() - d.startedAt) + '（每 2 秒更新）' : (d.status === 'completed' ? '做完了' : d.status === 'failed' ? '失敗' : '結束：' + d.status) + (d.summary ? '　·　' + d.summary : ''))
      + '　·　輸出 ' + sizeText(d.size) + (d.truncated ? '，只顯示最後 256 KB' : '') + (d.readError ? '　·　' + d.readError : '');
    // Stay at the end while you are at the end; if you scrolled up to read, stay where you are.
    const atEnd = body.scrollHeight - body.scrollTop - body.clientHeight < 40;
    out.textContent = d.text || (d.running ? '（還沒有輸出）' : '（沒有輸出）');
    if (atEnd) body.scrollTop = body.scrollHeight;
    if (d.running) taskPeekTimer = setTimeout(load, 2000);
  };
  await load();
  body.scrollTop = body.scrollHeight;
}

// Preview width: drag the left edge. Remembered in this browser; double-click the edge for the default.
const PEEK_KEY = 'session-board.peekWidth';
const peekLimits = () => ({ min: 320, max: Math.max(320, window.innerWidth - 160) });
function setPeekWidth(px, remember) {
  const { min, max } = peekLimits();
  const w = Math.round(Math.min(max, Math.max(min, px)));
  $('peek').style.width = w + 'px';
  if (remember) { try { localStorage.setItem(PEEK_KEY, String(w)); } catch (e) {} }
  return w;
}
(() => {
  const peek = $('peek'), grip = $('peekGrip');
  let saved = NaN;
  try { saved = Number(localStorage.getItem(PEEK_KEY)); } catch (e) {}
  if (Number.isFinite(saved) && saved > 0) setPeekWidth(saved, false);
  let dragging = false;
  grip.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    dragging = true;
    try { grip.setPointerCapture(e.pointerId); } catch (x) {}
    peek.classList.add('dragging'); document.body.classList.add('resizing');
    e.preventDefault();
  });
  grip.addEventListener('pointermove', (e) => { if (dragging) setPeekWidth(window.innerWidth - e.clientX, false); });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    peek.classList.remove('dragging'); document.body.classList.remove('resizing');
    setPeekWidth(peek.getBoundingClientRect().width, true);
  };
  grip.addEventListener('pointerup', end);
  grip.addEventListener('pointercancel', end);
  grip.addEventListener('dblclick', () => { peek.style.width = ''; try { localStorage.removeItem(PEEK_KEY); } catch (e) {} });
  grip.addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    setPeekWidth(peek.getBoundingClientRect().width + (e.key === 'ArrowLeft' ? 40 : -40), true);
  });
  // A window made narrower must not leave the preview wider than the screen.
  window.addEventListener('resize', () => { if (peek.style.width) setPeekWidth(parseFloat(peek.style.width), false); });
})();

$('peekClose').addEventListener('click', closePeek);
$('peekCopy').addEventListener('click', async () => { if (!peekFile) return; try { await navigator.clipboard.writeText(peekFile.abs); say('路徑已複製'); } catch (e) { say('複製失敗，請手動選取路徑', true); } });
$('peekOpen').addEventListener('click', async () => { if (!peekFile) return; const r = await api('/api/file/open', { path: peekFile.abs }); say(r.ok ? '已用預設程式開啟' : (r.data.error || '開不了'), !r.ok); });
$('peekReveal').addEventListener('click', async () => { if (!peekFile) return; const r = await api('/api/file/reveal', { path: peekFile.abs }); say(r.ok ? '已在檔案總管顯示' : (r.data.error || '找不到'), !r.ok); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('peek').hidden) closePeek(); });

/* ── figures above a conversation ── */
// 12,345 -> "1.2 萬"; 76,750,000 -> "7,675 萬"; 992,932,314 -> "9.9 億". Always with thousands separators.
// With digits given, exactly that many decimals (money); without, a whole number.
const sep = (x, digits) => Number(x).toLocaleString('en-US', { minimumFractionDigits: digits || 0, maximumFractionDigits: digits || 0 });
const bigNum = (n) => big(n);
function big(n) {
  if (n == null) return '—';
  const f = (x, d) => Number(x).toLocaleString('en-US', { maximumFractionDigits: d });   // up to d decimals, no trailing zeros
  if (n >= 1e8) return f(n / 1e8, 1) + ' 億';
  if (n >= 1e4) return f(n / 1e4, n >= 1e5 ? 0 : 1) + ' 萬';
  return f(Math.round(n), 0);
}
// "~" marks a figure cc-statusline priced with a stand-in rate.
const money = (c, est) => (c == null ? '—' : (est ? '~' : '') + '$' + (c >= 100 ? sep(Math.round(c)) : c.toFixed(2)));

// Time left until a moment: "5 天 23 時", "3 時 20 分", "12 分".
function left(ts) {
  const m = Math.max(0, Math.floor((ts - Date.now()) / 60000));
  const d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60);
  return d ? d + ' 天 ' + h + ' 時' : h ? h + ' 時 ' + (m % 60) + ' 分' : (m % 60) + ' 分';
}
let infoOpen = false;   // whether "more" is open; kept while the figures refresh and across conversations
async function loadStats(sid) {
  let r;
  try { r = await api('/api/stats?sid=' + encodeURIComponent(sid)); } catch (e) { return; }
  const box = $('info');
  if (sid !== active || !box || !r.ok) return;
  const d = r.data;
  box.textContent = '';
  // Figures on the left (they wrap among themselves on a narrow window), "more" pinned to the right of the first line.
  const chips = el('div', 'chips');
  box.append(chips);
  const chip = (label, value, title) => { const s = el('span'); s.append(label + ' ', el('b', '', value)); if (title) s.title = title; chips.append(s); };
  if (d.usage) {
    if (d.usage.byBoard) {
      chip('花費', money(d.usage.cost), '這個對話在看板裡累計的金額（含它派出的子代理），是 Claude Code 每輪回報的數字加總');
      chip('用量', big(d.usage.tok) + ' tokens', '這個對話在看板裡累計的用量，含快取讀寫');
    } else {
      chip('花費', money(d.usage.cost, d.usage.estimated), '主對話 ' + money(d.usage.mainCost) + '，子代理 ' + money(d.usage.agentCost) + '（' + d.usage.agentRuns + ' 次）。照官方牌價換算的等值金額，由狀態列外掛計算');
      chip('用量', big(d.usage.tok) + ' tokens', '主對話 ' + big(d.usage.mainTok) + '，子代理 ' + big(d.usage.agentTok) + '。含快取讀寫');
    }
  }
  if (d.context) {
    const c = d.context;
    if (c.pct != null) chip('context', c.pct + '%（' + big(c.tokens) + ' / ' + big(c.window) + '）', '最近一次回覆時送給模型的內容量（輸入加快取），除以這個模型的上限' + (c.assumed ? '。上限是推定的：用量超過 20 萬，只可能是 100 萬的那種' : '') + (c.model ? '。模型 ' + c.model : ''));
    else chip('context', big(c.tokens) + ' tokens', '最近一次回覆時送給模型的內容量。還不知道這個模型的上限是多少，所以算不出百分比' + (c.model ? '。模型 ' + c.model : ''));
  }
  if (d.compacts) chip('壓縮', sep(d.compacts.count) + ' 次', d.compacts.last ? '上次壓縮：' + when(d.compacts.last) : '這個 session 還沒被壓縮過');
  if (d.messages != null) chip('訊息', sep(d.messages) + ' 則');
  if (d.agents.running.length) chip('子代理執行中', String(d.agents.running.length), d.agents.running.join('、'));
  // Account-wide limits: the same for every session, shown here because this is where you are looking.
  const q = d.quota || {};
  const stale = q.seenAt && Date.now() - q.seenAt > 10 * 60000 ? '。這是 ' + ago(Date.now() - q.seenAt) + '前看到的數字，之後沒有 session 回報新的' : '';
  if (q.fiveHour) chip('5 小時額度', q.fiveHour.pct + '%', '整個帳號共用。' + left(q.fiveHour.resetsAt) + '後重置' + stale);
  if (q.sevenDay) chip('7 天額度', q.sevenDay.pct + '%', '整個帳號共用。' + left(q.sevenDay.resetsAt) + '後重置' + stale);
  const s0 = cur();
  if (s0 && s0.owner === 'terminal') { termAgents = d.agents.running; drawTasks(); }
  const rows = [];
  // Subagents = helpers this session handed work to (a reviewer, a tester, a searcher...).
  const runs = d.usage ? d.usage.agentRuns : 0;
  if (runs || d.agents.kinds.length || d.agents.running.length) {
    const parts = [];
    if (runs) parts.push('這個 session 把工作分派給幫手共 ' + runs + ' 次');
    parts.push(d.agents.running.length ? '現在還在跑的：' + d.agents.running.join('、') : '現在都做完了，沒有在跑的');
    if (d.agents.kinds.length) parts.push('最近用過的種類：' + d.agents.kinds.join('、'));
    rows.push(['子代理（幫手）', parts.join('；')]);
  }
  if (d.skills.length) rows.push(['常用 skill', d.skills.map((s) => s.name + ' ×' + s.count).join('、')]);
  if (d.mcp.length) rows.push(['MCP 呼叫', d.mcp.map((m) => m.name + ' ×' + m.count + (m.errors ? '（失敗 ' + m.errors + '）' : '')).join('、')]);
  if (rows.length || d.edited.length) {
    // "More" sits at the right end of the same row; what it opens goes underneath, full width.
    const tog = el('button', 'info-more'); tog.type = 'button';
    const grid = el('div', 'more-rows');
    const set = () => { grid.hidden = !infoOpen; tog.textContent = infoOpen ? '收起 ▴' : '更多 ▾'; tog.setAttribute('aria-expanded', String(infoOpen)); };
    tog.addEventListener('click', () => { infoOpen = !infoOpen; set(); });
    set();
    box.append(tog);
    for (const [k, v] of rows) grid.append(el('span', '', k), el('span', '', v));
    if (d.edited.length) {
      const files = el('span');
      d.edited.forEach((f, i) => { if (i) files.append('、'); files.append(el('code', '', f)); });
      grid.append(el('span', '', '最近改過的檔案'), files);
      linkFiles(files, sid);   // the ones that can be found become clickable, like paths in a reply
    }
    box.append(grid);
  }
  box.hidden = !chips.firstChild;
}

/* ── war room ── */
let war = null;          // last /api/warroom answer
let warShape = '';
let stopAsk = null;      // sessionId whose "stop?" confirmation is showing

function dur(ms) {
  const s = Math.floor(Math.max(0, ms) / 1000);
  if (s < 1) return '<1 秒';
  if (s < 90) return s + ' 秒';
  const m = Math.floor(s / 60);
  if (m < 60) return m + ' 分 ' + String(s % 60).padStart(2, '0') + ' 秒';
  return Math.floor(m / 60) + ' 時 ' + String(m % 60).padStart(2, '0') + ' 分';
}
function when(ts) {
  if (!ts) return '';
  const d = new Date(ts), n = new Date();
  const t = d.toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit' });
  return d.toDateString() === n.toDateString() ? t : String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0') + ' ' + t;
}
const doing = (a) => a.state === 'tool' ? '正在用 ' + a.tool : a.state === 'thinking' ? '思考中' : a.state === 'writing' ? '寫回覆中' : '啟動中';

/* ── war room: the month ── */
const thisMonth = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
let warMonth = thisMonth();
let showAllSessions = false;
const TOP_SESSIONS = 15;
const usageByMonth = new Map();   // 'YYYY-MM' -> figures, or {loading:true}, or {ok:false,error}
const shiftMonth = (ym, by) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + by, 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };

async function loadUsage(force) {
  const ym = warMonth;
  const had = usageByMonth.get(ym);
  usageByMonth.set(ym, Object.assign({}, had && had.ok ? had : {}, { loading: true }));
  drawMonth();
  let r;
  try { r = await api('/api/usage?month=' + ym + (force ? '&force=1' : '')); } catch (e) { r = { data: { ok: false, error: '看板程序沒有回應' } }; }
  usageByMonth.set(ym, r.data);
  drawMonth();
}

function drawMonth() {
  const box = $('month');
  if (!box) return;
  box.textContent = '';
  const ym = warMonth, cur = ym === thisMonth();
  const d = usageByMonth.get(ym) || { loading: true };
  const [y, mo] = ym.split('-').map(Number);

  const head = el('div', 'mhead');
  const nav = (label, to, off, title) => { const b = el('button', 'btn', label); b.type = 'button'; b.disabled = off; b.title = title; b.addEventListener('click', () => { warMonth = to; drawMonth(); if (!usageByMonth.get(to) || !usageByMonth.get(to).ok) loadUsage(false); }); return b; };
  head.append(nav('‹', shiftMonth(ym, -1), false, '上個月'), el('b', 'mname', y + ' 年 ' + mo + ' 月'), nav('›', shiftMonth(ym, 1), cur, cur ? '這已經是本月' : '下個月'));
  if (!cur) head.append(nav('回到本月', thisMonth(), false, ''));
  const side = el('span', 'mnote');
  if (d.loading) side.textContent = d.ok ? '重新計算中…' : '計算中…第一次算一個月大約要幾秒到二十秒';
  else if (d.ok) side.textContent = '計算於 ' + when(d.computedAt) + '，掃了 ' + sep(d.files) + ' 個檔、' + (d.bytes / 1e9).toFixed(2) + ' GB，花 ' + (d.tookMs / 1000).toFixed(1) + ' 秒';
  head.append(side);
  const again = el('button', 'btn', '重新計算'); again.type = 'button'; again.disabled = !!d.loading; again.addEventListener('click', () => loadUsage(true));
  head.append(again);
  box.append(head);

  if (!d.ok) { box.append(el('div', 'quiet', d.loading ? '' : '算不出來：' + (d.error || '未知的原因'))); return; }
  if (d.stale) box.append(el('div', 'bad', '這次重新計算失敗（' + (d.error || '') + '），下面是上一次算出的數字。'));
  if (!d.priced) box.append(el('div', 'bad', '找不到 cc-statusline 的單價表，所以只有 token 數、沒有金額。'));

  // The headline figures.
  const kp = el('div', 'pulse'); kp.style.borderBottom = '0'; kp.style.padding = '8px 8px 4px';
  const kpi = (n, label, title) => { const k = el('div', 'kpi'); k.append(el('div', 'n', n), el('div', 'l', label)); if (title) k.title = title; kp.append(k); };
  const elapsedDays = cur ? Math.max(1 / 24, (Date.now() - d.from) / 86400000) : d.daysInMonth;
  kpi(d.priced ? '$' + sep(d.total.cost, 2) : '—', 'API 等值費用', '照官方 API 牌價換算：如果這些用量是走 API 計費要付的金額。不是你訂閱方案實際被收的錢');
  kpi(bigNum(d.total.tok), '總 tokens', sep(d.total.tok) + ' tokens');
  if (d.priced) kpi('$' + sep(d.total.cost / elapsedDays, 0), cur ? '每天平均（到現在）' : '每天平均');
  if (d.priced && cur) kpi('$' + sep(d.total.cost / elapsedDays * d.daysInMonth, 0), '照這個速度到月底', '到目前的金額 ÷ 已過的天數 × 這個月的天數。只是線性推估');
  box.append(kp);
  const parts = el('div', 'mparts');
  for (const [label, v, tip] of [['輸入', d.total.in, '沒有命中快取的輸入'], ['輸出', d.total.out, '模型寫出來的，含思考'], ['寫入快取', d.total.cw, '第一次送進去、被存成快取的內容'], ['讀取快取', d.total.cr, '重複送、命中快取的內容。數量最大但單價最低']]) {
    const s = el('span'); s.append(label + ' ', el('b', '', bigNum(v))); s.title = tip + '：' + sep(v) + ' tokens'; parts.append(s);
  }
  parts.append(el('span', '', sep(d.sessionCount) + ' 個 session、' + sep(d.records) + ' 次模型呼叫'));
  box.append(parts);

  // One bar per day of the month.
  const max = Math.max(1e-9, ...d.days.map((x) => (d.priced ? x.cost : x.tok)));
  const today = cur ? new Date().getDate() : 0;
  const bars = el('div', 'bars'); bars.setAttribute('role', 'img');
  bars.setAttribute('aria-label', y + ' 年 ' + mo + ' 月每天的' + (d.priced ? '費用' : 'token 數') + '長條圖，最高的一天是 ' + (d.priced ? '$' + sep(max, 0) : bigNum(max)));
  const axis = el('div', 'axis');
  for (const x of d.days) {
    const v = d.priced ? x.cost : x.tok;
    const col = el('div', 'bcol');
    const b = el('div', 'b' + (x.day === today ? ' today' : '') + (v > 0 ? '' : ' zero'));
    b.style.height = v > 0 ? Math.max(2, Math.round((v / max) * 100)) + '%' : '1px';
    col.title = mo + '/' + x.day + (x.day === today ? '（今天）' : '') + '：' + (d.priced ? '$' + sep(x.cost, 2) + '，' : '') + bigNum(x.tok) + ' tokens';
    col.append(b);
    bars.append(col);
    axis.append(el('span', x.day === today ? 'today' : '', x.day === 1 || x.day % 5 === 0 || x.day === today ? String(x.day) : ''));
  }
  box.append(el('div', 'mcap', '每天的' + (d.priced ? '費用' : 'token 數') + '，最高一天 ' + (d.priced ? '$' + sep(max, 0) : bigNum(max)) + '（滑鼠停在長條上看當天數字）'), bars, axis);

  // Where it went: by model, by project, the costliest sessions.
  const share = (c) => (d.total.cost > 0 ? Math.round((c / d.total.cost) * 100) + '%' : '—');
  const table = (title, cols, rows) => {
    const t = el('div', 'mtable');
    t.append(el('h4', '', title));
    const h = el('div', 'trow cols'); cols.forEach((c, i) => h.append(el('span', i ? 'n' : '', c))); t.append(h);
    for (const r of rows) t.append(r);
    return t;
  };
  const line = (cells, title, onClick) => { const r = el(onClick ? 'button' : 'div', 'trow'); if (onClick) { r.type = 'button'; r.addEventListener('click', onClick); } cells.forEach((c, i) => r.append(c instanceof Node ? c : el('span', i ? 'n' : 't', c))); if (title) r.title = title; return r; };
  const grid = el('div', 'mgrid'); grid.style.gridTemplateColumns = 'minmax(0, 1fr)';   /* one table in it now that the model table has a row of its own */
  // The model table, full width. Cost alone does not say why a model is dear:
  // beside it stand how much it was used (calls, share of all tokens, the four
  // kinds of token) and its average rate (dollars per million tokens of the mix
  // it actually ran). High rate with a small share of use = dear but little
  // used; a large share of use = dear because much used.
  const useShare = (tok) => (d.total.tok > 0 ? Math.round((tok / d.total.tok) * 100) + '%' : '—');
  const rate = (m) => (d.priced && m.priced && m.tok > 0 ? '$' + sep((m.cost / m.tok) * 1e6, 2) : '—');
  const calls = (m) => (m.n == null ? '—' : sep(m.n));
  const mt = table('各模型', ['模型', '費用', '費用佔比', '呼叫次數', '用量佔比', '輸入', '輸出', '寫入快取', '讀取快取', '每百萬 tokens'], d.models.map((m) =>
    line([m.model + (m.priced ? (m.exact ? '' : '（暫估單價）') : '（查不到單價）'), d.priced ? '$' + sep(m.cost, 2) : '—', share(m.cost), calls(m), useShare(m.tok), bigNum(m.in), bigNum(m.out), bigNum(m.cw), bigNum(m.cr), rate(m)],
      m.model + '：共 ' + sep(m.tok) + ' tokens（輸入 ' + sep(m.in) + '、輸出 ' + sep(m.out) + '、寫入快取 ' + sep(m.cw) + '、讀取快取 ' + sep(m.cr) + '）' + (m.n ? '，' + sep(m.n) + ' 次呼叫，平均每次 $' + (m.cost / m.n).toFixed(3) + '、' + sep(Math.round(m.tok / m.n)) + ' tokens' : ''))));
  mt.classList.add('models');
  box.append(mt);
  box.append(el('div', 'mexplain', '用量佔比＝這個模型的 tokens 佔本月全部 tokens 的比例。每百萬 tokens＝費用 ÷ tokens，是它實際跑出來的平均單價（讀取快取很便宜，佔比高會把均價拉低）。費用佔比遠高於用量佔比的是「貴但少用」，兩個都高的是「貴而且多用」。' + (d.models.some((m) => m.n == null) ? '呼叫次數顯示「—」是因為這個月是舊版算的，按「重新計算」就有。' : '')));
  const topP = d.projects.slice(0, 12), restP = d.projects.slice(12);
  const pRows = topP.map((p) => line([p.name, d.priced ? '$' + sep(p.cost, 2) : '—', share(p.cost), bigNum(p.tok)], p.path || p.id));
  if (restP.length) pRows.push(line(['其他 ' + restP.length + ' 個資料夾', d.priced ? '$' + sep(restP.reduce((a, p) => a + p.cost, 0), 2) : '—', share(restP.reduce((a, p) => a + p.cost, 0)), bigNum(restP.reduce((a, p) => a + p.tok, 0))]));
  grid.append(table('各專案（session 啟動的資料夾）', ['專案', '費用', '佔比', 'tokens'], pRows));
  box.append(grid);
  // One table of sessions: what each cost this month, joined with what is known
  // about the ones that are still open (compactions, context in use, messages).
  // Every session with usage this month is in it; the open ones are always
  // shown, the rest beyond the first TOP_SESSIONS on request.
  const liveBy = new Map(sessions.map((s) => [s.sessionId, s]));
  const statBy = new Map(((war && war.usage) || []).map((u) => [u.sessionId, u]));
  const inMonth = new Set(d.sessions.map((s) => s.sessionId));
  const rows = d.sessions.map((s) => ({ id: s.sessionId, title: s.title, project: s.projectName, cost: s.cost, tok: s.tok, first: s.first, last: s.last }));
  for (const s of sessions) if (!inMonth.has(s.sessionId)) rows.push({ id: s.sessionId, title: s.title, project: s.folder, cost: null, tok: null });
  const shownRows = rows.filter((r, i) => showAllSessions || i < TOP_SESSIONS || liveBy.has(r.id));
  const st = table('各 session（本月費用由高到低，共 ' + sep(rows.length) + ' 個；有圓點的是還開著的）', ['session', '本月費用', '佔比', '本月 tokens', '壓縮', 'context', '訊息'], shownRows.map((r) => {
    const s = liveBy.get(r.id), u = statBy.get(r.id);
    const name = el('span', 't');
    if (s) name.append(el('span', 'dot ' + s.group));
    name.append((s ? s.title : r.title || 'session ' + r.id.slice(0, 8)) + '　·　' + (r.project || ''));
    const tip = (r.first ? '本月 ' + when(r.first) + ' 到 ' + when(r.last) + '。' : '這個編號在本月沒有算到用量（可能這個月還沒用，或用量記在它被搬動前的編號下）。')
      + (s ? '還開著，點了打開對話' : '已經關閉');
    return line([name, r.cost == null ? '—' : d.priced ? '$' + sep(r.cost, 2) : '—', r.cost == null ? '—' : share(r.cost), r.tok == null ? '—' : bigNum(r.tok),
      u && u.compacts != null ? sep(u.compacts) + ' 次' : '—', u ? (u.contextPct != null ? u.contextPct + '%' : bigNum(u.context)) : '—', u && u.messages != null ? sep(u.messages) : '—'],
      tip, s ? () => openChat(r.id) : null);
  }));
  st.classList.add('wide');
  box.append(st);
  if (rows.length > shownRows.length || showAllSessions) {
    const more = el('button', 'btn', showAllSessions ? '只顯示前 ' + TOP_SESSIONS + ' 個與還開著的' : '顯示全部 ' + sep(rows.length) + ' 個'); more.type = 'button'; more.style.margin = '10px 8px 0';
    more.addEventListener('click', () => { showAllSessions = !showAllSessions; drawMonth(); });
    box.append(more);
  }
  if (d.unpricedTok || d.approxTok) box.append(el('div', 'quiet', (d.approxTok ? bigNum(d.approxTok) + ' tokens 用的是相近模型的暫估單價。' : '') + (d.unpricedTok ? bigNum(d.unpricedTok) + ' tokens 查不到單價，沒算進費用。' : '')));
  if (!cur) box.append(el('div', 'quiet', '過去月份算過一次就存起來。Claude Code 會定期清掉舊的對話紀錄，之後才按「重新計算」數字可能變小。'));
}

async function pollWar() {
  let r;
  try { r = await api('/api/warroom'); } catch (e) { return; }
  if (view !== 'war' || !r.ok) return;
  war = r.data;
  fillWar();
}

// The war room is the month. What it polls for is the per-session figures
// (compactions, context, messages) that the session table joins in.
function fillWar() {
  if (view !== 'war' || !war) return;
  const shape = JSON.stringify(war.usage) + sessions.map((s) => s.sessionId + s.group + s.title).join('|');
  if (shape !== warShape) { warShape = shape; drawMonth(); }
}
function tickWar() {}

/* ── staying current ──
   The page is one file that a browser tab loads once. When the board is
   updated, an open tab would keep running the old code. So the server says
   which page file it now has, and a tab that was loaded from a different one
   reloads itself - unless that would throw away something being typed or
   answered, in which case it says so and waits to be clicked. Where you were
   (which conversation, the war room, settings) is kept in the address, so a
   reload comes back to the same place. */
let pageTag = null;
function unsavedWork() {
  if (pending.size) return true;                                    // an approval or a question form is open
  for (const x of document.querySelectorAll('textarea, input[type=text]')) if (x.value.trim() && x.id !== 'never') return true;
  return false;
}
function newPageAvailable() {
  if (!unsavedWork()) { location.reload(); return; }
  const foot = $('sideFoot');
  if (foot.dataset.newer) return;
  foot.dataset.newer = '1';
  foot.className = 'side-foot';
  foot.textContent = '';
  const b = el('button', 'btn primary', '看板有新版，按這裡重新整理'); b.type = 'button';
  b.title = '你正在輸入或有卡片還沒回覆，所以沒有自動重新整理';
  b.addEventListener('click', () => location.reload());
  foot.append(b);
}
const setPlace = (hash) => { try { history.replaceState(null, '', location.pathname + location.search + (hash ? '#' + hash : '')); } catch (e) {} };

/* ── account limits in the sidebar ── */
let sideQuotaData = null;
function drawSideQuota() {
  const box = $('sideQuota'), q = sideQuotaData || {};
  box.textContent = '';
  const row = (label, w) => {
    const r = el('div', 'sq');
    const bar = el('div', 'mbar'); const fill = el('div', 'mfill' + (w.pct >= 90 ? ' hot' : w.pct >= 70 ? ' warm' : '')); fill.style.width = Math.min(100, w.pct) + '%'; bar.append(fill);
    r.append(el('span', 'sl', label), bar, el('b', '', w.pct + '%'), el('span', 'sr', left(w.resetsAt) + '後重置'));
    r.title = label + '已用 ' + w.pct + '%，整個帳號所有 session 共用';
    box.append(r);
  };
  if (q.fiveHour) row('5 小時額度', q.fiveHour);
  if (q.sevenDay) row('7 天額度', q.sevenDay);
  if (box.firstChild && q.seenAt && Date.now() - q.seenAt > 10 * 60000) box.append(el('div', 'sr', ago(Date.now() - q.seenAt) + '前的數字'));
  box.hidden = !box.firstChild;
}
async function loadSideQuota() {
  try { const r = await api('/api/quota'); if (r.ok) { sideQuotaData = r.data; drawSideQuota(); } } catch (e) {}
}

/* ── polling ── */
function notice(lines) {
  const main = $('main');
  main.textContent = '';
  const pane = el('div', 'pane');
  pane.append(el('h2', '', lines[0]), el('p', 'lead', lines[1]));
  main.append(pane);
}

async function poll() {
  if (!TOKEN) return notice(['這個網址少了金鑰', '請在 Claude Code 裡輸入 /session-board 重新開啟這一頁。']);
  try {
    const r = await api('/api/sessions');
    if (r.status === 401) return notice(['金鑰不對', '請在 Claude Code 裡輸入 /session-board 重新開啟這一頁。']);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    sessions = r.data.sessions.filter((s) => !s.notStarted);
    unstarted = r.data.sessions.filter((s) => s.notStarted);
    if (r.data.page) { if (pageTag === null) pageTag = r.data.page; else if (r.data.page !== pageTag) return newPageAvailable(); }
    down = false;
    $('sideFoot').className = 'side-foot';
    if (!$('sideFoot').dataset.newer) $('sideFoot').textContent = sessions.length + ' 個 session · 更新於 ' + new Date().toLocaleTimeString('zh-TW', { hour12: false });
    drawList();
    if (beats % 5 === 0 || !sideQuotaData) loadSideQuota(); else drawSideQuota();   // asked every 15 seconds; the countdown is redrawn every poll
    if (beats % 5 === 0) await loadKeep();
    inboxCounts = r.data.inbox;
    $('inboxBtn').hidden = !inboxCounts;
    if (inboxCounts) {
      $('inboxDot').className = 'dot' + (inboxCounts.unread ? ' yours' : '');
      $('inboxSub').textContent = inboxCounts.valid ? inboxCounts.valid + ' 件要你處理' : inboxCounts.pending ? inboxCounts.pending + ' 串還沒判讀' : '沒有要你處理的';
      $('inboxDot').className = 'dot' + (inboxCounts.valid ? ' yours' : '');
      if (view === 'inbox' && !inboxOpen && beats % 5 === 0) fillInbox();
    }
    const running = sessions.filter((s) => s.status === 'busy' || s.status === 'background').length;
    $('warDot').className = 'dot' + (running ? ' running' : '');
    $('warSub').textContent = running ? running + ' 個正在執行' : '現在沒有 session 在跑';
    $('warBtn').classList.toggle('active', view === 'war');
    if (view === 'war') pollWar();
    if (view === 'chat') {
      const s = cur();
      // A terminal session has no stream: its conversation is re-read while you watch it.
      if (s && s.owner === 'terminal') { drawHead(); loadHistory(false); }
      if (s && beats % 2 === 0) loadStats(s.sessionId);   // every 6 seconds: this is also where a terminal session's running subagents come from
      if (!s) { drawHead(); drawFoot(); }
    } else if (view === 'home') {
      const shape = sessions.filter((s) => s.group === 'yours').map((s) => s.sessionId + s.title).join('|') + '#' + keepShape();
      // Not while you are typing in the search box: redrawing would take the box away from under you.
      const typing = document.activeElement && document.activeElement.type === 'search';
      if ((shape !== homeShape && !typing) || !$('main').firstChild) { homeShape = shape; drawHome(); }
    }
  } catch (e) {
    if (!down) { down = true; $('sideFoot').className = 'side-foot down'; $('sideFoot').textContent = '看板程序沒有回應，畫面是舊的。輸入 /session-board 重新啟動'; }
  }
}

$('newBtn').addEventListener('click', drawNew);
$('warBtn').addEventListener('click', drawWar);
$('setBtn').addEventListener('click', drawSettings);
$('inboxBtn').addEventListener('click', drawInbox);
$('pastBtn').addEventListener('click', drawPastPage);
$('homeBtn').addEventListener('click', drawHome);
setInterval(() => { tickWar(); tickTasks(); }, 1000);
// Come back to where the address says you were (set by setPlace as you move around).
// Read before the first poll: that poll draws the home view, which clears the address.
const startAt = (() => { try { return decodeURIComponent(location.hash.slice(1)); } catch (e) { return ''; } })();
poll().then(() => {
  const at = startAt;
  if (at === 'war') drawWar();
  else if (at === 'settings') drawSettings();
  else if (at === 'inbox') drawInbox();
  else if (at === 'past') drawPastPage();
  else if (at && sessions.some((s) => s.sessionId === at)) openChat(at);
  else redrawLists();
});
// Every 3 seconds while the tab is showing, every 15 while it is not: the count
// in the tab title is what gets read when the tab is in the background.
let beats = 0;
setInterval(() => { beats++; if (!document.hidden || beats % 5 === 0) poll(); }, 3000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
</script>
</body>
</html>
