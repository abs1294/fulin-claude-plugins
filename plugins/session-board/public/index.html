function focusResult(s, r) {
  if (r.state === 'hit' && r.focused) return ['已顯示「' + s.title + '」的終端機視窗', false];
  if (r.state === 'hit') return ['找到視窗了，但 Windows 沒讓它切到最前面' + (r.before ? '（當時最前面的是 ' + r.before + '）' : ''), true];
  if (r.state === 'miss') return [r.error || '找不到它的視窗', true];   // macOS: no Terminal tab with its tty
  if (r.state === 'ambiguous') return ['有兩個以上視窗的標題開頭相同，分不出是哪一個，所以沒有切換', true];
  if (r.state === 'gone') return ['這個 session 已經結束了', true];
  if (r.state === 'none') return ['找不到這個 session 的視窗（目前有 ' + (r.windows || 0) + ' 個終端機視窗）', true];
  return ['切換失敗：' + (r.error || '沒有回應'), true];
}

// The role a conversation is started as. Offered only until the first message is sent: the row above the box of a
// conversation in which nothing has been said yet. The roles are the folder's own (lib/chat.js roles()).
// Pictures waiting to be sent, per conversation: kept here because the footer is redrawn often. {mime, data (base64), url, name}
// What was pasted, when it came as HTML with pictures or a table in it. -> {text, pics: [src, …]}
// text: the content as text - a table as a Markdown table, a line break where a block ends. pics: where each
// picture is said to be (emoji and other tiny inline images are not pictures: their alt text is kept instead).
function pastedHtml(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const pics = [];
  const cellText = (c) => walk(c).replace(/\s*\n\s*/g, ' ').replace(/\|/g, '\\|').trim();
  const table = (t) => {
    const rows = [...t.querySelectorAll('tr')].map((r) => [...r.children].filter((c) => /^T[DH]$/.test(c.tagName)).map(cellText)).filter((r) => r.length);
    if (!rows.length) return '';
    const n = Math.max(...rows.map((r) => r.length)), pad = (r) => r.concat(Array(n - r.length).fill(''));
    return '\n\n' + [pad(rows[0]), Array(n).fill('---'), ...rows.slice(1).map(pad)].map((r) => '| ' + r.join(' | ') + ' |').join('\n') + '\n\n';
  };
  function walk(node) {
    let out = '';
    for (const n of node.childNodes) {
      if (n.nodeType === 3) { out += n.nodeValue.replace(/\s+/g, ' '); continue; }
      if (n.nodeType !== 1) continue;
      const tag = n.tagName;
      if (tag === 'STYLE' || tag === 'SCRIPT' || tag === 'HEAD' || tag === 'TITLE') continue;
      if (tag === 'IMG') {

const faceInitials = (t) => { const w = String(t || '').trim(); return /^[\x00-\x7f]/.test(w) ? w.replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || '?' : [...w].slice(0, 1).join(''); };

    .map(([s, k]) => [s, k === 'stuck' ? 'stuck' : 'wait']);   // in the list's colours: amber waits for you, red may be stuck

/* ── slash commands ── */
const cmdCache = new Map();   // sessionId -> {commands, exact}
async function loadCommands(sid) {
  try {
    const r = await api('/api/commands?sid=' + encodeURIComponent(sid));
    if (!r.ok) return;
    cmdCache.set(sid, r.data);
    // How often each was used not counted yet (the board just started): asked again in a little while, so the ones you
    // use most come first (until then the list is in name order)
    if (r.data.counted === false && !loadCommands.again.has(sid)) { loadCommands.again.add(sid); setTimeout(() => loadCommands(sid), 8000); }
    // The list may arrive while "/" is already typed: redraw the popup with it.
    const ta = sid === active && $('foot') ? $('foot').querySelector('textarea') : null;
    if (ta && document.activeElement === ta) ta.dispatchEvent(new Event('focus'));
  } catch (e) {}
}
loadCommands.again = new Set();   // conversations asked a second time for the counts (once each)
// Commands that exist only as interactive screens in the terminal. Claude Code
// does not report these for a conversation run this way, so they are listed
// here to answer "why is /plugin not in the list" instead of showing nothing.
const TERMINAL_ONLY = ['plugin', 'config', 'resume', 'agents', 'mcp', 'permissions', 'hooks', 'status', 'login', 'logout', 'help', 'memory', 'rewind', 'export', 'doctor', 'theme', 'vim', 'ide', 'terminal-setup', 'statusline', 'output-style', 'remote-control', 'add-dir', 'tasks', 'bashes', 'fast', 'effort', 'rename', 'background', 'bg'];
// The ones you use most come first (usage: how many times each was run on this computer, counted by the board every few
// minutes from Claude Code's records - lib/cmduse.js); those that only work in a terminal after the rest.
function usedTimes(usage) {
  // Maps, not plain objects: a command called constructor is just a name (an object would answer with its function)
  const by = new Map(Object.entries(usage || {}).filter(([, v]) => Number.isFinite(v))), short = new Map();
  for (const [k, v] of by) { const t = k.split(':').pop(); if (t !== k) short.set(t, (short.get(t) || 0) + v); }
  return (name) => by.get(name) || short.get(name) || 0;
}
// Listed by Claude Code for every session, yet not working in the board's (non-interactive) one - measured 2026-11-21
// by sending each: /focus says "isn't available here yet"; /doctor gives no answer at all, the conversation stuck.
// (/color and /reload-plugins, which Claude Code also calls terminal ones, do work there: not in this list.)
const NOT_ON_BOARD = new Map([['doctor', '它在看板裡不會回應，對話會卡住'], ['focus', "Claude Code 回「isn't available here yet」"]]);
function matchCommands(q, live, usage) {
  const used = usedTimes(usage);
  live = live.map((c) => (NOT_ON_BOARD.has(c.name) ? Object.assign({}, c, { terminalOnly: true }) : c));
  const have = new Set(live.map((c) => c.name));
  const all = live.concat(TERMINAL_ONLY.filter((n) => !have.has(n)).map((name) => ({ name, terminalOnly: true })));
  const k = q.toLowerCase();
  const rank = (n) => { const x = n.toLowerCase(); return x.startsWith(k) ? 0 : x.split(/[:\-_]/).some((p) => p.startsWith(k)) ? 1 : x.includes(k) ? 2 : 9; };
  return all.map((c) => ({ c, r: rank(c.name), u: used(c.name) })).filter((x) => x.r < 9).sort((a, b) => a.r - b.r || !!a.c.terminalOnly - !!b.c.terminalOnly || b.u - a.u || a.c.name.length - b.c.name.length || a.c.name.localeCompare(b.c.name)).slice(0, 12).map((x) => Object.assign({}, x.c, { used: x.u }));
}

/* ── jumping to what you said ── */
function myMessages() {
  const sc = $('scroll');
  if (!sc) return [];
  // The text size zooms the whole page (html zoom): positions on screen are then that many times the scroll distance,
  // so they are divided back before being used as a scroll position (at 1.3 a jump landed hundreds of pixels too far,
  // under the header).
  const z = parseFloat(getComputedStyle(document.documentElement).zoom) || 1;
  const areaTop = sc.getBoundingClientRect().top;
  return [...sc.querySelectorAll('.msg.user')].map((e) => ({ e, top: Math.max(0, (e.getBoundingClientRect().top - areaTop) / z + sc.scrollTop - 16) }));
}
function flash(e) { e.classList.remove('flash'); void e.offsetWidth; e.classList.add('flash'); }
// To a reply of a conversation, and what it named in it marked (asked 2026-11-20: from 「改了什麼」, "pressing it takes me
// to where it last spoke of this"). id: the reply as lib/history.js names it; needle: the words to mark in it. The
// earlier part of the conversation is loaded until the reply is there.
async function jumpToReply(sid, id, needle) {
  if (active !== sid || view !== 'chat' || !$('col')) await openChat(sid);
  if (active !== sid) return;
  const find = () => document.querySelector('#col [data-id="' + CSS.escape(id) + '"]');
  let target = find();
  for (let i = 0; !target && histMore && i < 8; i++) { say('往前載入更早的對話…'); if (!(await loadEarlier())) break; target = find(); }
  if (!target) { say('找不到那一則回覆：可能太早，超出看板能載入的範圍了', true); return; }
  if (matchMedia('(max-width: 900px)').matches) closePeek();   // a narrow window: the panel stands over the conversation
  histReadyAt = Date.now() + 1500;   // the jump itself must not set off loading what came before
  for (const old of document.querySelectorAll('#col mark.hit')) old.replaceWith(...old.childNodes);
  let hit = null;
  const words = [needle, String(needle || '').split(/[\\/]/).pop()].filter((x, i, a) => x && a.indexOf(x) === i);
  for (const w of words) {
    const walker = document.createTreeWalker(target, NodeFilter.SHOW_TEXT);
    while (!hit && walker.nextNode()) {
      const n = walker.currentNode, k = n.nodeValue.indexOf(w);
      if (k < 0) continue;
      const r = document.createRange(); r.setStart(n, k); r.setEnd(n, k + w.length);
      hit = el('mark', 'hit'); r.surroundContents(hit);
    }
    if (hit) break;
  }
  // a link written as [words](address) shows its words, not the address: the link itself, found by where it goes
  if (!hit && /^https?:/i.test(needle || '')) {
    const same = (h) => { try { return h === needle || decodeURI(h) === decodeURI(needle); } catch (e) { return h === needle; } };
    const a = [...target.querySelectorAll('a[href]')].find((x) => same(x.getAttribute('href')));
    if (a) { hit = el('mark', 'hit'); hit.append(...a.childNodes); a.append(hit); }
  }
  (hit || target).scrollIntoView({ block: 'center' });
  flash(target);
}
// Each press goes one of your messages further up from where the view is now.
function jumpToMine() {

  let target = null;
  for (const x of list) if (x.top < sc.scrollTop - 4) target = x;
  if (!target) {
    // Nothing of yours above here in what is loaded: fetch what came before, then go on from the same place.
    if (histMore && histMax < histLimit) { say('往前載入更早的對話…'); loadEarlier().then((ok) => { if (ok) jumpToMine(); }); return; }
    flash(list[0].e); return say(histMore ? '這已經是這一頁能載入的最早一則' : '這是這段對話裡你最早的一則');
  }

// The other way: each press goes one of your messages further down. Past your last one, to the bottom.
function jumpToMineDown() {
  const sc = $('scroll'), list = myMessages();
  if (!sc || !list.length) return say('這段對話裡還沒有你說的話');
  const target = list.find((x) => x.top > sc.scrollTop + 4);

  if (!target || sc.scrollTop >= sc.scrollHeight - sc.clientHeight - 4) { toBottom(); if (!target) say('下面沒有你說的話了，已經到最新'); else flash(target.e); return; }

}

const PEEK_KEY = 'session-board.peekWidth';

function setPeekWidth(px, remember) {

    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();

  if (s < 1) return '<1 秒';
  if (s < 90) return s + ' 秒';
  const m = Math.floor(s / 60);
  if (m < 60) return m + ' 分 ' + String(s % 60).padStart(2, '0') + ' 秒';
  return Math.floor(m / 60) + ' 時 ' + String(m % 60).padStart(2, '0') + ' 分';
}
function when(ts) {
  if (!ts) return '';
  const d = new Date(ts), n = new Date();
  const t = d.toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit' });
  return d.toDateString() === n.toDateString() ? t : String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0') + ' ' + t;
}

  const b = el('button', 'upd-fab'); b.type = 'button'; b.title = '有新版本：按一下把 plugin 更新到最新，看板有新版就重開'; b.setAttribute('aria-label', '有新版本，點我更新');
  b.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg><span>有新版本，點我更新</span>';
  let busy = false;
  b.addEventListener('click', async () => {
    if (busy) return; busy = true; b.classList.add('busy'); b.setAttribute('aria-busy', 'true');
    const lbl = b.querySelector('span:not(.ld)'); if (lbl) lbl.textContent = '更新中…'; ldAdd(b);   // in place of its own icon
    const done = () => { busy = false; b.classList.remove('busy'); b.removeAttribute('aria-busy'); for (const x of b.querySelectorAll('.ld')) x.remove(); if (lbl) lbl.textContent = words; };
    try {
      say('更新中：把 plugin 更新到最新（可能要一兩分鐘）…');
      const u = await api('/api/plugins/update', {});
      if (!u.ok) { say('plugin 沒有更新成功：' + (u.data.error || u.status), true); return done(); }
      const sum = u.data.summary || '都已是最新版';
      const r = await api('/api/restart', { onlyIfNewer: true });
      if (r.status === 409) {
        const who = (r.data.active || []).map((a) => '「' + String(a.title || a.sessionId).slice(0, 30) + '」').join('、');
        say('plugin：' + sum + '。看板有新版 ' + r.data.newest + '，但沒有重開：' + who + ' 還在做事，重開會中斷它。做完再按一次這個鈕', true);
        return done();
      }
      if (!r.ok) { say('plugin：' + sum + '。看板沒有重開：' + (r.data.error || r.status), true); return done(); }
      if (!r.data.restarted) { say('plugin：' + sum + '。看板已是最新版 ' + r.data.version); b.hidden = true; return done(); }   // shown again only if the next check finds more
      say('plugin：' + sum + '。看板從 ' + r.data.from + ' 換成 ' + r.data.to + '，重開中…');
      // the new one answering with the new version: the page reloads (the boxes' words kept as drafts)
      let oldSeen = 0;
      for (let i = 0; i < 60; i++) {
        await new Promise((ok) => setTimeout(ok, 1000));
        let p; try { p = await (await fetch('/api/ping', { headers: { 'x-board-token': TOKEN } })).json(); } catch (e) { p = null; }
        if (p && p.app === 'session-board' && p.version === r.data.to) { reloadKeepingDrafts(true); return; }
        // the old one still answering a while later: it called the restart off (a conversation began working just then)
        if (p && p.app === 'session-board' && p.version === r.data.from && ++oldSeen >= 5) { say('看板沒有重開：剛好有對話開始做事，所以取消了，舊版 ' + r.data.from + ' 照常在跑。等它做完再按一次', true); done(); return; }
      }
      say('看板 60 秒內沒有開回來。在終端機打 /session-board，或執行 node scripts/start.js', true); done();
    } catch (e) { say('更新失敗：' + String((e && e.message) || e), true); done(); }
  });
  const ver = el('span', 'ver-fab'); ver.hidden = true; document.body.append(b, ver);
  // Where it stands (asked 2026-11-20: at the right of the screen, beside the message box):
  //   room right of the box for it whole - there, level with the box;  room for a circle - the icon alone there;
  //   no room (a narrow window, a phone) - above the jump buttons at the right;  no message box - the bottom right corner.
  // Worked out again when the window, the page or the jump buttons change (checked twice a second: cheap, and nothing
  // has to tell it what changed).
  const GAP = 16;
  let shape = '';
  const place = () => {
    // nothing to update: the version there instead (not over the conversation, where there is no room beside the box)
    const e = b.hidden ? ver : b;
    if (b.hidden && boardVersion) { const t = 'v' + boardVersion; if (ver.textContent !== t) { ver.textContent = t; ver.title = '看板的版本'; } } else if (b.hidden) return;
    if (!b.hidden && !ver.hidden) ver.hidden = true;
    if (b.hidden && ver.hidden) { ver.hidden = false; shape = ''; }
    const vw = innerWidth, vh = innerHeight;
    const box = $('foot') && $('foot').offsetParent !== null ? $('foot').querySelector('.composer') : null;
    const jump = document.querySelector('.scrollwrap .jump');
    let mode = 'corner', right = 22, bottom = 20;
    if (box && box.offsetParent !== null) {
      const r = box.getBoundingClientRect(), free = vw - r.right;
      b.classList.remove('round'); const whole = e.offsetWidth || 120;
      const mid = vh - (r.top + r.bottom) / 2;
      // against the right edge, in line with the jump buttons above it (centred in the room it looked adrift, 2026-11-20)
      // no room for its words beside the box: above the box's right end, words and all - never the icon alone (its words
      // are what it says: 「有新版本，點我更新」, asked 2026-11-20)
      if (free >= whole + 22 + GAP) { mode = 'beside'; bottom = Math.round(mid - e.offsetHeight / 2); }
      else {
        mode = 'above';
        const shown = jump && [...jump.children].filter((c) => !c.hidden && c.offsetParent !== null);
        const top = shown && shown.length ? Math.min(...shown.map((c) => c.getBoundingClientRect().top)) : r.top;
        bottom = Math.round(vh - top + 8);
      }
    }
    if (e === ver) ver.style.visibility = mode === 'above' ? 'hidden' : '';
    const s = (e === ver ? 'v' : '') + mode + right + ',' + bottom;
    if (s === shape) return; shape = s;
    b.classList.toggle('round', mode === 'round');
    // measured on the screen; the page's text size (html zoom) multiplies what is set back - so divided by it
    const z = parseFloat(getComputedStyle(document.documentElement).zoom) || 1;
    e.style.right = Math.round(right / z) + 'px'; e.style.bottom = Math.round(bottom / z) + 'px';
    e.dataset.place = mode;
  };
  place(); addEventListener('resize', place); setInterval(place, 500);
  // Shown only when there is something to update (asked 2026-11-20): the board checks once a day by itself (lib/auto.js
  // "check"); the page asks for that result when it opens and every 5 minutes. Said on it: what there is.
  b.hidden = true;
  const want = async () => {
    if (busy) return;
    let r; try { r = await api('/api/auto'); } catch (e) { return; }
    const c = r && r.ok && r.data.check;
    const need = !!(c && c.need);
    if (need) {
      const parts = (c.behind || []).map((x) => x.name + ' ' + (x.from || '?') + ' → ' + (x.to || '?'));
      if (c.board && c.board.newest && c.board.newest !== c.board.running) parts.push('看板 ' + c.board.running + ' → ' + c.board.newest + '（要重開）');
      b.title = '有更新：' + parts.join('、') + '。按一下：更新 plugin' + (c.board && c.board.newest !== c.board.running ? '，並重開看板' : '');
      words = '有新版本' + (c.board && c.board.newest && c.board.newest !== c.board.running ? ' v' + c.board.newest : '') + '，點我更新';
      const lb = b.querySelector('span:not(.ld)'); if (lb && lb.textContent !== words) { lb.textContent = words; shape = ''; }
      b.setAttribute('aria-label', words + '（有 ' + parts.length + ' 項可以更新）');
    }
    if (b.hidden === need) { b.hidden = !need; shape = ''; } place();
  };
  want(); setInterval(want, 300000);
})();
// The words in the board conversations' boxes, saved as their drafts (they come back after the reload); then reloaded.
async function reloadKeepingDrafts(pressed) {
  const box = cur() && cur().owner === 'board' && $('foot') ? $('foot').querySelector('textarea') : null;
  if (box) draftNow.set(cur().sessionId, box.value.replace(/［[檔圖]\d+］/g, ''));
  const saves = [draftSettled()];   // (one still on its way from before, then each of these)
  for (const [sid, t] of draftNow) { clearTimeout(draftTimers.get(sid)); saves.push(saveDraft(sid, t)); }
  // Not reloaded until every one is kept: one refused or not back in 3 seconds leaves the button to press instead.
  // Pressed with that so: said once; pressed again, reloaded as asked.
  const all = await Promise.race([Promise.all(saves).then((a) => a.every((x) => x !== false)), new Promise((r) => setTimeout(() => r(false), 3000))]);
  const held = heldAnywhere();
  if ((all && !held) || (pressed && pageUnsavedOnce === 'told')) { location.reload(); return; }
  if (pressed && all) { pageUnsavedOnce = 'told'; newPageAvailable(); return say('還有 ' + held + ' 個附件（或只留在這一頁的暫存、收件引用）沒送出，重新整理會不見。先送出；要直接重新整理就再按一次', true); }
  if (pressed) { pageUnsavedOnce = 'told'; return say('輸入框裡的字還沒存到看板（存檔沒有回來或被拒）。再按一次就直接重新整理，沒存到的字' + (held ? '和 ' + held + ' 個只留在這一頁的附件（或暫存、收件引用）' : '') + '會不見', true); }
  pageUnsavedOnce = true; newPageAvailable();
}
let pageUnsavedOnce = false;   // the save before reloading did not come back: from now on ask, do not reload by itself
function newPageAvailable() {
  if (!pageUnsavedOnce && !unsavedWork()) { reloadKeepingDrafts(); return true; }
  const foot = $('sideFoot');
  if (foot.dataset.newer && $('sideFootText').querySelector('button')) return;   // (the board gone meanwhile wrote over it: there again)
  foot.dataset.newer = '1';
  foot.className = 'side-foot';
  const text = $('sideFootText'); text.textContent = '';   // the text part only: the phone button beside it stays
  const tip = '你有卡片還沒回覆、有填到一半的欄位，或有只留在這一頁的東西（還沒送出的附件、暫存、收件引用），所以沒有自動重新整理';
  const b = el('button', 'btn primary', '看板有新版，按這裡重新整理'); b.type = 'button'; b.title = tip;
  b.addEventListener('click', () => reloadKeepingDrafts(true));
  text.append(b);
  // On a phone (and with the left column folded) that line is not shown: the same button over the top of the page
  // (0.10.0 hid the line on a phone, and a page left open stayed on the old version - seen 2026-11-19).
  if (!$('newBar')) { const bar = el('button', '', '看板有新版，按這裡重新整理'); bar.id = 'newBar'; bar.type = 'button'; bar.title = tip; bar.addEventListener('click', () => reloadKeepingDrafts(true)); document.body.append(bar); }
}
const setPlace = (hash) => { let at = location.hash.replace(/^#/, ""); try { at = decodeURIComponent(at); } catch (e) {} if (at !== String(hash || "")) closeBell();   // another page (not a redraw of the same one): the notices box does not stay over it
 const url = location.pathname + location.search + (hash ? '#' + hash : '');
  // another page: a new entry in the browser's history, so its back button comes back here (a redraw of the same page,
  // the first page drawn, or a page reached through the history itself: the entry is only rewritten)
  try { if (placeQuiet || at === String(hash || '')) history.replaceState({ sb: placeDepth }, '', url); else { placeDepth++; history.pushState({ sb: placeDepth }, '', url); } } catch (e) {} };
// How many of the board's own pages are behind this one in this tab (0: opened here directly), and whether moving now
// should leave the history as it is (while the first page is chosen, and while following the browser's back / forward).
let placeDepth = (history.state && history.state.sb) || 0, placeQuiet = true;
// The page's ← : the page before, as the browser's back button would - or, when this tab came straight here, the given one.
function goBack(fallback) { if (placeDepth > 0) history.back(); else fallback(); }
window.addEventListener('popstate', (e) => {
  placeDepth = (e.state && e.state.sb) || 0;
  let at = ''; try { at = decodeURIComponent(location.hash.slice(1)); } catch (x) {}
  placeQuiet = true; try { goPlace(at); } finally { placeQuiet = false; }
});

/* ── account limits in the sidebar ── */
let sideQuotaData = null;
function drawSideQuota() {
  const box = $('sideQuota'), q = sideQuotaData || {};
  box.textContent = '';
  const row = (label, w) => {
    const r = el('div', 'sq');
    const bar = el('div', 'mbar'); const fill = el('div', 'mfill' + (w.pct >= 90 ? ' hot' : w.pct >= 70 ? ' warm' : '')); fill.style.width = Math.min(100, w.pct) + '%'; bar.append(fill);
    const sl = el('span', 'sl', label); sl.append(el('span', 'sx', '額度'));   // "額度" left out on a phone, where the two stand side by side
    r.append(sl, bar, el('b', '', w.pct + '%'), el('span', 'sr', left(w.resetsAt) + '後重置'));
    r.title = label + '額度已用 ' + w.pct + '%，' + left(w.resetsAt) + '後重置；整個帳號所有 session 共用';
    box.append(r);
  };
  if (q.fiveHour) row('5 小時', q.fiveHour);
  if (q.sevenDay) row('7 天', q.sevenDay);
  box.classList.toggle('one', box.querySelectorAll('.sq').length === 1);   // one limit only (the 5-hour one is not always reported): the whole row
  // how old it is, and what is missing for it to be kept up to date (cc-statusline gathers it, the board only reads)
  if (box.firstChild && q.seenAt && Date.now() - q.seenAt > 10 * 60000) box.append(el('div', 'sr', ago(Date.now() - q.seenAt) + '前的數字'));
  if (q.from === '') { const d = el('div', 'sr', '沒有額度資料：需要 cc-statusline'); d.title = '額度由 cc-statusline 這個 plugin 收集（1.9.0 以上），看板只讀。裝好或更新之後，下一次問答結束就會出現。'; box.append(d); }
  box.hidden = !box.firstChild;
}
async function loadSideQuota() {
  try { const r = await api('/api/quota'); if (r.ok) { sideQuotaData = r.data; drawSideQuota(); } } catch (e) {}
}

/* ── polling ── */
function notice(lines) {
  const main = $('main');
  main.textContent = '';
  const pane = el('div', 'pane');
  pane.append(el('h2', '', lines[0]), el('p', 'lead', lines[1]));
  main.append(pane);
}

async function poll() {
  if (!TOKEN) return;   // nothing would be answered (see noKey)
  syncHeld();
  if (!TOKEN) return notice(['這個網址少了金鑰', '請在 Claude Code 裡輸入 /session-board 重新開啟這一頁。']);
  try {
    const r = await api('/api/sessions');
    if (r.status === 401) return notice(['金鑰不對', '請在 Claude Code 裡輸入 /session-board 重新開啟這一頁。']);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    { const was = noticeOpen; noticeOpen = r.data.noticeOpen || 0;
      const bn = $('bellN'); bn.hidden = !noticeOpen; bn.textContent = noticeOpen > 99 ? '99+' : String(noticeOpen);
      $('bellBtn').classList.toggle('has', !!noticeOpen); $('bellBtn').title = noticeOpen ? '通知：' + noticeOpen + ' 件還沒處理' : '通知：沒有要處理的';
      if (!$('bellPop').hidden && was !== noticeOpen) fillNotices(); }
    schedNotices = r.data.schedNotices || 0;
    $('schedDot').className = 'dot' + (schedNotices ? ' yours' : ''); $('schedSub').textContent = schedNotices ? schedNotices + ' 則通知等你處理' : '到點自動做一件事';
    features = r.data.features || {};
    PLATFORM = features.platform || '';
    syncTextSize(features[SIZE_KEY()]);
    if (features.prefs) syncSkin(features.prefs[SKIN_KEY()]);
  if ('loadMine' in features) syncMine(features.loadMine);
  if (features.prefs && features.prefs.loadIcon) syncLoad(features.prefs.loadIcon);
    applyFold();
    sessions = r.data.sessions.filter((s) => !s.notStarted);
    for (const s of sessions) if (s.programHidden) { s.hidden = true; s.hiddenWhy = 'program'; }
    unstarted = r.data.sessions.filter((s) => s.notStarted);
    if (r.data.version) boardVersion = r.data.version;
    if (active) setTimeout(() => stashRow(active), 0);   // (put aside, or taken back, on another device)
    if (r.data.page) { if (pageTag === null) pageTag = r.data.page; else if (r.data.page !== pageTag && newPageAvailable()) return; }   // (not reloaded by itself: the rest of the page goes on as before)
    down = false; $('downBar').hidden = true;
    $('sideFoot').className = 'side-foot';
    if (!$('sideFoot').dataset.newer) $('sideFootText').textContent = sessions.length + ' 個 session · 更新於 ' + new Date().toLocaleTimeString('zh-TW', { hour12: false });
    drawList();
    if (beats % 5 === 0 || !sideQuotaData) loadSideQuota(); else drawSideQuota();   // asked every 15 seconds; the countdown is redrawn every poll
    if (beats % 5 === 0) await loadKeep();

      $('inboxSub').textContent = inboxCounts.valid ? inboxCounts.valid + ' 件要你處理' : inboxCounts.pending ? inboxCounts.pending + ' 串還沒判讀' : '沒有要你處理的';
      $('inboxDot').className = 'dot' + (inboxCounts.valid ? ' yours' : '');

    $('warSub').textContent = (warSubInfo.text || '每月用量與費用') + (running ? ' · ' + running + ' 個執行中' : '');

  }
}

$('newBtn').addEventListener('click', drawNew);

// Come back to where the address says you were (set by setPlace as you move around).

const startAt = (() => { try { return decodeURIComponent(location.hash.slice(1)); } catch (e) { return ''; } })();
// A browser that was never given the key (or whose stored site data was cleared) can do nothing: every request is

function noKey() {

// The page an address names (#war, #settings, a conversation's id ...): on opening, and on the browser's back / forward.
function goPlace(at) {
  if (at === 'war') drawWar();
  else if (at === 'settings') drawSettings();
  else if (at === 'inbox') drawInbox();
  else if (at === 'past') drawPastPage();
  else if (at === 'office') drawOffice();
  else if (at === 'sched') drawSched();
  else if (at === 'collab') drawCollab();

  else if (at === 'notices') { redrawLists(); drawNotices(); }
  else if (at === 'new') drawNew();
  else if (at && sessions.some((s) => s.sessionId === at)) openChat(at);
  else if (at === '' && view !== 'home') drawHome();
  else redrawLists();

(TOKEN ? poll() : noKey()).then(() => { goPlace(startAt); placeQuiet = false; });
// Every 3 seconds while the tab is showing, every 15 while it is not: the count

let beats = 0;
const warSubInfo = { at: 0, text: '' };
setInterval(() => { beats++; if (!document.hidden || beats % 5 === 0) poll(); }, 3000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
