<title>Session 看板</title>

<style>
  /* The hidden attribute always hides: a class that sets display (grid, flex) otherwise wins over it, and an entry meant to be gone stays on the page (the inbox's, with the inbox off: seen 2026-11-15). */
  [hidden] { display: none !important; }
  :root {
    --r-s: 4px; --r-m: 8px; --r-l: 12px;   /* corner radii: small (chips, code), medium (buttons, cards), large (panels, rooms) */
    --bg: #FFFFFF; --side: #F7F7F5; --ink: #37352F; --dim: #676664; --faint: #73716B;
    --sb: #C4C4C0; --sb-hover: #9B9A97;
    --line: #E9E9E7; --hover: #EFEFED; --active: #E8E7E3; --bubble: #F1F1EF; --code: #F7F6F3;
    --accent: #1F72C5; --accent-ink: #FFFFFF; --amber: #AA5A0A; --amber-soft: #FBF3DB;
    --green: #0F7B6C; --red: #C63737; --red-soft: #FDEBEC;
    /* state dots: brighter than the text colours, so a glance down the list finds them (non-text contrast >= 3:1 on white) */
    --dot-run: #16A34A; --dot-wait: #EA580C; --dot-stuck: #DC2626; --dot-idle: #A8A6A1;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei UI", "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
    --mono: "Cascadia Mono", "Cascadia Code", Consolas, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191919; --side: #202020; --ink: #E3E2E0; --dim: #9D9C99; --faint: #898984;
      --sb: #4A4A4A; --sb-hover: #6B6B6B;
      --line: #2F2F2F; --hover: #2A2A2A; --active: #333333; --bubble: #2A2A2A; --code: #252525;
      --accent: #529CCA; --accent-ink: #10202B; --amber: #FFA344; --amber-soft: #3A2E1A;
      --green: #4DAB9A; --red: #FF7369; --red-soft: #3B2423;
      --dot-run: #4ADE80; --dot-wait: #FB923C; --dot-stuck: #F87171; --dot-idle: #6B6A66;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  /* text size: everything is scaled together (--z, set from the settings page and kept in this browser) */
  html { zoom: var(--z, 1); }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.55; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, textarea:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .app { display: grid; grid-template-columns: var(--side-w, 324px) minmax(0, 1fr); height: calc(100vh / var(--zv, var(--z, 1))); height: calc(100dvh / var(--zv, var(--z, 1))); }
  /* a touch screen: as tall as what is visible (with the keyboard up, the part above it; measured in fitViewport) */
  @media (pointer: coarse) { .app { height: var(--app-h, calc(100dvh / var(--zv, var(--z, 1)))); } }

  /* ── sidebar ── */
  .side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; position: relative; }
  /* the left column's edge: dragged to make it wider or narrower (kept in the settings), a double click puts it back */
  .side-edge { position: absolute; top: 0; right: -4px; width: 8px; height: 100%; cursor: col-resize; z-index: 6; touch-action: none; }
  .side-edge::after { content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 2px; background: transparent; transition: background .12s; }
  .side-edge:hover::after, .side-edge.on::after, .side-edge:focus-visible::after { background: var(--accent); }
  .side-edge:focus-visible { outline: none; }
  body.side-dragging, body.side-dragging * { cursor: col-resize !important; user-select: none !important; }
  .app.folded .side-edge { display: none; }
  @media (max-width: 720px) { .fold-btn { display: none; } }   /* a phone: the list is the whole page, there is no column to fold */
  .side-top { padding: 14px 12px 10px; display: flex; align-items: center; gap: 8px; }
  /* the left column folded away: a thin rail with the way back and what waits for you */
  .side-rail { display: none; flex-direction: column; align-items: center; gap: 10px; padding: 14px 0; }
  @media (min-width: 721px) {   /* not on a phone: folded there (on the computer) would leave it no list */
    .app.folded { grid-template-columns: 48px minmax(0, 1fr); }
    .app.folded:not(.fly) .side > :not(.side-rail) { display: none; }
    .app.folded .side-rail { display: flex; }
    /* the pointer resting on the folded rail: the whole column floats out beside it, over the page, until the pointer leaves */
    .app.folded.fly { position: relative; }
    .app.folded.fly > .main { grid-column: 2; }
    .app.folded.fly .side { position: absolute; left: 0; top: 0; bottom: 0; z-index: 40; width: calc(48px + var(--side-w, 324px)); padding-left: 48px; box-sizing: border-box; box-shadow: 6px 0 24px rgba(0, 0, 0, .16); }
    .app.folded.fly .side-rail { position: absolute; left: 0; top: 0; bottom: 0; width: 48px; border-right: 1px solid var(--line); }
    .app.folded.fly .side-edge, .app.folded.fly #foldBtn { display: none; }
  }
  .side-rail .btn { width: 36px; height: 36px; padding: 0; justify-content: center; }
  /* folded: a new chat, and only the sessions you have to act on (waiting for you, maybe stuck) - the rest floats out on hover */
  .side-rail { height: 100%; box-sizing: border-box; }
  .side-rail .rail-list { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; padding: 6px 0 8px; border-top: 1px solid var(--line); }
  .side-rail .rail-list:empty { border-top: 0; }
  .side-rail .rail-list::-webkit-scrollbar { display: none; }
  .rail-t { position: relative; flex: none; width: 34px; height: 34px; padding: 0; border: 0; border-radius: var(--r-m); background: none; color: inherit; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .rail-t:hover .face { filter: brightness(1.08); }
  .rail-t.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent); }
  .side-rail .rail-new { width: 36px; height: 36px; padding: 0; justify-content: center; }
  .fold-btn { border: 0; background: none; color: var(--dim); cursor: pointer; padding: 2px 8px 6px; border-radius: var(--r-s); font-size: 24px; line-height: 1; min-width: 34px; min-height: 34px; }
  .fold-btn:hover { background: var(--hover); color: inherit; }
  #unfoldBtn { font-size: 22px; line-height: 1; padding: 4px 10px 8px; min-width: 38px; }
  /* renaming in place */
  .rename-in { font: inherit; width: 100%; box-sizing: border-box; border: 1px solid var(--accent, #2563EB); border-radius: var(--r-s); padding: 2px 6px; background: var(--bg); color: inherit; }
  /* the office: starred rooms first, rooms dragged into your own order */
  .of-sec { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; color: var(--dim); margin: 6px 0 -4px; }
  .of-sec button { border: 0; background: none; color: var(--accent, #2563EB); cursor: pointer; font: inherit; font-weight: 500; padding: 0; min-height: 24px; }
  .room-head .star { border: 0; background: none; cursor: pointer; font-size: 16px; line-height: 1; color: var(--faint); padding: 0 2px; min-width: 24px; min-height: 24px; display: inline-flex; align-items: center; justify-content: center; }
  .room-head .star.on { color: var(--amber); }   /* was #D97706: 2.75 to 1 on the light looks' grounds, under the 3 an icon needs */
  .room-head button { min-height: 24px; }
  .room[draggable="true"] .room-head { cursor: grab; }
  .room.dragging { opacity: .45; }
  .room.drop-before { box-shadow: -4px 0 0 0 var(--accent, #2563EB); }
  .room.drop-after { box-shadow: 4px 0 0 0 var(--accent, #2563EB); }
  /* the bell, and the list it opens */
  .bell { position: relative; border: 0; background: none; color: var(--dim); width: 32px; height: 32px; border-radius: var(--r-m); display: grid; place-items: center; padding: 0; flex: none; }
  .bell:hover, .bell[aria-expanded="true"] { background: var(--hover); color: var(--ink); }
  .bell.has { color: var(--amber); }
  .bell .badge { position: absolute; top: 1px; right: 0; min-width: 16px; height: 16px; padding: 0 4px; border-radius: var(--r-m); background: var(--amber); color: #fff; font-size: 12px; font-weight: 700; line-height: 16px; text-align: center; font-variant-numeric: tabular-nums; }
  .bell-pop .bp-head b { font-size: 15px; }
  .bell-pop { position: fixed; z-index: 60; width: min(380px, calc((100vw - 24px) / var(--zv, var(--z, 1)))); max-height: min(560px, calc((100vh - 80px) / var(--zv, var(--z, 1)))); overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-m); box-shadow: 0 12px 36px rgba(0, 0, 0, .18); padding: 6px 0 8px; }
  .bell-pop .bp-head { display: flex; align-items: baseline; gap: 8px; padding: 8px 14px 6px; } .bell-pop .bp-head span { color: var(--dim); font-size: 13px; }
  .bell-pop h3 { font-size: 13px; color: var(--dim); font-weight: 600; margin: 10px 14px 4px; }
  .bell-pop .hint { padding: 4px 14px 8px; }
  .bell-pop .bn { display: flex; align-items: flex-start; border-top: 1px solid var(--line); }
  .bell-pop .bn:hover { background: var(--hover); }
  .bell-pop .bn-main { flex: 1 1 auto; min-width: 0; display: flex; gap: 8px; align-items: flex-start; text-align: left; border: 0; background: none; padding: 10px 4px 10px 14px; font: inherit; color: inherit; }
  .bell-pop .bn-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; background: var(--faint); }
  .bell-pop .bn-dot.done { background: var(--green); } .bell-pop .bn-dot.waiting, .bell-pop .bn-dot.limit, .bell-pop .bn-dot.budget, .bell-pop .bn-dot.schedule { background: var(--amber); } .bell-pop .bn-dot.stuck, .bell-pop .bn-dot.error { background: var(--red); }
  .bell-pop .bn-body { min-width: 0; display: grid; gap: 1px; }
  .bell-pop .bn-t { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bell-pop .bn-m { font-size: 13px; color: var(--dim); }
  .bell-pop .bn-k.done { color: var(--green); } .bell-pop .bn-k.waiting, .bell-pop .bn-k.limit, .bell-pop .bn-k.budget, .bell-pop .bn-k.schedule { color: var(--amber); } .bell-pop .bn-k.stuck, .bell-pop .bn-k.error { color: var(--red); }
  .bell-pop .bn-x { font-size: 13px; color: var(--dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; margin-top: 2px; }
  .bell-pop .bn-off { flex: none; border: 0; background: none; color: var(--faint); width: 30px; height: 30px; margin: 6px 6px 0 0; border-radius: var(--r-m); font-size: 14px; }
  .bell-pop .bn-off:hover { background: var(--line); color: var(--ink); }
  .bell-pop .bn.closed .bn-t { font-weight: 400; color: var(--dim); } .bell-pop .bn.closed .bn-dot { background: var(--line); } .bell-pop .bn.closed .bn-k { color: inherit; }
  .bell-pop .bn-empty { padding: 26px 14px 22px; text-align: center; color: var(--dim); font-size: 14px; }
  .bell-pop .bn-all { border: 0; background: none; color: var(--accent); font-size: 13px; padding: 2px 4px; border-radius: var(--r-s); } .bell-pop .bn-all:hover { background: var(--hover); }
  .bell-pop .bp-head span { margin-left: auto; }
  .bell-pop details > summary { cursor: pointer; font-size: 13px; color: var(--dim); padding: 8px 14px 4px; list-style: none; } .bell-pop details > summary::-webkit-details-marker { display: none; }
  .bell-pop details > summary::before { content: "\25B8  "; } .bell-pop details[open] > summary::before { content: "\25BE  "; }
  .bell-pop .list-more { margin: 6px 14px 0; width: calc(100% - 28px); }   /* 100% and the side margins: wider than the box, which then slid sideways */
  .side-top h1 { margin: 0; font-size: 15px; font-weight: 600; flex: 1; padding-left: 6px; }
  .btn { border: 1px solid var(--line); background: var(--bg); border-radius: var(--r-m); padding: 5px 10px; font-size: 14px; white-space: nowrap; }
  .btn:hover { background: var(--hover); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.06); background: var(--accent); }
  .btn.danger { color: var(--red); }
  .btn:disabled { opacity: .45; cursor: default; }
  .list { flex: 1; overflow-y: auto; padding: 0 6px 16px; min-height: 0; }
  .group { margin-top: 12px; }
  .group-head { display: flex; align-items: center; padding: 2px 4px 2px 8px; color: var(--dim); font-size: 13px; font-weight: 600; }
  .group-head span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .group-head button { border: 0; background: none; color: var(--dim); border-radius: var(--r-s); width: 22px; height: 22px; line-height: 1; font-size: 16px; }
  .group-head button:hover { background: var(--hover); color: var(--ink); }
  button.item { display: grid; grid-template-columns: 14px minmax(0, 1fr); column-gap: 6px; width: 100%; text-align: left; border: 0; background: none; border-radius: var(--r-m); padding: 6px 8px; }
  button.item:hover { background: var(--hover); }
  button.item.active { background: var(--active); }
  .dot { width: 11px; height: 11px; border-radius: 50%; margin-top: 6px; background: var(--dot-idle); flex: none; }
  /* waiting for you: a halo around it, so it is the first thing seen */
  .dot.yours { background: var(--dot-wait); box-shadow: 0 0 0 3px color-mix(in srgb, var(--dot-wait) 28%, transparent); }
  /* working, but nothing has happened for ten minutes (the same test as the office page's red desk) */
  .item.stuck .dot { background: var(--dot-stuck); animation: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--dot-stuck) 28%, transparent); } .item.stuck .m { color: var(--red); }
  .dot.done { background: var(--dot-run); }
  /* working: a ring that keeps spreading out from it (the dot itself stays full, never fades) */
  .dot.running { background: var(--dot-run); position: relative; }
  /* only the ring moves (a dot that grows and shrinks looked bad): a copy of the dot behind it that grows to 9px around it
     and fades. Moved by transform and opacity, which the screen's compositor does alone: the ring was a box-shadow that
     grew, and every running dot was painted again 60 times a second (2026-11-19: the office page, with its running
     desks, kept the browser busy about a fifth of the time) */
  .dot.running::after, .desk.run .face i::after, .rail-t.run .face i::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: inherit; opacity: 0; pointer-events: none; animation: beat 1.6s ease-out infinite; }
  @keyframes beat { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(2.64); opacity: 0; } }
  /* no movement asked for: the running dot still differs from an idle one, by a slow fade instead */
  @media (prefers-reduced-motion: reduce) { .dot.running::after { animation: none; } .dot.running { animation: fade 2.4s ease-in-out infinite; } @keyframes fade { 50% { opacity: .45; } } }
  .item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item.yours .t { font-weight: 600; }
  .item .m .fold { font-weight: 600; color: var(--ink); opacity: .75; }
  .group.flat { margin-top: 6px; }
  .item .m { grid-column: 2; font-size: 13px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item.yours .m { color: var(--amber); }
  /* Third line: the latest thing you said there, to tell apart sessions of one project. */
  /* "Kept": comes back after a restart. A tick on the row itself, on the right; pressing it does not open the session. */
  button.item { grid-template-columns: 14px minmax(0, 1fr) auto; }
  .item .pin { grid-column: 3; grid-row: 1; align-self: center; width: 15px; height: 15px; border: 1.5px solid var(--faint); border-radius: var(--r-s); display: grid; place-items: center; font-size: 12px; line-height: 1; color: transparent; cursor: pointer; }
  .item .pin.on { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
  .item .pin:hover { border-color: var(--accent); }
  .item .pin:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }   /* as plain to see as the focus ring everywhere else */
  .item .said { grid-column: 2; font-size: 13px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item.hid { opacity: .55; }
  .side-top h1 button { border: 0; background: none; padding: 0; font: inherit; color: inherit; cursor: pointer; }
  .side-top h1 button:hover { text-decoration: underline; }
  /* inbox */
  /* The sources, as a carousel: every card the same size, three in a row (one on a narrow window). When they all fit there is nothing to move, and the arrows and dots are not shown. */
  .car.fits { grid-template-columns: minmax(0, 1fr); } .car.fits .arrow { display: none; }
  .car { display: grid; grid-template-columns: 28px minmax(0, 1fr) 28px; gap: 8px; align-items: center; margin: 4px 0 4px; }
  .car .arrow { width: 28px; height: 28px; border: 1px solid var(--line); border-radius: 50%; background: var(--bg); color: var(--dim); font-size: 16px; line-height: 1; padding: 0; }
  .car .arrow:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
  .car .arrow:disabled { opacity: .3; cursor: default; }
  .srcs { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 2px; scrollbar-width: none; padding: 2px; }
  .srcs::-webkit-scrollbar { display: none; }
  /* Always-visible scrollbars: a Mac hides them until you scroll (System Settings, "Show scroll bars: automatically"), so a
     list that goes on looked complete. A styled scrollbar is drawn all the time in Chrome, Edge and Safari on every system.
     (No scrollbar-width / scrollbar-color anywhere it should show: in Chrome either one turns this styling off.) */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--sb); border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; min-height: 32px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--sb-hover); border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-corner { background: transparent; }
  .src { flex: 0 0 calc((100% - 20px) / 3); box-sizing: border-box; height: 124px; scroll-snap-align: start; border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px 14px; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .src b { display: block; font-size: 15px; font-weight: 600; }
  .src span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--dim); font-size: 13px; line-height: 1.5; margin-top: 2px; overflow-wrap: anywhere; }
  .src.off b { color: var(--dim); } .src.alarm span { color: var(--red); }
  .src .btn { margin-top: auto; align-self: flex-start; font-size: 13px; padding: 4px 10px; }
  /* A source card is also the filter for the list under it: press it to list only that source, again to list all. */
  button.src { background: var(--bg); color: inherit; font: inherit; text-align: left; cursor: pointer; }
  button.src:hover { background: var(--hover); }
  button.src.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  button.src.sel b::after { content: "　只看這個"; color: var(--accent); font-weight: 400; font-size: 13px; }
  /* The three pages of the inbox. */
  .ptabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 0 0 16px; }
  .ptabs button { border: 0; background: none; padding: 8px 14px; font-size: 15px; color: var(--dim); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .ptabs button:hover { color: var(--ink); }
  .ptabs button.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }
  .ptabs small { color: var(--dim); font-weight: 400; margin-left: 4px; }
  .dots { display: flex; justify-content: center; gap: 8px; margin: 2px 0 12px; }
  /* the page dots: a 7px dot drawn inside a 24px button (the dot itself was all there was to press, 8 x 8) */
  .dots { gap: 0; }
  .dots button { width: 24px; height: 24px; padding: 0; border: 0; background: none; position: relative; border-radius: 0; }
  .dots button::after { content: ""; position: absolute; inset: 8.5px; border-radius: 50%; background: var(--line); }
  .dots button.on::after { background: var(--accent); }
  /* a touch screen: everything pressed at least 44 px tall (Apple's 44 pt; measured 2026-11-20 at 25 to 38 px) */
  @media (pointer: coarse) {
    .room-head .star, .room-head button { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; }

  /* a form answered: the choices taken stand out, the rest step back */
  .card.ask .opt.chosen b { color: var(--ink); } .card.ask .opt.chosen .ob { color: var(--green); font-weight: 700; }
  .card.ask .opt.not-chosen { opacity: .45; }
  .card.ask .own-ans { margin-top: 4px; padding: 4px 8px; border-left: 3px solid var(--green); font-size: 14px; overflow-wrap: anywhere; }
  .card.ask .own-ans span { color: var(--dim); }
  .answered { margin: 0 0 14px; padding: 8px 12px; border-left: 3px solid var(--line); font-size: 14px; overflow-wrap: anywhere; }
  .answered .ah { font-size: 13px; color: var(--dim); margin-bottom: 2px; }
  .answered .ar { display: grid; grid-template-columns: minmax(0, 1fr); gap: 1px; padding: 3px 0; }
  .answered .aq2 { color: var(--dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .answered b { font-weight: 600; color: var(--ink); }
  .more { text-align: center; color: var(--dim); font-size: 13px; margin-bottom: 16px; }
  .more .btn { font-size: 13px; }
  .typing { color: var(--dim); font-size: 14px; margin: 0 0 14px; }

  .foot { border-top: 1px solid var(--line); padding: 12px 20px 16px; }
  .foot .col { padding: 0; }
  .imgstrip { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }
  .imgstrip .thumb { position: relative; display: inline-block; } .imgstrip img { height: 64px; max-width: 140px; border-radius: var(--r-m); border: 1px solid var(--line); display: block; object-fit: cover; }
  .imgstrip button { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1; padding: 0; }
  .imgstrip .thumb .tag { position: absolute; left: 3px; bottom: 3px; font-size: 12px; line-height: 1; padding: 2px 5px; border-radius: var(--r-s); background: rgba(0, 0, 0, .65); color: #fff; }
  /* a file waiting to go: a card the height of a picture's, its kind, its name and its number (［檔N］) */
  .imgstrip .thumb.file { height: 64px; width: 150px; box-sizing: border-box; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--side); display: inline-flex; flex-direction: column; justify-content: center; gap: 2px; padding: 6px 10px 18px; }
  .thumb.file .fk { font-size: 11px; font-weight: 700; color: var(--dim); letter-spacing: .04em; } .thumb.file .fn { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* in your sent message: the files it carried, as cards that open the file */
  .fchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .fchip { display: inline-flex; align-items: center; gap: 6px; max-width: 260px; padding: 4px 10px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--bg); color: inherit; font: inherit; font-size: 13px; cursor: pointer; }
  .fchip .fk { font-size: 11px; font-weight: 700; color: var(--dim); } .fchip .fn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .composer.drop { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
  /* the box you type in, as in the chat apps (every screen): a round + on its left (pictures), round icons on its right -
     send (an arrow), and stop (a square) only while it is working. No words on them: the names are in their labels. */
  .composer .imgbtn, .composer .sendbtn, .composer .stopbtn, .composer .micbtn { width: 36px; height: 36px; min-height: 0; padding: 0; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .composer .imgbtn { order: -1; border-color: transparent; background: var(--hover); color: var(--ink); }
  .composer .imgbtn:hover, .composer .imgbtn[aria-expanded="true"] { background: var(--active); }
  .composer .btn .lbl { display: none; }
  .composer .btn .ico { display: block; width: 18px; height: 18px; margin: 0; }   /* no gap for words after it (svg.ico has one): it sat 2.4px left of the middle */
  .composer .stopbtn { color: var(--red); }
  /* the mic: plain when idle, red and pulsing while it listens, faint while what was heard is tidied */
  .composer .micbtn { border-color: transparent; background: none; color: var(--dim); }
  .composer .micbtn:hover { background: var(--hover); color: var(--ink); }
  .composer .micbtn.on { background: var(--red); color: #fff; animation: micpulse 1.4s ease-in-out infinite; }
  .composer .micbtn.wait { color: var(--accent); opacity: .7; }
  @keyframes micpulse { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--red) 45%, transparent); } 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--red) 0%, transparent); } }
  @media (prefers-reduced-motion: reduce) { .composer .micbtn.on { animation: none; } }
  .composer textarea.voice-lock { color: inherit; opacity: .75; cursor: not-allowed; }
  .voice-st { font-size: 13px; color: var(--dim); padding: 0 4px 4px; }
  .composer .stopbtn:hover { background: var(--hover); }
  /* what + opens: above the box, one row per way to add something */
  .addmenu { position: absolute; left: 0; bottom: calc(100% + 6px); z-index: 4; min-width: 260px; max-width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-l); box-shadow: 0 8px 24px rgba(0, 0, 0, .16); padding: 6px; }
  .addmenu button { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; border-radius: var(--r-m); padding: 9px 10px; text-align: left; }
  .addmenu button:hover, .addmenu button:focus-visible { background: var(--hover); }
  .addmenu svg { width: 20px; height: 20px; flex: none; color: var(--dim); }
  .addmenu .am-t { font-weight: 500; } .addmenu .am-s { color: var(--dim); font-size: 13px; }
  .addmenu .am-tip { color: var(--faint); font-size: 13px; padding: 6px 10px 4px; border-top: 1px solid var(--line); margin-top: 4px; }
  .msg .midnote { font-size: 12px; color: var(--faint); text-align: right; margin-top: 3px; }
  .msg .pics { font-size: 13px; color: var(--dim); margin: 0 0 6px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
  .msg .pics img { height: 120px; max-width: 260px; object-fit: cover; border-radius: var(--r-m); border: 1px solid var(--line); cursor: zoom-in; background: var(--bubble); display: block; }
  .msg .pics img.big { height: auto; max-height: calc(80vh / var(--zv, var(--z, 1))); max-width: 100%; object-fit: contain; cursor: zoom-out; }
  .msg .pics img.loading { width: 120px; opacity: .5; }
  .composer { display: flex; gap: 8px; align-items: flex-end; border: 1px solid var(--line); border-radius: var(--r-m); padding: 8px 8px 8px 12px; background: var(--bg); }
  .composer:focus-within { border-color: var(--accent); }
  /* What is being quoted (a mail, picked chat messages): above the box while you write, inside your bubble once sent -
     the way a reply shows the message it answers in Teams or Messenger. Your own words are never mixed with it. */
  .reply { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; padding: 7px 8px 7px 12px; border-left: 3px solid var(--accent); border-radius: var(--r-m); background: color-mix(in srgb, var(--accent) 9%, var(--bg)); font-size: 14px; }
  .reply .rmain { flex: 1; min-width: 0; }
  .reply .rh { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reply .rs, .reply .rt { color: var(--dim); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reply .rmain { cursor: pointer; border-radius: var(--r-s); }
  .reply .rh { display: flex; gap: 8px; }
  .reply .rh b { overflow: hidden; text-overflow: ellipsis; }
  .reply .rh span { margin-left: auto; font-weight: 400; font-size: 13px; color: var(--dim); white-space: nowrap; }
  .reply.open .rt { white-space: pre-wrap; overflow: auto; max-height: calc(40vh / var(--zv, var(--z, 1))); color: inherit; font-size: 14px; margin-top: 4px; cursor: text; }
  .reply button { border: 0; background: none; color: var(--dim); border-radius: var(--r-s); padding: 0 6px; font-size: 16px; line-height: 20px; flex: none; }
  .reply button:hover { background: var(--hover); color: var(--red); }
  .quoted { display: block; width: 100%; text-align: left; border: 0; border-left: 3px solid var(--accent); border-radius: var(--r-m); background: color-mix(in srgb, var(--accent) 10%, var(--bg)); padding: 6px 10px; margin: 0 0 6px; font: inherit; font-size: 14px; color: inherit; cursor: pointer; white-space: normal; }
  .quoted { cursor: pointer; } .quoted:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .quoted .rh { font-weight: 600; font-size: 13px; color: var(--dim); display: flex; gap: 8px; }
  .quoted .rh span { margin-left: auto; font-weight: 400; white-space: nowrap; }
  .quoted .rt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quoted.open .rt { white-space: pre-wrap; overflow: auto; max-height: calc(55vh / var(--zv, var(--z, 1))); cursor: text; }
  .msg.user .own { white-space: pre-wrap; }
  .composer textarea { flex: 1; border: 0; outline: 0; resize: none; background: none; color: inherit; font: inherit; max-height: 200px; min-height: 24px; padding: 6px 2px; }
  .composer { padding: 6px; gap: 6px; }
  .note { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--dim); font-size: 14px; }
  .note > span { flex: 1; min-width: 200px; }
  .hint { font-size: 13px; color: var(--faint); margin-top: 6px; }

  /* ── figures above a conversation ── */
  /* The bar that stays put above a scrolling conversation (title, then figures).
     It is tinted like the sidebar and casts a shadow, so the text scrolling
     under it does not read as part of it. */
  .top, .main > .head { background: var(--side); border-bottom: 1px solid var(--line); box-shadow: 0 3px 10px rgba(0, 0, 0, .08); position: relative; z-index: 2; }
  .top .head { border-bottom: 0; }
  .info { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 16px; align-items: start; padding: 7px 20px; border-top: 1px solid var(--line); font-size: 13px; color: var(--dim); }
  .info[hidden] { display: none; }
  .info .chips { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; min-height: 24px; }
  /* a figure that is a share of a limit: a bar that fills, the number after it */
  .info .chips .gauge { display: inline-flex; align-items: center; gap: 8px; }
  .info .chips .bar { display: inline-block; width: 72px; height: 6px; border-radius: var(--r-s); background: var(--line); overflow: hidden; flex: none; }
  .info .chips .bar i { display: block; height: 100%; border-radius: var(--r-s); background: var(--accent); }
  .info .chips .gauge.warn .bar i { background: var(--amber); } .info .chips .gauge.warn b { color: var(--amber); }
  .info .chips .gauge.full .bar i { background: var(--red); } .info .chips .gauge.full b { color: var(--red); }
  .info .chips .gauge small { color: var(--dim); font-size: inherit; }
  .info b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .info-more { border: 0; background: none; padding: 0 2px; color: var(--accent); font: inherit; white-space: nowrap; }
  .info-more:hover { text-decoration: underline; }
  .opens { cursor: pointer; border-radius: var(--r-s); }
  .opens:hover { background: var(--hover); }
  .opens:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .task-chip { cursor: inherit; }
  .info .more-rows { grid-column: 1 / -1; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; padding: 6px 0 2px; border-top: 1px dashed var(--line); margin-top: 4px; }
  .info .more-rows[hidden] { display: none; }
  .info .more-rows code { font-family: var(--mono); font-size: 13px; }
  .more.compact { display: flex; align-items: center; gap: 12px; margin: 22px 0; }
  .more.compact::before, .more.compact::after { content: ""; flex: 1; border-top: 1px dashed var(--line); }

  /* What a conversation has running besides its reply (subagents, background commands). */
  /* A background command in the strip can be pressed to see what it has printed. */
  button.tk { width: 100%; border: 0; background: none; text-align: left; font: inherit; color: inherit; border-radius: var(--r-s); cursor: pointer; }
  button.tk:hover { background: var(--hover); }
  .tk.fin { opacity: .7; }
  .tk .tk-open { color: var(--dim); font-size: 13px; white-space: nowrap; }
  .peek-body .tcmd { font-family: var(--mono); font-size: 13px; background: var(--side); border: 1px solid var(--line); border-radius: var(--r-m); padding: 8px 10px; margin: 0 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .peek-body .tstat { color: var(--dim); font-size: 13px; margin: 0 0 8px; }
  /* Messages waiting for their turn, above the input box. */
  .tasks { border-top: 1px solid var(--line); background: var(--side); padding: 6px 20px; font-size: 14px; max-height: calc(26vh / var(--zv, var(--z, 1))); overflow-y: auto; position: relative; }
  .task-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--bg); color: inherit; font: inherit; cursor: pointer; padding: 2px 10px; border-radius: 999px; }
  .task-chip:hover { background: var(--hover); }
  .task-chip .dot { margin-top: 0; }
  .task-rows { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .tasks[hidden] { display: none; }
  .tk { display: flex; align-items: center; gap: 8px; padding: 2px 0; min-width: 0; }
  .tk .dot { margin-top: 0; flex: none; }
  .tk-l { font-weight: 600; white-space: nowrap; }
  .tk-d { flex: 1; min-width: 0; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tk-e { color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .meter { display: grid; grid-template-columns: 56px minmax(80px, 320px) 48px auto; align-items: center; gap: 12px; padding: 4px 8px; font-size: 14px; }
  .meter .ml, .meter .mr { color: var(--dim); }
  .meter b { text-align: right; font-variant-numeric: tabular-nums; }
  .mbar { height: 8px; border-radius: var(--r-s); background: var(--hover); overflow: hidden; }
  .mfill { height: 100%; background: var(--green); border-radius: var(--r-s); }
  .mfill.warm { background: var(--amber); } .mfill.hot { background: var(--red); }

  /* ── war room: the month ── */
  .mbudget { margin: 2px 8px 12px; font-size: 14px; color: var(--dim); } .mbudget .bl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .mbudget b.warn { color: var(--amber); } .mbudget b.over { color: var(--red); }
  .mbudget .bbar { flex: 1 1 140px; max-width: 260px; height: 6px; border-radius: var(--r-s); background: var(--line); overflow: hidden; } .mbudget .bbar i { display: block; height: 100%; background: var(--green); }
  .mbudget .bbar.warn i { background: var(--amber); } .mbudget .bbar.over i { background: var(--red); }
  .mbudget .bform { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; } .mbudget .bform input { width: 90px; font: inherit; padding: 3px 6px; }
  .mhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 2px 8px 6px; }
  .mhead .mname { font-size: 16px; min-width: 104px; text-align: center; }
  .mhead .mnote { flex: 1; min-width: 160px; text-align: right; color: var(--dim); font-size: 13px; }
  .mparts { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 2px 8px 12px; font-size: 14px; color: var(--dim); }
  .mparts b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
  .mcap { font-size: 13px; color: var(--dim); padding: 0 8px 6px; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 132px; padding: 0 8px; border-bottom: 1px solid var(--line); }
  .bcol { flex: 1; height: 100%; display: flex; align-items: flex-end; min-width: 0; }
  .bcol:hover .b { filter: brightness(1.15); }
  .bars .b { width: 100%; background: var(--accent); border-radius: 2px 2px 0 0; }
  .bars .b.today { background: var(--amber); }
  .bars .b.zero { background: var(--line); border-radius: 0; }
  .axis { display: flex; gap: 4px; padding: 3px 8px 0; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .axis span { flex: 1; text-align: center; min-width: 0; }
  .axis .today { color: var(--amber); font-weight: 600; }
  .mgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
  .mtable { margin-top: 18px; }
  .mtable h4 { font-size: 13px; color: var(--dim); font-weight: 600; margin: 0 0 4px; padding: 0 8px; }
  .trow { display: grid; grid-template-columns: minmax(0, 1fr) 96px 48px 84px; gap: 8px; align-items: baseline; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 5px 8px; font-size: 14px; }
  button.trow:hover { background: var(--hover); }
  .trow.cols { font-size: 13px; color: var(--dim); }
  .trow .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trow .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* The session table has three more columns (compactions, context, messages). */
  .mtable.wide .trow { grid-template-columns: minmax(0, 1fr) 92px 44px 88px 60px 64px 52px; }
  /* Per model: what it cost beside how much it was used and at what rate, to tell "dear but little used" from "dear and much used". */
  .mtable.models .trow { grid-template-columns: minmax(110px, 1fr) 92px 50px 70px 50px 70px 70px 78px 78px 84px; }
  .mtable.models { margin-bottom: 8px; }
  .mtable.roles .trow { grid-template-columns: minmax(120px, 1fr) 92px 50px 56px 84px minmax(120px, 200px) 78px; }
  @media (max-width: 900px) { .mtable.roles .trow { grid-template-columns: minmax(0, 1fr) 88px 44px 64px; } .mtable.roles .trow > :nth-child(n+5) { display: none; } }
  .rolerow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 8px; font-size: 14px; color: var(--dim); }
  .rolerow select { max-width: 100%; font: inherit; }
  .who .s.mode { color: var(--faint); } .who .s.mode.loose { color: var(--amber); }
  @media (max-width: 520px) { .mtable.models .trow { grid-template-columns: minmax(0, 1fr) 84px 56px; } .mtable.models .trow > :nth-child(n+4) { display: none; } }
  .mexplain { color: var(--faint); font-size: 13px; margin: 4px 8px 14px; }
  @media (max-width: 1100px) { .mtable.models .trow { grid-template-columns: minmax(80px, 1fr) 86px 62px 64px 62px 100px; } .mtable.models .trow > :nth-child(n+6):not(:nth-child(10)) { display: none; } }
  .trow .t .dot { display: inline-block; margin: 0 8px 1px 0; vertical-align: middle; }
  @media (max-width: 900px) { .mgrid { grid-template-columns: minmax(0, 1fr); } .mtable.wide .trow { grid-template-columns: minmax(0, 1fr) 88px 40px 64px; } .mtable.wide .trow .n:nth-child(n+4):not(:nth-child(6)) { display: none; } }
  @media (max-width: 560px) { .trow { grid-template-columns: minmax(0, 1fr) 84px 40px; } .trow .n:last-child { display: none; } }

  /* ── war room ── */
  .war { max-width: 1040px; margin: 0 auto; padding: 4px 20px 48px; }
  .war h3 { font-size: 13px; color: var(--dim); font-weight: 600; margin: 24px 0 6px; }
  .war .quiet { color: var(--dim); font-size: 14px; padding: 8px 0; }
  .war .liverow, .war button.turn { padding-left: 8px; padding-right: 8px; }
  .urow { display: grid; grid-template-columns: minmax(0, 1fr) 76px 76px 60px 60px 76px; gap: 12px; align-items: center; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 7px 8px; font-size: 14px; }
  button.urow:hover { background: var(--hover); }
  .urow.cols { font-size: 13px; color: var(--dim); }
  .urow .ut { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .urow .ut .dot { margin-top: 0; flex: none; }
  .urow .ut span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .urow .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  @media (max-width: 720px) { .urow { grid-template-columns: minmax(0, 1fr) 64px 52px 64px; } .urow .opt { display: none; } }
  .side-nav { padding: 0 6px 4px; border-bottom: 1px solid var(--line); }
  .pulse { display: flex; align-items: flex-end; gap: 32px; padding: 16px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .kpi .n { font-size: 26px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 13px; color: var(--dim); }
  .kpi.main .n { color: var(--green); } .kpi.main.zero .n { color: var(--ink); }
  .kpi.warn .n { color: var(--amber); }
  .kpi .names { font-size: 13px; color: var(--dim); max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .liverow { display: flex; align-items: center; gap: 8px; padding: 8px 20px; border-bottom: 1px solid var(--line); min-width: 0; }
  .liverow.stuck { background: var(--red-soft); }
  .liverow .dot { margin-top: 0; flex: none; }
  .liverow.stuck .dot { background: var(--red); }
  .liverow .lt { font-weight: 600; flex: 0 1 auto; min-width: 60px; max-width: 34%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip { flex: none; font-size: 13px; padding: 1px 8px; border-radius: var(--r-m); background: var(--hover); white-space: nowrap; }
  .chip.bad { background: var(--red); color: #fff; }
  .liverow .ld { flex: 1; min-width: 0; font-family: var(--mono); font-size: 13px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .liverow .le { flex: none; font-size: 14px; font-variant-numeric: tabular-nums; }

  .cp-row input[type=checkbox] { width: 18px; height: 18px; margin: 3px; accent-color: var(--accent); }   /* 18 + 3 a side: a 24 px place to press (the browser's 13 px was all there was) */
  .cp-who { min-width: 0; display: flex; flex-direction: column; } .cp-who .t, .cp-who .m { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .cp-who .m { font-size: 12px; color: var(--dim); }
  .cp-opt { margin: 14px 0; } .cp-line { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; } .cp-line .btn { margin-left: auto; } .collab-new select { max-width: 100%; }
  .collab-item { display: block; width: 100%; text-align: left; background: none; border: 1px solid var(--line); border-radius: var(--r-m); padding: 10px 12px; margin: 6px 0; cursor: pointer; color: inherit; font: inherit; }
  .collab-item:hover { background: var(--hover); } .collab-item .m { font-size: 13px; color: var(--dim); margin-top: 2px; }
  .collab-members { display: flex; flex-direction: column; gap: 6px; }
  .cm-row { display: grid; grid-template-columns: 14px 120px minmax(0, 1fr) auto auto; gap: 10px; align-items: center; }
  .cm-role { font-weight: 600; } .cm-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .cm-st { font-size: 13px; color: var(--dim); }
  .banner.warn { border-color: var(--dot-wait, #d97706); }
  .cmd-line { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
  .collab-open { padding: 6px 10px; border-left: 3px solid var(--line); margin: 4px 0; }
  .collab-open.behind { border-left-color: var(--dot-stuck, #dc2626); color: var(--dot-stuck, #dc2626); }
  .collab-decide { border: 1px solid var(--line); border-radius: var(--r-m); padding: 10px; margin: 8px 0; } .collab-decide .q { font-weight: 600; margin-bottom: 6px; }
  .collab-msg { border-left: 3px solid var(--line); padding: 4px 10px; margin: 6px 0; } .collab-msg.in { border-left-color: var(--dot-run, #16a34a); }
  .collab-msg .cmh { font-size: 12px; color: var(--dim); } .collab-msg .cmt { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
  .collab-ledger { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--code); border-radius: var(--r-m); padding: 12px; font-size: 13px; max-height: calc(60vh / var(--zv, var(--z, 1))); overflow: auto; }
  @media (max-width: 700px) and (pointer: coarse) { html body .cp-row { grid-template-columns: 44px minmax(0, 1fr); } }
  @media (max-width: 700px) { .cp-row { grid-template-columns: 24px minmax(0, 1fr); } .cp-row input:not([type]) { grid-column: 2; } .cm-row { grid-template-columns: 14px minmax(0, 1fr); } }
  .of-sticky { position: sticky; top: -1px; z-index: 5; background: var(--bg); padding: 13px 0 6px; margin: -12px 0 4px; }
  .of-sticky.stuck { box-shadow: 0 6px 8px -8px rgba(0, 0, 0, .35); }

  .set-row { display: flex; align-items: center; gap: 8px; margin: 4px 0 12px 30px; font-size: 13px; color: var(--dim); }
  .nextbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 12px 0 4px; padding: 8px 12px; border: 1px dashed var(--line); border-radius: var(--r-m); }
  .nextbar .nb-l { color: var(--dim); font-size: 13px; margin-right: 4px; } .nextbar .btn { padding: 3px 12px; }
  .room-fact { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 4px 12px; font-size: 13px; color: var(--dim); border-top: 1px solid var(--line); }
  .room-fact b { color: var(--ink); font-weight: 600; } .room-fact.warn b { color: var(--amber); } .room-fact.bad b { color: var(--red); }
  .room-fact .btn { padding: 1px 8px; font-size: 12px; }
  /* line icons: as big as the text, in its colour, sitting on its baseline */
  svg.ico { width: 1.05em; height: 1.05em; flex: none; vertical-align: -0.17em; }
  svg.ico { margin-right: .3em; } [data-icon-only] > svg.ico, #peekClose > svg.ico { margin-right: 0; }   /* a gap before the words, none when the icon is alone */
  #peek iframe.htmlview { width: 100%; flex: 1; min-height: calc(75vh / var(--zv, var(--z, 1))); border: 1px solid var(--line); border-radius: var(--r-m); background: #fff; }
  /* a wide window: the preview stands beside the conversation instead of over it (the conversation narrows by its width) */
  @media (min-width: 1180px) { body:has(#peek:not([hidden])) .app { padding-right: var(--peek-w, 0px); } body:has(#peek:not([hidden])) #peek { box-shadow: none; width: max(320px, min(820px, calc(100vw / var(--zv, var(--z, 1)) - var(--side-w, 324px) - 520px))); } }
  /* The left edge is a handle: drag it to make the preview wider or narrower. */

  #peekGrip::after { content: ""; position: absolute; left: 4px; top: 0; bottom: 0; width: 2px; background: transparent; transition: background .12s; }
  #peekGrip:hover::after, #peekGrip:focus-visible::after, #peek.dragging #peekGrip::after { background: var(--accent); }
  #peekGrip:focus-visible { outline: none; }
  /* While dragging, the document inside must not swallow the mouse, and nothing should get selected. */
  #peek.dragging .peek-body { pointer-events: none; }
  body.resizing { user-select: none; cursor: ew-resize; }
  .peek-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .peek-head .who { flex: 1 1 220px; min-width: 0; }

  .peek-body { flex: 1; min-height: 0; overflow: auto; }

  .peek-body img { max-width: 100%; display: block; margin: 16px auto; }
  .peek-body pre { margin: 0; padding: 14px 16px; font-family: var(--mono); font-size: 13px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  .peek-body .msg { padding: 16px 20px; margin: 0; }

  .peek-body pre.code .cl { display: block; min-height: 1.5em; position: relative; padding-left: calc(var(--gutter, 3ch) + 26px); counter-increment: ln; }
  .peek-body pre.code .cl::before { content: counter(ln); position: absolute; left: 0; width: calc(var(--gutter, 3ch) + 12px); text-align: right; color: var(--faint); user-select: none; -webkit-user-select: none; }
  .peek-body pre.code .cl:hover { background: var(--hover); }

  /* the colours of VS Code's light and dark themes; comments grey */
  .hl-c { color: #8E8E8E; font-style: italic; } .hl-s { color: #A31515; } .hl-k { color: #0000FF; } .hl-n { color: #098658; } .hl-f { color: #795E26; } .hl-t { color: #267F99; } .hl-p { color: #0451A5; }
  @media (prefers-color-scheme: dark) { .hl-c { color: #7F848E; } .hl-s { color: #CE9178; } .hl-k { color: #569CD6; } .hl-n { color: #B5CEA8; } .hl-f { color: #DCDCAA; } .hl-t { color: #4EC9B0; } .hl-p { color: #9CDCFE; } }
  .peek-note { padding: 8px 16px; font-size: 13px; color: var(--dim); border-bottom: 1px solid var(--line); }
  /* what a session changed */
  .chg-top { padding: 12px 16px 8px; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; position: sticky; top: 0; background: var(--bg); z-index: 1; border-bottom: 1px solid var(--line); }
  .chg-top .sum { font-size: 14px; color: var(--dim); }
  .chg-note { padding: 8px 16px; font-size: 13px; color: var(--dim); }
  .chg-group { padding: 10px 16px 2px; font-size: 13px; font-weight: 600; color: var(--dim); }
  .chg-file { border-bottom: 1px solid var(--line); }

  .chg-row:hover { background: var(--hover); }

  .chg-row .p small { color: var(--dim); font-family: var(--sans); font-size: 13px; margin-left: 6px; }
  .chg-row .n { flex: none; font-variant-numeric: tabular-nums; font-size: 13px; white-space: nowrap; }
  .plus { color: var(--green); } .minus { color: var(--red); }
  .chg-body { padding: 0 0 8px; }
  .chg-when { padding: 6px 16px 2px; font-size: 13px; color: var(--dim); display: flex; gap: 8px; flex-wrap: wrap; }
  .peek-body pre.diff { padding: 0; margin: 0 0 6px; font-size: 13px; }
  pre.diff .dl { display: block; padding: 0 16px; min-height: 1.5em; white-space: pre-wrap; overflow-wrap: anywhere; }
  pre.diff .dl.add { background: rgba(15, 123, 108, .13); } pre.diff .dl.del { background: rgba(224, 62, 62, .13); }
  pre.diff .dl.hunk { color: var(--dim); background: var(--code); } pre.diff .dl.meta { color: var(--faint); }
  @media (max-width: 720px) { #peek { width: calc(100vw / var(--zv, var(--z, 1))); } }

  /* ── home / new ── */
  .pane { max-width: 640px; margin: 0 auto; padding: 48px 20px; }
  .pane h2 { font-size: 22px; font-weight: 700; margin: 0 0 6px; }
  .pane p.lead { color: var(--dim); margin: 0 0 24px; }
  .pane h3 { font-size: 13px; color: var(--dim); font-weight: 600; margin: 24px 0 6px; }
  /* a conversation that is not open, at the same table as the ones that are */
  .desk.off { background: var(--side); cursor: default; grid-template-columns: 34px minmax(0, 1fr) auto; }
  .desk.off:hover { background: var(--side); }
  .desk.off .face { background: none; color: var(--faint); border: 1.5px dashed var(--faint); }
  .desk.off .dt { color: var(--dim); }
  .desk.off .acts { display: flex; gap: 4px; }
  .desk.off .acts .btn { padding: 2px 8px; font-size: 13px; }
  .desk.off .acts .btn:last-child { border-color: transparent; background: none; color: var(--faint); padding: 2px 5px; } .desk.off .acts .btn:last-child:hover { color: var(--red); }
  /* a narrow screen: the buttons on a line of their own under the name - beside it they left the name 4 characters
     ("Wind…", measured 48 px of a 320 px row, 2026-11-20) */
  @media (max-width: 520px) { .desk.off { grid-template-columns: 34px minmax(0, 1fr); } .desk.off .acts { grid-column: 2; } }
  .room.quiet { background: none; } .room.quiet .room-head b { color: var(--dim); }
  .of-restore { border: 1px solid var(--amber); border-radius: var(--r-l); padding: 2px 16px 14px; margin-bottom: 18px; background: var(--amber-soft); }
  .of-restore h3 { color: var(--ink); }
  .choice { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 9px 6px; }
  .choice:hover { background: var(--hover); }
  .choice .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .choice .p { color: var(--dim); font-size: 13px; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 55%; }
  label.choice { cursor: pointer; }
  .choice input[type=checkbox] { width: 18px; height: 18px; margin: 3px; accent-color: var(--accent); flex: none; }   /* 18 + 3 a side: a 24 px place to press (was 15, with nothing around) */
  .choice .btn { flex: none; }
  .keepbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .collab-new select { min-width: 160px; }   /* no member chosen yet, it has no option: not a sliver */
  .switch { display: flex; align-items: flex-start; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  .switch input { width: 16px; height: 16px; margin: 3px 0 0; accent-color: var(--accent); flex: none; }
  .switch b { display: block; font-weight: 600; }
  .switch span { display: block; color: var(--dim); font-size: 14px; overflow-wrap: anywhere; }
  .pathrow { display: flex; gap: 8px; margin-top: 8px; }
  .pathrow input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: var(--r-m); padding: 6px 10px; background: var(--bg); color: inherit; font: inherit; font-family: var(--mono); font-size: 14px; }
  .bad { color: var(--red); font-size: 14px; margin-top: 8px; }

  /* A notice: at the top, over the conversation's heading - at the bottom it covered the box being typed in (2026-11-19).
     Clicks go through it to what is under it. */
  #said { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translate(-50%, calc(-100% - 40px)); opacity: 0; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: var(--r-m); padding: 8px 14px; font-size: 14px; max-width: min(calc(92vw / var(--zv, var(--z, 1))), 640px); transition: transform .15s ease-out, opacity .15s ease-out; z-index: 5; box-shadow: 0 4px 14px rgba(0, 0, 0, .18); }
  #said.on { transform: translate(-50%, 0); opacity: 1; }
  /* the board not answering: a band over the top of every page, on a phone too */
  #downBar { position: fixed; left: 0; right: 0; top: 0; z-index: 80; padding: 8px 14px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); background: var(--red); color: #fff; font-size: 14px; text-align: center; overflow-wrap: anywhere; }
  #said.bad { background: var(--red); color: #fff; }
  /* a new version, where the line at the bottom of the left column is not shown: a band over the top */
  #newBar { display: none; position: fixed; left: 0; right: 0; top: 0; z-index: 79; border: 0; padding: 8px 14px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); background: var(--accent, #2f5d8a); color: #fff; font: inherit; font-size: 14px; cursor: pointer; }
  @media (max-width: 720px) { #newBar { display: block; } }

  @media (max-width: 720px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .side-edge { display: none; }
    .app.viewing .side { display: none; }
    .app:not(.viewing) .main { display: none; }
    .head .back { display: inline-block; }
    /* a page's heading: back and the name on one row (they took a row each) */
    .head { min-height: 0; padding-top: 8px; padding-bottom: 8px; row-gap: 8px; }
    .head .who { flex: 1 1 0; }
    .head .back { width: 40px; height: 40px; padding: 0; flex: none; }
    .head .who .t { font-size: 15px; }
    .head .who .s, .head .who .sline { font-size: 12px; }
    /* a conversation: one row (back, name, ⋯); its actions and figures behind ⋯ */
    .head.chat { flex-wrap: wrap; }
    .head.chat .who { min-width: calc(100% - 112px); }   /* back, the name and ⋯ fill the first row: what ⋯ opens starts on the next */
    .head.chat .more-acts { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; padding: 0; font-size: 20px; flex: none; }
    .head.chat:not(.open) > .btn:not(.back):not(.more-acts), .head.chat:not(.open) > .modes { display: none; }
    .head.chat:not(.open) .who .sline > .s.mode { display: none; }   /* the permission mode: shown with what ⋯ opens */
    .app:not(.acts-open) #info { display: none !important; }
    /* jumping: one round "↓", only when away from the bottom */
    .jump { right: 14px; bottom: 10px; }
    .jump .btn:not(.to-new) { display: none; }
    .scrollwrap:not(.away) .jump { display: none; }
    .jump .to-new { width: 44px; height: 44px; padding: 0; border-radius: 50%; font-size: 0; display: inline-flex; align-items: center; justify-content: center; }
    .jump .to-new::before { content: "\2193"; font-size: 20px; }
    /* a terminal session's foot: one short row */
    .foot .note { font-size: 13px; flex-wrap: nowrap; } .foot .note > span { flex: 1 1 auto; min-width: 0; } .foot .note .btn { flex: none; }
    /* the list: the conversations first - the places on one row of names (their lines left out), sliding sideways
       when there are more than fit; it took three rows (asked 2026-11-19: "the five at the top take too much room") */
    .side-nav { display: flex; flex-wrap: nowrap; gap: 2px; padding: 2px 6px 6px; overflow-x: auto; scrollbar-width: none; }
    .side-nav::-webkit-scrollbar { display: none; }
    /* as wide as its name (a computer's list gives each the whole width); ":root .app" outranks the skins' own padding
       for a place (":root[data-skin=b] button.item" kept it at 10 px a side) */
    :root .app .side-nav button.item { padding: 8px 7px; flex: none; width: auto; }   /* 44 px high: a finger's size */
    .side-nav .item { display: flex; align-items: center; gap: 0; position: relative; }

  view = 'settings'; active = null; closeStream(); setPlace('settings');
  $('app').classList.add('viewing');
  const main = $('main');
  main.textContent = '';
  const head = el('div', 'head');
  const back = el('button', 'btn back', '←'); back.type = 'button'; back.setAttribute('aria-label', '回到清單'); back.addEventListener('click', () => goBack(drawHome));
  const who = el('div', 'who'); who.append(el('div', 't', '設定'), el('div', 's', '存檔後馬上生效'));
  head.append(back, who);
  const scroll = el('div', 'scroll');
  const pane = el('div', 'pane'); pane.style.paddingTop = '28px';
  scroll.append(pane);
  main.append(head, scroll);
  listShape = '';
  drawList();

  let r;
  try { r = await api('/api/config'); } catch (e) { r = { ok: false }; }
  if (view !== 'settings') return;
  if (!r.ok) { pane.append(el('p', 'lead', '讀不到設定，看板程序沒有回應。')); return; }
  let saved = r.data.config.pickerStartDir || '';

  {
    pane.append(el('h2', '', '字級'));
    pane.append(el('p', 'lead', isTouchScreen() ? '手機和平板用的字級，整個看板一起放大或縮小。跟電腦分開設定，這裡改了不影響電腦。' : '電腦用的字級，整個看板一起放大或縮小，包含左欄、對話和按鈕。跟手機分開設定，這裡改了不影響手機。'));
    const seg = el('div', 'seg'); seg.setAttribute('role', 'group'); seg.setAttribute('aria-label', '字級');
    const paint = () => { for (const b of seg.children) { const on = Number(b.dataset.v) === textSize(); b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); } };
    for (const [label, v] of SIZES) { const b = el('button', '', label); b.type = 'button'; b.dataset.v = String(v); b.title = Math.round(v * 100) + '%'; b.addEventListener('click', () => { setTextSize(v); paint(); }); seg.append(b); }
    paint(); pane.append(seg);
    const gap = el('div'); gap.style.height = '28px'; pane.append(gap);
  }
  {
    pane.append(el('h2', '', '外觀'));
    const def = SKINS.find((x) => x[0] === SKIN_DEFAULT());
    pane.append(el('p', 'lead', (isPhone() ? '手機用的外觀，跟電腦分開設定，這裡改了不影響電腦。' : '電腦用的外觀，跟手機分開設定，這裡改了不影響手機。') + '沒選過的話用' + def[1] + '。顏色跟著系統的淺色／深色切換（C 一律深色）。'));
    const box = el('div', 'skins'); box.setAttribute('role', 'group'); box.setAttribute('aria-label', '外觀');
    const paint = () => { for (const b of box.children) { const on = b.dataset.v === skinNow(); b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); } };
    for (const [v, name, desc, side, mainBg, me] of SKINS) {
      const b = el('button'); b.type = 'button'; b.dataset.v = v;
      const pv = el('span', 'pv'); const i = el('i'), m = el('b'); i.style.background = side; m.style.background = mainBg; m.style.setProperty('--pv-me', me); pv.append(i, m);
      b.append(pv, el('span', 'nm', name + (v === SKIN_DEFAULT() ? '（預設）' : '')), el('span', 'ds', desc));
      b.addEventListener('click', async () => { const was = skinNow(); applySkin(v); paint(); if (!(await savePref({ [SKIN_KEY()]: v }))) { applySkin(was); paint(); } });
      box.append(b);
    }
    paint(); pane.append(box);
    const gap = el('div'); gap.style.height = '28px'; pane.append(gap);
  }
  pane.append(el('h2', '', '新對話的起始資料夾'));
  pane.append(el('p', 'lead', '開新對話按「選擇資料夾…」時，那個視窗一開始停在這個資料夾。留空的話由 Windows 決定（通常是上次用的位置）。'));
  const row = el('div', 'pathrow');
  const input = el('input'); input.type = 'text'; input.value = saved; input.placeholder = '例如 C:\\work'; input.setAttribute('aria-label', '新對話的起始資料夾');
  const browse = el('button', 'btn', '選擇資料夾…'); browse.type = 'button'; if (REMOTE) browse.hidden = true;
  const saveBtn = el('button', 'btn primary', '儲存'); saveBtn.type = 'button';
  row.append(input, browse, saveBtn);
  const msg = el('div', 'bad'); msg.setAttribute('role', 'status');
  const note = el('div', 'hint');
  const mark = () => { saveBtn.disabled = input.value.trim() === saved; msg.textContent = ''; };
  const save = async () => {
    saveBtn.disabled = true;
    let s;
    try { s = await api('/api/config', { pickerStartDir: input.value }); } catch (e) { s = { ok: false, data: { error: '看板程序沒有回應' } }; }
    if (view !== 'settings') return;
    if (!s.ok) { msg.textContent = s.data.error || '存不進去'; saveBtn.disabled = false; return; }
    saved = s.data.config.pickerStartDir || '';
    input.value = saved;
    mark();
    say(saved ? '已儲存。下次選資料夾會從 ' + saved + ' 開始' : '已清除，改由 Windows 決定');
  };
  input.addEventListener('input', mark);
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229 && !saveBtn.disabled) save(); });
  saveBtn.addEventListener('click', save);
  browse.addEventListener('click', async () => {
    browse.disabled = true; browse.textContent = '請在跳出的視窗裡選…';
    try { const p = await api('/api/pick-folder', {}); if (p.data.path) { input.value = p.data.path; mark(); } } catch (e) { msg.textContent = '看板程序沒有回應。'; }
    browse.disabled = false; browse.textContent = '選擇資料夾…';
  });
  note.textContent = '設定存在看板的資料庫：' + r.data.file;
  pane.append(row, msg, note);
  mark();

  const h = el('h2', '', '關機後把 session 開回來'); h.style.marginTop = '40px';
  pane.append(h);
  pane.append(el('p', 'lead', '開著的終端機 session 預設都是「常駐」：關機或重開機後，看板首頁會列出它們讓你開回來。你自己關掉、或在看板按「結束」的不算。'));
  const sw = (title, text, on, send, done, to = '/api/config') => {
    const l = el('label', 'switch'); const cb = el('input'); cb.type = 'checkbox'; cb.checked = on;
    const t = el('div'); t.append(el('b', '', title), el('span', '', text));
    cb.addEventListener('change', async () => {
      cb.disabled = true;
      let s;
      try { s = await api(to, send(cb.checked)); } catch (e) { s = { ok: false, data: { error: '看板程序沒有回應' } }; }
      cb.disabled = false;
      if (!s.ok) { cb.checked = !cb.checked; return say(s.data.error || '存不進去', true); }
      say(done(cb.checked));
    });
    l.append(cb, t); pane.append(l);
  };
  const MAC_NOTE = PLATFORM === 'darwin';   // a Mac: Notification Center; clicking a notice does not lead to the session there
  sw('session 做完或等你時跳通知', MAC_NOTE ? ((r.data.notifyOwnChain ? '你的 Claude Code 設定裡已經有自己的通知腳本，「做完」與「等你」的通知由它負責，看板不會再跳一次。這個開關現在管的是排程與「停住的 session 自動處理」的通知。' : '終端機開的 session 與看板裡的對話，做完一輪或需要你核准時，由 Mac 的通知中心跳通知。') + ' Mac 上點通知不會跳到那個 session（只有 Windows 有）。第一次跳通知時，到「系統設定 → 通知」允許「指令碼編寫程式」。') : (r.data.notifyOwnChain ? '你的 Claude Code 設定裡已經有自己的通知腳本，「做完」與「等你」的通知由它負責，看板不會再跳一次。這個開關現在管的是另外兩樣：排程與「停住的 session 自動處理」的通知，以及點通知跳到那個 session 用的登錄。' : '終端機開的 session 與看板裡的對話，做完一輪或需要你核准時跳 Windows 通知；點通知會切到那個 session 的視窗（看板裡的對話則開到這一頁）。') + ' 開著的時候看板會登錄一個只給目前使用者用的網址類型 sessionboard:，關掉就移除。', !!r.data.notify,
    (v) => ({ notify: v }), (v) => v ? '已開啟通知' : (MAC_NOTE ? '已關閉通知' : '已關閉通知，並移除了 sessionboard: 的登錄'));
  sw('登入 Windows 時自動啟動看板', (PLATFORM === 'darwin' ? '在 ~/Library/LaunchAgents 放一個 LaunchAgent（' + r.data.autoStartFile + '），登入時由 macOS 啟動看板。關掉就是卸載並刪除它。' : '在你的「啟動」資料夾放一個檔（' + r.data.autoStartFile + '）。關掉就是把那個檔刪除。'), !!r.data.autoStart,
    (v) => ({ autoStart: v }), (v) => v ? '已開啟：下次登入 Windows 看板會自己啟動' : '已關閉：看板要自己用 /session-board 啟動');
  sw('開回來時，做到一半的自動接著做', '被關機或重開機打斷在工作途中的 session，開回來後看板會替你說一句「接著把被中斷的工作做完」。關掉的話只把它開回來，等你自己說。這會自動用掉額度。', r.data.config.autoContinue !== false,
    (v) => ({ autoContinue: v }), (v) => v ? '已開啟：被打斷的會自動接著做' : '已關閉：開回來後等你指示');
  sw('看板啟動時自動把常駐的 session 開回終端機', '不問，直接每個開一個終端機視窗。關著的話是列在首頁讓你勾選。兩個都開，才是「重開機後全部自己回來」。', !!r.data.config.autoRestore,
    (v) => ({ autoRestore: v }), (v) => v ? '已開啟：看板下次啟動會自動開回常駐的 session' : '已關閉：改成列在首頁讓你選');

  {
    const h2 = el('h2', '', '自動隱藏'); h2.style.marginTop = '40px'; pane.append(h2);
    pane.append(el('p', 'lead', '一個 session 連續這麼多天沒有新動作（沒有人說話、Claude 沒有做事、狀態沒有變），就自動從左欄隱藏。它還開著，清單最下面的「已隱藏」可以再看到；有新動作就會自己回來。正在執行或等你回應的不會被隱藏。填 0 表示不自動隱藏。'));
    const row = el('div', 'pathrow'), inp = el('input'), btn = el('button', 'btn primary', '儲存'); btn.type = 'button';
    inp.type = 'number'; inp.min = '0'; inp.max = '365'; inp.step = '1'; inp.value = String(r.data.autoHideDays == null ? 7 : r.data.autoHideDays); inp.style.maxWidth = '110px'; inp.setAttribute('aria-label', '幾天沒有新動作就自動隱藏');
    row.append(inp, el('span', '', '天'), btn); pane.append(row);
    btn.addEventListener('click', async () => {
      const n = Number(inp.value);
      if (!Number.isInteger(n) || n < 0 || n > 365) return say('天數要是 0 到 365 的整數', true);
      btn.disabled = true; let x; try { x = await api('/api/config', { autoHideDays: n }); } catch (e) { x = { ok: false, data: { error: '看板程序沒有回應' } }; } btn.disabled = false;
      if (!x.ok) return say(x.data.error || '存不進去', true);
      say(n ? '已儲存：' + n + ' 天沒有新動作就自動隱藏' : '已儲存：不自動隱藏'); await poll();
    });
    const P = r.data.prefs || {};
    sw('隱藏其他程式開的 session', '不是你在終端機或看板開的，而是其他程式自己用 Claude Code 開的（例如 claude-mem、goal2 的引擎、harness 的審查、測試），不列在左欄、辦公室與舊對話裡。看板與看板排程開的對話照常顯示。被藏起來的，清單最下面仍可以點開來看。', !!P.hideProgramSessions,
      (v) => ({ hideProgramSessions: v }), (v) => v ? '已開啟：其他程式開的 session 不列出' : '已關閉：全部列出');
    pane.append(el('p', 'lead', '另外，這些資料夾裡的 session 一律不列出，不管上面的開關、也不管是誰開的（包括你在看板開的）。一行一個完整路徑：'));
    const ta = el('textarea'); ta.rows = 3; ta.style.width = '100%'; ta.value = (P.hideProgramFolders || []).join('\n'); ta.setAttribute('aria-label', '一律不列出的資料夾');
    const tb = el('button', 'btn', '儲存資料夾'); tb.type = 'button';
    tb.addEventListener('click', async () => { const list = ta.value.split(/\r?\n/).map((x) => x.trim()).filter(Boolean); tb.disabled = true; const ok = await savePref({ hideProgramFolders: list }); tb.disabled = false; if (ok) { say(list.length ? '已儲存：' + list.length + ' 個資料夾不列出' : '已清空'); poll(); } });
    // the box and its button side by side (below the box, the button was alone on a line)
    const tr = el('div', 'ta-row'); tr.append(ta, tb); pane.append(tr);
  }
  {
    const h2 = el('h2', '', '版面'); h2.style.marginTop = '40px'; pane.append(h2);
    const P = r.data.prefs || {};
    sw('Ctrl+B 收起／展開左欄', '左欄頂端的「«」也可以收起；收起後剩一條細邊，有「»」展開鈕和等你回應的數字。', P.sidebarShortcut !== false,
      (v) => ({ sidebarShortcut: v }), (v) => { features.prefs = Object.assign({}, prefs(), { sidebarShortcut: v }); return v ? '已開啟 Ctrl+B' : '已關閉 Ctrl+B'; });
    sw('辦公室只展開我的最愛', '標了星的房間照常顯示，其他房間收成一列，要看再按「展開」。沒有標星的房間時不影響。', !!P.officeCollapseOthers,
      (v) => ({ officeCollapseOthers: v }), (v) => { features.prefs = Object.assign({}, prefs(), { officeCollapseOthers: v }); return v ? '已開啟：其他房間收起' : '已關閉：全部展開'; });
  }
  {
    const h2 = el('h2', '', '語音輸入'); h2.style.marginTop = '40px'; pane.append(h2);
    pane.append(el('p', 'lead', '輸入框旁的麥克風：按一下開始說，瀏覽器邊聽邊把字寫進框裡，說完再按一次。聽寫與排版的過程中輸入框會鎖住，不能打字也不能送出。辨識由瀏覽器做（Chrome、Edge 會把聲音送到 Google 的辨識服務）。'));
    const P = r.data.prefs || {};
    sw('自動排版', '說完後交給 Claude（sonnet）去掉贅字、補標點，約 1 秒；整理不成就保留原話。關掉就是聽到什麼留什麼。', P.voiceTidy !== false,
      (v) => ({ voiceTidy: v }), (v) => { features.prefs = Object.assign({}, prefs(), { voiceTidy: v }); return v ? '已開啟自動排版' : '已關閉自動排版'; });
    if (r.data.httpsUrl) pane.append(el('p', 'hint', '手機的瀏覽器只讓 https 網頁用麥克風。手機請改開：' + r.data.httpsUrl));
  }
  {
    const h2 = el('h2', '', '小模型判斷'); h2.style.marginTop = '40px'; pane.append(h2);
    pane.append(el('p', 'lead', '「下一步」要不要出現「交給 goal2 做完」，是把最後一則回覆交給小模型回答一題（題目在看板資料夾的 questions/unfinished.json；要改題目，放一份同名檔到 ~/.claude/session-board/questions/）。這裡選用哪個模型。'));
    const row = el('div', 'pathrow'), sel = el('select'); sel.setAttribute('aria-label', '判斷用的模型');
    for (const m of ['haiku', 'sonnet', 'opus']) { const o = el('option', '', m); o.value = m; sel.append(o); }
    sel.value = (r.data.prefs || {}).decideModel || 'haiku';
    sel.addEventListener('change', async () => { if (await savePref({ decideModel: sel.value })) say('已儲存：判斷用 ' + sel.value); });
    row.append(sel); pane.append(row);
  }
  {
    const h2 = el('h2', '', '從另一台電腦操作'); h2.style.marginTop = '40px'; pane.append(h2);
    pane.append(el('p', 'lead', '透過 Tailscale：看板只多聽這台電腦的 Tailscale 位址，公司或家裡的網路都連不到；從那裡進來的連線，只放行登入同一個 Tailscale 帳號的裝置，連線全程加密。另一台電腦要裝 Tailscale 並用同一個帳號登入。'));
    const rm = r.data.remote || {};
    const st = el('div', 'hint'); pane.append(st);
    const showState = async () => {
      let x; try { x = await api('/api/config?devices=1'); } catch (e) { x = { ok: false }; }
      st.textContent = ''; if (!x.ok) { st.textContent = '讀不到狀態'; return; }
      const m = x.data.remote || {}, t = m.tailscale || {};
      if (!t.ok) { st.textContent = t.why || 'Tailscale 不可用'; return; }
      st.append('這台：' + t.name + '（' + t.ip + '），帳號 ' + t.user + '。');
      const mine = (t.devices || []).filter((d) => d.mine);
      st.append(el('br'), mine.length ? '同帳號的其他裝置：' + mine.map((d) => d.name + (d.online ? '' : '（離線）')).join('、') : '同帳號的其他裝置：還沒有。另一台裝好 Tailscale、用同一個帳號登入後會出現在這裡。');
      if (m.listening) {
        const url = 'http://' + m.ip + ':' + m.port + '/?t=' + TOKEN;
        const row = el('div', 'pathrow'); row.style.marginTop = '10px';
        const inp = el('input'); inp.type = 'text'; inp.readOnly = true; inp.value = url; inp.setAttribute('aria-label', '另一台電腦要開的網址');
        const cp = el('button', 'btn', '複製網址'); cp.type = 'button'; cp.addEventListener('click', async () => { try { await navigator.clipboard.writeText(url); say('已複製。在另一台電腦的瀏覽器開一次，之後它會記住'); } catch (e) { inp.select(); say('複製不了，請自己選取', true); } });
        row.append(inp, cp); st.append(row, el('div', 'hint', '這個網址含有看板的金鑰，只貼給你自己的裝置。'));
      }
    };
    sw('允許從 Tailscale 連進來', '預設關閉。打開後立刻生效，看板重啟後也會記得。', rm.on === true, (v) => ({ remoteTailscale: v }), (v) => { setTimeout(showState, 300); return v ? '已開啟：只有你 Tailscale 帳號裡的裝置連得進來' : '已關閉：只有這台電腦能開看板'; });
    pane.insertBefore(st, null);
    showState();
  }
  {
    const h2 = el('h2', '', '外掛整合'); h2.style.marginTop = '40px'; pane.append(h2);
    pane.append(el('p', 'lead', '看板要不要把這些 plugin 整合進來。這台電腦有裝的才會列出，預設打開；關掉的那一項在看板的所有地方都不會出現，看板也不會去讀它的資料或執行它。'));
    const ig = r.data.integrations || {};
    for (const [k, x] of Object.entries(ig)) {
      if (!x.installed) continue;
      sw(x.name, x.what, x.on, (v) => ({ integrations: { [k]: v } }), (v) => { if (!features.integrations) features.integrations = {}; features.integrations[k] = v; pluginsData = null; listShape = ''; drawList(); return x.name + (v ? ' 已整合進看板' : ' 已從看板拿掉'); });
    }
    const missing = Object.values(ig).filter((x) => !x.installed).map((x) => x.plugin);
    if (missing.length) pane.append(el('div', 'hint', '這台電腦沒有裝：' + missing.join('、') + '（裝了之後這裡才會出現它的開關）。'));
  }
  { const h2 = el('h2', '', '選用功能'); h2.style.marginTop = '40px'; pane.append(h2); }
  sw('開分身', '在對話上方多一顆「開分身」：從目前的內容複製出另一個對話，各走各的，原本的不受影響。預設關閉。', r.data.showFork === true,
    (v) => ({ showFork: v }), (v) => { features.fork = v; return v ? '已開啟：對話上方會出現「開分身」' : '已關閉：對話上方不再有「開分身」'; });

  sw('看板沒在跑時自動把它開回來', '排程、收件、停住的 session 自動處理都要看板在跑才有作用。打開後會在 Windows 的工作排程建立一個只屬於你的工作（SessionBoardKeepAlive），每 ' + (r.data.keepAliveEvery || 10) + ' 分鐘檢查一次，看板不在就啟動它。你自己停掉的看板不會被開回來，要等你再手動啟動。關掉就是刪除那個工作。', !!r.data.keepAlive,
    (v) => ({ keepAlive: v }), (v) => v ? '已開啟：看板意外停掉時，十分鐘內會自己回來' : '已關閉，並刪除了那個工作排程');

   on or ended, the month turned), and then it is closed by the board itself - see lib/notices.js. This is not a
   record of Windows notifications: those say something just happened and are gone. */
let noticeOpen = 0;
const NOTICE_KIND = { waiting: '等你回應', done: '做完了', stuck: '可能卡住', limit: '額度用完', error: '被錯誤中斷', schedule: '排程', budget: '預算' };
const CLOSED_BY = { answered: '你回應了', stopped: '那一輪停止了', seen: '你看過了', continued: '它接著做了', resumed: '它恢復執行了', moved: '它又動了', ended: 'session 結束了', dismissed: '你按了不用了', 'month over': '月份過了', 'budget changed': '預算改了', superseded: '已超過預算，改記那一則' };
// Notices: what still needs you now. Not a page - a bell at the top of the left column with the number, and under it,
// when pressed, the list. (#notices, and whatever still calls this, opens it.)
function bellPlace() {
  // the page is scaled as a whole: a fixed box is placed in this page's own units, measured (see fitViewport)
  const pop = $('bellPop'), b = $('bellBtn').getBoundingClientRect(), k = VP.rectPerCss, W = VP.widthCss;
  const w = Math.min(380, W - 24);
  pop.style.top = (b.bottom / k + 6) + 'px';
  pop.style.left = Math.max(12, Math.min(b.left / k, W - w - 12)) + 'px';
}
function closeBell() { const pop = $('bellPop'); if (pop.hidden) return; pop.hidden = true; $('bellBtn').setAttribute('aria-expanded', 'false'); }
function drawNotices() {
  const pop = $('bellPop');
  pop.hidden = false; $('bellBtn').setAttribute('aria-expanded', 'true'); bellPlace();
  if (!$('noticeRows').firstChild) $('noticeRows').append(el('div', 'hint', '讀取中…'));
  fillNotices();
}
document.addEventListener('click', (e) => { if (!$('bellPop').hidden && !e.target.closest('#bellPop, #bellBtn')) closeBell(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('bellPop').hidden) { closeBell(); $('bellBtn').focus(); } });
window.addEventListener('resize', () => { if (!$('bellPop').hidden) bellPlace(); });
async function fillNotices() {
  const box = $('noticeRows'); if (!box) return;
  let r; try { r = await api('/api/notices'); } catch (e) { r = { ok: false }; }
  if ($('bellPop').hidden) return;
  box.textContent = '';
  if (!r.ok) { box.append(el('div', 'hint', '讀不到，看板程序沒有回應。')); return; }
  const tm = (t) => when(t);
  const go = (x) => {
    closeBell();
    const live = x.sessionId && sessions.some((s) => s.sessionId === x.sessionId);
    if (live) return openChat(x.sessionId);
    if (x.kind === 'schedule') return drawSched();
    if (x.kind === 'budget') return drawWar();
    if (x.sessionId) say('這個 session 現在沒有開著，可以到「辦公室」找它', true);
  };
  const now = Date.now();
  const since = (t) => { const a = ago(now - t); return a === '剛剛' ? a : a + '前'; };
  // "做完了：<the session's name>" -> the name; what kind it is stands on the line below
  const subject = (x) => { const t = String(x.title || ''), label = NOTICE_KIND[x.kind] || ''; for (const p of [label + '：', label + ':']) if (label && t.startsWith(p)) return t.slice(p.length).trim() || t; return t; };
  // the sentence under it is only shown where it says something the label does not
  const detail = (x) => (x.kind === 'done' || x.kind === 'waiting' ? '' : String(x.text || ''));
  const row = (x, closed) => {
    const w = el('div', 'bn' + (closed ? ' closed' : ''));
    const main = el('button', 'bn-main'); main.type = 'button';
    const body = el('span', 'bn-body');
    body.append(el('span', 'bn-t', subject(x)));
    const meta = el('span', 'bn-m'); meta.append(el('span', 'bn-k ' + x.kind, NOTICE_KIND[x.kind] || x.kind), ' · ' + since(x.openedAt) + (closed ? ' · ' + (CLOSED_BY[x.closedBy] || x.closedBy || '已結束') : ''));
    body.append(meta);
    if (detail(x)) body.append(el('span', 'bn-x', detail(x)));
    main.append(el('span', 'bn-dot ' + x.kind), body);
    main.title = (x.kind === 'schedule' ? '到排程頁處理' : x.kind === 'budget' ? '到戰情室' : '打開這個 session') + '\n' + new Date(x.openedAt).toLocaleString('zh-TW', { hour12: false });
    main.addEventListener('click', () => go(x));
    w.append(main);
    if (!closed && x.kind !== 'schedule') { const d = el('button', 'bn-off', '✕'); d.type = 'button'; d.title = '知道了，收起這一則（不影響那個 session）'; d.setAttribute('aria-label', '收起這一則：' + subject(x)); d.addEventListener('click', async (e) => { e.stopPropagation(); w.remove(); await api('/api/notices/dismiss', { id: x.id }); fillNotices(); poll(); }); w.append(d); }
    return w;
  };
  // schedule notices live with the schedules (their buttons are on that page); the open ones are listed here too
  const sched = (r.data.schedule || []).map((n) => ({ id: 's' + n.id, kind: 'schedule', sessionId: '', title: '排程要你決定', text: n.text, openedAt: n.at }));
  const open = r.data.open.concat(sched).sort((a, b) => b.openedAt - a.openedAt);
  { const sum = $('bellSum'); sum.textContent = '';
    const mine = open.filter((x) => x.kind !== 'schedule');
    if (mine.length > 1) { const all = el('button', 'bn-all', '全部收起'); all.type = 'button'; all.title = '這 ' + mine.length + ' 則都知道了'; all.addEventListener('click', async () => { all.disabled = true; for (const x of mine) await api('/api/notices/dismiss', { id: x.id }); fillNotices(); poll(); }); sum.append(all); } }
  if (!open.length) box.append(el('div', 'bn-empty', '沒有需要你處理的事'));
  for (const x of open) box.append(row(x, false));

  if (closed.length) {
    const d = el('details'); d.open = bellOld; d.addEventListener('toggle', () => { bellOld = d.open; });
    d.append(el('summary', '', '較早的 ' + closed.length + ' 則'));
    for (const x of closed) d.append(row(x, true));
    const c = el('button', 'list-more', '清掉已經結束的紀錄'); c.type = 'button'; c.addEventListener('click', async () => { await api('/api/notices/clear-closed', {}); fillNotices(); }); d.append(c);

}
let bellOld = false;     // whether the ended notices are unfolded in the list under the bell

function schedWhen(s) {
  if (s.kind === 'once') return s.date + ' ' + s.at + '（一次）';
  if (s.kind === 'daily') return '每天 ' + s.at;
  if (s.kind === 'weekly') return '每週' + String(s.days).split(',').map((d) => WEEK[Number(d)]).join('、') + ' ' + s.at;
  return '每隔 ' + s.everyHours + ' 小時';
}
// ── collaborations: two or more sessions on one goal (server: lib/collab.js) ──

const MODE_WORD = { bypassPermissions: 'bypass（全部不問）', auto: 'auto', acceptEdits: 'acceptEdits', default: 'default', plan: 'plan' };
// One collaboration: members, what is open in the ledger, decisions to make, the messages between them, the ledger.

async function drawSched() {
  view = 'sched'; active = null; closeStream(); setPlace('sched');
  const { pane } = inboxShell('排程', '到點自動在某個資料夾、或接續某個 session 做一件事', drawHome);

  if (view !== 'sched') return;

// Only what you have to act on: the sessions waiting for you or maybe stuck, as the office's faces (its letters, the

const faceInitials = (t) => { const w = String(t || '').trim(); return /^[\x00-\x7f]/.test(w) ? w.replace(/[^A-Za-z0-9]/g, '').slice(0, 2).toUpperCase() || '?' : [...w].slice(0, 1).join(''); };
