  const box = $('railList');

  const rows = all.filter((s) => !s.hidden).sort((a, b) => (b.saidAt || 0) - (a.saidAt || 0) || (b.since || 0) - (a.since || 0)).map((s) => [s, deskState(s, now)]).filter(([s, k]) => s.group === 'yours' || k === 'wait' || k === 'stuck')   // the list's "waiting for you" (the tab's count), and maybe stuck
    .map(([s, k]) => [s, k === 'stuck' ? 'stuck' : 'wait']);   // in the list's colours: amber waits for you, red may be stuck

/* ── slash commands ── */
const cmdCache = new Map();   // sessionId -> {commands, exact}
async function loadCommands(sid) {
  try {
    const r = await api('/api/commands?sid=' + encodeURIComponent(sid));
    if (!r.ok) return;
    cmdCache.set(sid, r.data);
    // How often each was used not counted yet (the board just started): asked again in a little while, so the ones you
    // use most come first (until then the list is in name order)
    if (r.data.counted === false && !loadCommands.again.has(sid)) { loadCommands.again.add(sid); setTimeout(() => loadCommands(sid), 8000); }
    // The list may arrive while "/" is already typed: redraw the popup with it.
    const ta = sid === active && $('foot') ? $('foot').querySelector('textarea') : null;
    if (ta && document.activeElement === ta) ta.dispatchEvent(new Event('focus'));
  } catch (e) {}
}
loadCommands.again = new Set();   // conversations asked a second time for the counts (once each)
// Commands that exist only as interactive screens in the terminal. Claude Code
// does not report these for a conversation run this way, so they are listed
// here to answer "why is /plugin not in the list" instead of showing nothing.
const TERMINAL_ONLY = ['plugin', 'config', 'resume', 'agents', 'mcp', 'permissions', 'hooks', 'status', 'login', 'logout', 'help', 'memory', 'rewind', 'export', 'doctor', 'theme', 'vim', 'ide', 'terminal-setup', 'statusline', 'output-style', 'remote-control', 'add-dir', 'tasks', 'bashes', 'fast', 'effort', 'rename', 'background', 'bg'];
// The ones you use most come first (usage: how many times each was run on this computer, counted by the board every few
// minutes from Claude Code's records - lib/cmduse.js); those that only work in a terminal after the rest.
function usedTimes(usage) {
  // Maps, not plain objects: a command called constructor is just a name (an object would answer with its function)
  const by = new Map(Object.entries(usage || {}).filter(([, v]) => Number.isFinite(v))), short = new Map();
  for (const [k, v] of by) { const t = k.split(':').pop(); if (t !== k) short.set(t, (short.get(t) || 0) + v); }
  return (name) => by.get(name) || short.get(name) || 0;
}
function matchCommands(q, live, usage) {
  const used = usedTimes(usage);
  const have = new Set(live.map((c) => c.name));
  const all = live.concat(TERMINAL_ONLY.filter((n) => !have.has(n)).map((name) => ({ name, terminalOnly: true })));
  const k = q.toLowerCase();
  const rank = (n) => { const x = n.toLowerCase(); return x.startsWith(k) ? 0 : x.split(/[:\-_]/).some((p) => p.startsWith(k)) ? 1 : x.includes(k) ? 2 : 9; };
  return all.map((c) => ({ c, r: rank(c.name), u: used(c.name) })).filter((x) => x.r < 9).sort((a, b) => a.r - b.r || !!a.c.terminalOnly - !!b.c.terminalOnly || b.u - a.u || a.c.name.length - b.c.name.length || a.c.name.localeCompare(b.c.name)).slice(0, 12).map((x) => Object.assign({}, x.c, { used: x.u }));
}

/* ── jumping to what you said ── */
function myMessages() {
  const sc = $('scroll');
  if (!sc) return [];
  // The text size zooms the whole page (html zoom): positions on screen are then that many times the scroll distance,
  // so they are divided back before being used as a scroll position (at 1.3 a jump landed hundreds of pixels too far,
  // under the header).
  const z = parseFloat(getComputedStyle(document.documentElement).zoom) || 1;
  const areaTop = sc.getBoundingClientRect().top;
  return [...sc.querySelectorAll('.msg.user')].map((e) => ({ e, top: Math.max(0, (e.getBoundingClientRect().top - areaTop) / z + sc.scrollTop - 16) }));
}
function flash(e) { e.classList.remove('flash'); void e.offsetWidth; e.classList.add('flash'); }
// Each press goes one of your messages further up from where the view is now.

  let target = null;

const UNFINISHED = /還沒(有)?(做|完成|處理|改|修|驗證|測|跑)|尚未(完成|處理|驗證|實作|修)|未完成|沒做完|剩下的|待辦|待處理|還差|還缺|沒有驗證到/g;

  // the turn just ended: everything after the last thing you said yourself

function dur(ms) {
  const s = Math.floor(Math.max(0, ms) / 1000);
  if (s < 1) return '<1 秒';
  if (s < 90) return s + ' 秒';
  const m = Math.floor(s / 60);
  if (m < 60) return m + ' 分 ' + String(s % 60).padStart(2, '0') + ' 秒';
  return Math.floor(m / 60) + ' 時 ' + String(m % 60).padStart(2, '0') + ' 分';
}
function when(ts) {
  if (!ts) return '';
  const d = new Date(ts), n = new Date();
  const t = d.toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit' });
  return d.toDateString() === n.toDateString() ? t : String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0') + ' ' + t;
}

// This month's figures as one CSV file: a section a block, a blank line between them. With a byte-order mark, so Excel reads the Chinese.
function exportUsage(d, ym) {
  const q = (v) => { const t = v == null ? '' : String(v); return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  const row = (...a) => a.map(q).join(',');

  const out = [row('月份', ym), row('API 等值費用 (USD)', n2(d.total.cost)), row('總 tokens', d.total.tok), row('計算時間', new Date(d.computedAt).toLocaleString('zh-TW', { hour12: false })), ''];
  out.push(row('每日'), row('日期', '費用 (USD)', 'tokens', '輸入', '輸出', '寫入快取', '讀取快取', '呼叫次數'));
  for (const x of d.days) out.push(row(ym + '-' + String(x.day).padStart(2, '0'), n2(x.cost), x.tok, x.in, x.out, x.cw, x.cr, x.n));
  out.push('', row('各模型'), row('模型', '費用 (USD)', 'tokens', '呼叫次數'));
  for (const x of d.models || []) out.push(row(x.model, n2(x.cost), x.tok, x.n));
  out.push('', row('各專案'), row('專案', '資料夾', '費用 (USD)', 'tokens', '呼叫次數'));
  for (const x of d.projects || []) out.push(row(x.name, x.path, n2(x.cost), x.tok, x.n));
  out.push('', row('各角色'), row('角色', '費用 (USD)', 'tokens', '次數', '呼叫次數'));
  for (const x of d.roles || []) out.push(row(x.role === '' ? '主對話' : x.role, n2(x.cost), x.tok, x.runs, x.n));
  out.push('', row('各 session'), row('session', '標題', '專案', '費用 (USD)', 'tokens', '呼叫次數', '本月第一次', '本月最後一次'));
  const ts = (t) => (t ? new Date(t).toLocaleString('zh-TW', { hour12: false }) : '');
  for (const x of d.sessions || []) out.push(row(x.sessionId, x.title, x.projectName, n2(x.cost), x.tok, x.n, ts(x.first), ts(x.last)));
  const blob = new Blob(['\uFEFF' + out.join('\r\n')], { type: 'text/csv;charset=utf-8' });

}

    box.append(el('div', 'mexplain', '主對話是你直接對話的 session 自己用掉的；其他每一列是從對話派出去的子代理或團隊成員，依它的角色加總。次數＝本月有用量的對話數或派工次數，每次平均＝費用 ÷ 次數。各列加起來等於本月總額。滑鼠停在一列上看它花在哪些專案。'));
  } else if (Array.isArray(d.roles) && d.rolesCover === 0) box.append(el('div', 'mexplain', '這個月的對話紀錄已經被 Claude Code 清掉了，算不出各角色各花多少。上面的總額是當時記下的。'));
  else if (!Array.isArray(d.roles) && d.files) box.append(el('div', 'mexplain', '這個月是舊版算的，沒有分角色。按「重新計算」就有（已經被 Claude Code 清掉紀錄的部分算不回來）。'));
  // One table of sessions: what each cost this month, joined with what is known
  // about the ones that are still open (compactions, context in use, messages).
  // Every session with usage this month is in it; the open ones are always
  // shown, the rest beyond the first TOP_SESSIONS on request.
  const liveBy = new Map(sessions.map((s) => [s.sessionId, s]));
  const statBy = new Map(((war && war.usage) || []).map((u) => [u.sessionId, u]));
  const inMonth = new Set(d.sessions.map((s) => s.sessionId));
  const rows = d.sessions.map((s) => ({ id: s.sessionId, title: s.title, project: s.projectName, cost: s.cost, tok: s.tok, first: s.first, last: s.last }));
  for (const s of sessions) if (!inMonth.has(s.sessionId)) rows.push({ id: s.sessionId, title: s.title, project: s.folder, cost: null, tok: null });
  const shownRows = rows.filter((r, i) => showAllSessions || i < TOP_SESSIONS || liveBy.has(r.id));
  const st = table('各 session（本月費用由高到低，共 ' + sep(rows.length) + ' 個；有圓點的是還開著的）', ['session', '本月費用', '佔比', '本月 tokens', '壓縮', 'context', '訊息'], shownRows.map((r) => {
    const s = liveBy.get(r.id), u = statBy.get(r.id);
    const name = el('span', 't');
    if (s) name.append(el('span', 'dot ' + s.group));
    name.append((s ? s.title : r.title || 'session ' + r.id.slice(0, 8)) + '　·　' + (r.project || ''));
    const tip = (r.first ? '本月 ' + when(r.first) + ' 到 ' + when(r.last) + '。' : '這個編號在本月沒有算到用量（可能這個月還沒用，或用量記在它被搬動前的編號下）。')
      + (s ? '還開著，點了打開對話' : '已經關閉');
    return line([name, r.cost == null ? '—' : d.priced ? '$' + sep(r.cost, 2) : '—', r.cost == null ? '—' : share(r.cost), r.tok == null ? '—' : bigNum(r.tok),
      u && u.compacts != null ? sep(u.compacts) + ' 次' : '—', u ? (u.contextPct != null ? u.contextPct + '%' : u.context ? bigNum(u.context) + ' tokens' : '—') : '—', u && u.messages != null ? sep(u.messages) : '—'],
      tip, s ? () => openChat(r.id) : null);
  }));
  st.classList.add('wide');
  box.append(st);
  if (rows.length > shownRows.length || showAllSessions) {
    // on the table's title line, after the title (below the table it was a button alone on a line)
    const more = el('button', 'btn', showAllSessions ? '只顯示前 ' + TOP_SESSIONS + ' 個與還開著的' : '顯示全部 ' + sep(rows.length) + ' 個'); more.type = 'button'; more.style.marginLeft = '10px'; more.style.fontWeight = '400';
    more.addEventListener('click', () => { showAllSessions = !showAllSessions; drawMonth(); });
    st.querySelector('h4').append(more);
  }
  if (d.unpricedTok || d.approxTok) box.append(el('div', 'quiet', (d.approxTok ? bigNum(d.approxTok) + ' tokens 用的是相近模型的暫估單價。' : '') + (d.unpricedTok ? bigNum(d.unpricedTok) + ' tokens 查不到單價，沒算進費用。' : '')));
  if (!cur) box.append(el('div', 'quiet', '過去月份算過一次就存起來。Claude Code 會定期清掉舊的對話紀錄，之後才按「重新計算」數字可能變小。'));
}

async function pollWar() {
  let r;
  try { r = await api('/api/warroom'); } catch (e) { return; }
  if (view !== 'war' || !r.ok) return;
  war = r.data;
  fillWar();
}

// The war room is the month. What it polls for is the per-session figures
// (compactions, context, messages) that the session table joins in.
function fillWar() {
  if (view !== 'war' || !war) return;
  const shape = JSON.stringify(war.usage) + sessions.map((s) => s.sessionId + s.group + s.title).join('|');
  if (shape !== warShape) { warShape = shape; drawMonth(); }
}
function tickWar() {}

/* ── staying current ──
   The page is one file that a browser tab loads once. When the board is
   updated, an open tab would keep running the old code. So the server says
   which page file it now has, and a tab that was loaded from a different one
   reloads itself - unless that would throw away something being typed or
   answered, in which case it says so and waits to be clicked. Where you were
   (which conversation, the war room, settings) is kept in the address, so a
   reload comes back to the same place. */
let pageTag = null;
function unsavedWork() {
  if (pending.size) return true;                                    // an approval or a question form is open
  // a board conversation's box is not unsaved: what is in it is kept as its draft (saved below before reloading) and put
  // back after - with drafts, the box held words nearly always, and a new version never came in (2026-11-19)
  // ... its words only: pictures, files and a message brought from the inbox are held by this page alone, so with any of
  // those the box is unsaved as before
  const c = cur(), held = c && ((pendingImgs.get(c.sessionId) || []).length || (pendingFiles.get(c.sessionId) || []).length || carry.has(c.sessionId));
  const kept = c && c.owner === 'board' && !held && $('foot') ? $('foot').querySelector('textarea') : null;
  for (const x of document.querySelectorAll('textarea, input[type=text]')) if (x !== kept && x.value.trim() && x.id !== 'never') return true;
  return false;
}
// "The phone's address", always at the bottom of the left column (it was only in 設定, behind a switch): copied on a
// click and shown, so it can be sent to the phone. The address is the one the board answers on over Tailscale; while
// that is off or not up yet, it says so and offers the setting.
(function phoneLink() {
  const box = $('sidePhone'); if (!box || REMOTE) return;
  // A small button at the end of the line at the bottom (not a row of its own); copied, it says so and shows nothing more.
  const b = el('button', 'btn', '手機網址'); b.type = 'button'; b.title = '複製手機要開的網址（手機裝 Tailscale、登入同一個帳號）';
  b.addEventListener('click', async () => {
    let x; try { x = await api('/api/config'); } catch (e) { x = { ok: false }; }
    const m = (x.ok && x.data.remote) || {};
    if (!m.on || !m.listening) { say(!m.on ? '還沒開「允許從 Tailscale 連進來」，手機連不進來；已打開設定，開關在「從別台連進來」' : 'Tailscale 還沒連上，看板會自己重試；連上後再按一次', true); if (!m.on) drawSettings(); return; }
    const url = 'http://' + m.ip + ':' + m.port + '/?t=' + TOKEN;
    try { await navigator.clipboard.writeText(url); say('已複製手機網址。這個網址含看板的金鑰，只傳給你自己的裝置'); }
    catch (e) {   // the browser would not copy: shown, selected, gone once you click elsewhere
      const inp = el('input'); inp.type = 'text'; inp.readOnly = true; inp.value = url; inp.setAttribute('aria-label', '手機要開的網址');
      box.append(inp); inp.select(); inp.addEventListener('blur', () => inp.remove(), { once: true });
      say('瀏覽器不讓直接複製，網址已選好在左下角，請按 Ctrl+C', true);
    }
  });
  box.append(b);
})();
// The words in the board conversations' boxes, saved as their drafts (they come back after the reload); then reloaded.
async function reloadKeepingDrafts(pressed) {
  const box = cur() && cur().owner === 'board' && $('foot') ? $('foot').querySelector('textarea') : null;
  if (box) draftNow.set(cur().sessionId, box.value.replace(/［[檔圖]\d+］/g, ''));
  const saves = [draftSettled()];   // (one still on its way from before, then each of these)
  for (const [sid, t] of draftNow) { clearTimeout(draftTimers.get(sid)); saves.push(saveDraft(sid, t)); }
  // Not reloaded until every one is kept: one refused or not back in 3 seconds leaves the button to press instead.
  // Pressed with that so: said once; pressed again, reloaded as asked.
  const all = await Promise.race([Promise.all(saves).then((a) => a.every((x) => x !== false)), new Promise((r) => setTimeout(() => r(false), 3000))]);
  if (all || (pressed && pageUnsavedOnce === 'told')) { location.reload(); return; }
  if (pressed) { pageUnsavedOnce = 'told'; return say('輸入框裡的字還沒存到看板（存檔沒有回來或被拒）。再按一次就直接重新整理，沒存到的字會不見', true); }
  pageUnsavedOnce = true; newPageAvailable();
}
let pageUnsavedOnce = false;   // the save before reloading did not come back: from now on ask, do not reload by itself
function newPageAvailable() {
  if (!pageUnsavedOnce && !unsavedWork()) { reloadKeepingDrafts(); return; }
  const foot = $('sideFoot');
  if (foot.dataset.newer) return;
  foot.dataset.newer = '1';
  foot.className = 'side-foot';
  const text = $('sideFootText'); text.textContent = '';   // the text part only: the phone button beside it stays
  const tip = '你有卡片還沒回覆或有填到一半的欄位，所以沒有自動重新整理';
  const b = el('button', 'btn primary', '看板有新版，按這裡重新整理'); b.type = 'button'; b.title = tip;
  b.addEventListener('click', () => reloadKeepingDrafts(true));
  text.append(b);
  // On a phone (and with the left column folded) that line is not shown: the same button over the top of the page
  // (0.10.0 hid the line on a phone, and a page left open stayed on the old version - seen 2026-11-19).
  if (!$('newBar')) { const bar = el('button', '', '看板有新版，按這裡重新整理'); bar.id = 'newBar'; bar.type = 'button'; bar.title = tip; bar.addEventListener('click', () => reloadKeepingDrafts(true)); document.body.append(bar); }
}
const setPlace = (hash) => { let at = location.hash.replace(/^#/, ""); try { at = decodeURIComponent(at); } catch (e) {} if (at !== String(hash || "")) closeBell();   // another page (not a redraw of the same one): the notices box does not stay over it
 const url = location.pathname + location.search + (hash ? '#' + hash : '');
  // another page: a new entry in the browser's history, so its back button comes back here (a redraw of the same page,
  // the first page drawn, or a page reached through the history itself: the entry is only rewritten)
  try { if (placeQuiet || at === String(hash || '')) history.replaceState({ sb: placeDepth }, '', url); else { placeDepth++; history.pushState({ sb: placeDepth }, '', url); } } catch (e) {} };
// How many of the board's own pages are behind this one in this tab (0: opened here directly), and whether moving now
// should leave the history as it is (while the first page is chosen, and while following the browser's back / forward).
let placeDepth = (history.state && history.state.sb) || 0, placeQuiet = true;
// The page's ← : the page before, as the browser's back button would - or, when this tab came straight here, the given one.
function goBack(fallback) { if (placeDepth > 0) history.back(); else fallback(); }
window.addEventListener('popstate', (e) => {
  placeDepth = (e.state && e.state.sb) || 0;
  let at = ''; try { at = decodeURIComponent(location.hash.slice(1)); } catch (x) {}
  placeQuiet = true; try { goPlace(at); } finally { placeQuiet = false; }
});

/* ── account limits in the sidebar ── */
let sideQuotaData = null;
function drawSideQuota() {
  const box = $('sideQuota'), q = sideQuotaData || {};
  box.textContent = '';
  const row = (label, w) => {
    const r = el('div', 'sq');
    const bar = el('div', 'mbar'); const fill = el('div', 'mfill' + (w.pct >= 90 ? ' hot' : w.pct >= 70 ? ' warm' : '')); fill.style.width = Math.min(100, w.pct) + '%'; bar.append(fill);
    const sl = el('span', 'sl', label); sl.append(el('span', 'sx', '額度'));   // "額度" left out on a phone, where the two stand side by side
    r.append(sl, bar, el('b', '', w.pct + '%'), el('span', 'sr', left(w.resetsAt) + '後重置'));
    r.title = label + '額度已用 ' + w.pct + '%，' + left(w.resetsAt) + '後重置；整個帳號所有 session 共用';
    box.append(r);
  };
  if (q.fiveHour) row('5 小時', q.fiveHour);
  if (q.sevenDay) row('7 天', q.sevenDay);
  box.classList.toggle('one', box.querySelectorAll('.sq').length === 1);   // one limit only (the 5-hour one is not always reported): the whole row
  if (box.firstChild && q.seenAt && Date.now() - q.seenAt > 10 * 60000) box.append(el('div', 'sr', ago(Date.now() - q.seenAt) + '前的數字'));
  box.hidden = !box.firstChild;
}
async function loadSideQuota() {
  try { const r = await api('/api/quota'); if (r.ok) { sideQuotaData = r.data; drawSideQuota(); } } catch (e) {}
}

/* ── polling ── */
function notice(lines) {
  const main = $('main');
  main.textContent = '';
  const pane = el('div', 'pane');
  pane.append(el('h2', '', lines[0]), el('p', 'lead', lines[1]));
  main.append(pane);
}

async function poll() {
  if (!TOKEN) return;   // nothing would be answered (see noKey)
  if (!TOKEN) return notice(['這個網址少了金鑰', '請在 Claude Code 裡輸入 /session-board 重新開啟這一頁。']);
  try {
    const r = await api('/api/sessions');
    if (r.status === 401) return notice(['金鑰不對', '請在 Claude Code 裡輸入 /session-board 重新開啟這一頁。']);
    if (!r.ok) throw new Error('HTTP ' + r.status);
    { const was = noticeOpen; noticeOpen = r.data.noticeOpen || 0;
      const bn = $('bellN'); bn.hidden = !noticeOpen; bn.textContent = noticeOpen > 99 ? '99+' : String(noticeOpen);
      $('bellBtn').classList.toggle('has', !!noticeOpen); $('bellBtn').title = noticeOpen ? '通知：' + noticeOpen + ' 件還沒處理' : '通知：沒有要處理的';
      if (!$('bellPop').hidden && was !== noticeOpen) fillNotices(); }
    schedNotices = r.data.schedNotices || 0;
    $('schedDot').className = 'dot' + (schedNotices ? ' yours' : ''); $('schedSub').textContent = schedNotices ? schedNotices + ' 則通知等你處理' : '到點自動做一件事';
    features = r.data.features || {};
    PLATFORM = features.platform || '';
    syncTextSize(features[SIZE_KEY()]);
    if (features.prefs) syncSkin(features.prefs[SKIN_KEY()]);
    applyFold();
    sessions = r.data.sessions.filter((s) => !s.notStarted);
    for (const s of sessions) if (s.programHidden) { s.hidden = true; s.hiddenWhy = 'program'; }
    unstarted = r.data.sessions.filter((s) => s.notStarted);
    if (r.data.page) { if (pageTag === null) pageTag = r.data.page; else if (r.data.page !== pageTag) return newPageAvailable(); }
    down = false; $('downBar').hidden = true;
    $('sideFoot').className = 'side-foot';
    if (!$('sideFoot').dataset.newer) $('sideFootText').textContent = sessions.length + ' 個 session · 更新於 ' + new Date().toLocaleTimeString('zh-TW', { hour12: false });
    drawList();
    if (beats % 5 === 0 || !sideQuotaData) loadSideQuota(); else drawSideQuota();   // asked every 15 seconds; the countdown is redrawn every poll
    if (beats % 5 === 0) await loadKeep();
    inboxCounts = r.data.inbox;
    $('inboxBtn').hidden = !inboxCounts;
    if (inboxCounts) {
      $('inboxDot').className = 'dot' + (inboxCounts.unread ? ' yours' : '');
      $('inboxSub').textContent = inboxCounts.valid ? inboxCounts.valid + ' 件要你處理' : inboxCounts.pending ? inboxCounts.pending + ' 串還沒判讀' : '沒有要你處理的';
      $('inboxDot').className = 'dot' + (inboxCounts.valid ? ' yours' : '');
      if (view === 'inbox' && !inboxOpen && beats % 5 === 0) fillInbox();
    }
    const running = sessions.filter((s) => s.status === 'busy' || s.status === 'background').length;
    $('warDot').className = 'dot' + (running ? ' running' : '');
    // What is inside: this month's figure (asked once a minute; the board keeps it for that long anyway).
    if (beats % 20 === 0 || !warSubInfo.at) { warSubInfo.at = Date.now(); api('/api/usage').then((u) => { if (u.ok && u.data.total) warSubInfo.text = u.data.priced ? '本月 $' + sep(u.data.total.cost, 0) : '本月 ' + bigNum(u.data.total.tok) + ' tokens'; }).catch(() => {}); }
    $('warSub').textContent = (warSubInfo.text || '每月用量與費用') + (running ? ' · ' + running + ' 個執行中' : '');
    $('warBtn').classList.toggle('active', view === 'war');
    if (view === 'war') pollWar();
    if (view === 'chat') {
      const s = cur();
      // A terminal session has no stream: its conversation is re-read while you watch it.
      if (s && s.owner === 'terminal') { drawHead(); loadHistory(false); }
      if (s && beats % 2 === 0) loadStats(s.sessionId);   // every 6 seconds: this is also where a terminal session's running subagents come from
      if (!s) { drawHead(); drawFoot(); }
    } else if (view === 'home') {
      const shape = sessions.filter((s) => s.group === 'yours').map((s) => s.sessionId + s.title).join('|') + '#' + keepShape();
      // Not while you are typing in the search box: redrawing would take the box away from under you.
      const typing = document.activeElement && document.activeElement.type === 'search';
      if ((shape !== homeShape && !typing) || !$('main').firstChild) { homeShape = shape; drawHome(); }
    }
  } catch (e) {
    if (!down) { down = true; $('sideFoot').className = 'side-foot down'; $('sideFootText').textContent = '看板程序沒有回應，畫面是舊的。輸入 /session-board 重新啟動'; }
    // also at the top of every page: the line above is not seen on a phone (the list's foot is left out there) nor in
    // a conversation; gone by itself when the board answers again
    const bar = $('downBar'); bar.textContent = REMOTE ? '連不到看板，畫面是舊的。網路恢復或看板重新啟動後會自己接上' : '看板程序沒有回應，畫面是舊的。在 Claude Code 輸入 /session-board 重新啟動'; bar.hidden = false;
  }
}

$('newBtn').addEventListener('click', drawNew);
$('warBtn').addEventListener('click', drawWar);
$('setBtn').addEventListener('click', drawSettings);
$('bellBtn').addEventListener('click', () => { if ($('bellPop').hidden) drawNotices(); else closeBell(); });
$('inboxBtn').addEventListener('click', drawInbox);
$('officeBtn').addEventListener('click', drawOffice);
$('schedBtn').addEventListener('click', drawSched);
$('collabBtn').addEventListener('click', () => drawCollab());
$('plugBtn').addEventListener('click', () => drawPlugins());
$('homeBtn').addEventListener('click', drawHome);
setInterval(() => { tickWar(); tickTasks(); tickOffice(); tickSched(); }, 1000);
// Come back to where the address says you were (set by setPlace as you move around).
// Read before the first poll: that poll draws the home view, which clears the address.
const startAt = (() => { try { return decodeURIComponent(location.hash.slice(1)); } catch (e) { return ''; } })();
// A browser that was never given the key (or whose stored site data was cleared) can do nothing: every request is
// refused. It is said so, with the way to get in, instead of an empty page.
function noKey() {
  const main = $('main'); if (!main) return new Promise(() => {});
  main.textContent = '';
  const box = el('div', 'pane'); box.style.padding = '48px 28px'; box.style.maxWidth = '640px';
  box.append(el('h2', '', '這個瀏覽器沒有看板的金鑰'));
  box.append(el('p', 'lead', '看板只回應帶著金鑰的請求。金鑰第一次是放在網址裡帶進來的，之後記在瀏覽器裡；這個瀏覽器沒有記到（第一次用這個瀏覽器開，或它的網站資料被清掉了）。'));
  box.append(el('p', 'lead', '怎麼進來：用帶金鑰的網址開一次就好。在 Claude Code 裡請 Claude「開啟 session 看板」，或在終端機執行這個外掛的 scripts/start.js，它會印出那個網址；點任何一則看板的 Windows 通知也可以。'));
  main.append(box);
  return new Promise(() => {});
}
// The page an address names (#war, #settings, a conversation's id ...): on opening, and on the browser's back / forward.
function goPlace(at) {
  if (at === 'war') drawWar();
  else if (at === 'settings') drawSettings();
  else if (at === 'inbox') drawInbox();
  else if (at === 'past') drawPastPage();
  else if (at === 'office') drawOffice();
  else if (at === 'sched') drawSched();
  else if (at === 'collab') drawCollab();
  else if (/^collab-\d+$/.test(at)) drawCollabOne(Number(at.slice(7)));
  else if (at === 'plugins') drawPlugins();
  else if (at === 'notices') { redrawLists(); drawNotices(); }
  else if (at === 'new') drawNew();
  else if (at && sessions.some((s) => s.sessionId === at)) openChat(at);
  else if (at === '' && view !== 'home') drawHome();
  else redrawLists();
}
(TOKEN ? poll() : noKey()).then(() => { goPlace(startAt); placeQuiet = false; });
// Every 3 seconds while the tab is showing, every 15 while it is not: the count
// in the tab title is what gets read when the tab is in the background.
let beats = 0;
const warSubInfo = { at: 0, text: '' };
setInterval(() => { beats++; if (!document.hidden || beats % 5 === 0) poll(); }, 3000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll(); });
</script>
